<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON 格式化/验证器 - tool.pumf.top</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0abFA5;
      --color-on-primary: #ffffff;
      --color-primary-hover: #08d9a3;
      --color-primary-soft: rgba(10, 191, 165, 0.08);
      --color-error: #ef4444;
      --color-success: #10b981;
      --color-ink: #1a1a2e;
      --color-body: #5c5c72;
      --color-muted: #9494a8;
      --color-canvas: #ffffff;
      --color-canvas-soft: #f8f9fb;
      --color-canvas-soft-2: #f0f2f8;
      --color-border: rgba(0, 0, 0, 0.07);
      --radius-sm: 6px;
      --radius-md: 12px;
      --space-xs: 8px;
      --space-sm: 12px;
      --space-md: 16px;
      --space-lg: 24px;
      --font-sans: 'Inter', sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--color-canvas-soft);
      color: var(--color-ink);
      min-height: 100vh;
    }
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-border);
      height: 56px; display: flex; align-items: center;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      width: 100%;
    }
    .nav-logo {
      font-size: 16px; font-weight: 600; color: var(--color-ink);
      text-decoration: none;
    }
    .nav-logo span { color: var(--color-primary); }
    .nav-back {
      font-size: 14px; color: var(--color-body); text-decoration: none;
      display: flex; align-items: center; gap: 6px;
    }
    .nav-back:hover { color: var(--color-primary); }
    .container {
      max-width: 1200px; margin: 0 auto; padding: 24px;
    }
    .header {
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 24px; font-weight: 600; letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 14px; color: var(--color-body);
    }
    .toolbar {
      display: flex; gap: 8px; margin-bottom: 16px;
      flex-wrap: wrap; align-items: center;
    }
    .btn {
      padding: 8px 16px; border: 1px solid var(--color-border);
      background: var(--color-canvas); border-radius: var(--radius-sm);
      font-size: 13px; cursor: pointer; transition: all 0.2s;
      color: var(--color-body);
    }
    .btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .btn-primary {
      background: var(--color-primary); color: var(--color-on-primary);
      border-color: var(--color-primary);
    }
    .btn-primary:hover {
      background: var(--color-primary-hover);
      color: var(--color-on-primary);
    }
    .btn-danger {
      background: var(--color-error); color: #fff;
      border-color: var(--color-error);
    }
    .btn-success {
      background: var(--color-success); color: #fff;
      border-color: var(--color-success);
    }
    .status {
      padding: 8px 16px; border-radius: var(--radius-sm);
      font-size: 13px; display: flex; align-items: center; gap: 8px;
    }
    .status.error {
      background: rgba(239, 68, 68, 0.1); color: var(--color-error);
    }
    .status.success {
      background: rgba(16, 185, 129, 0.1); color: var(--color-success);
    }
    .editor-container {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      height: calc(100vh - 280px);
    }
    .panel {
      background: var(--color-canvas); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); overflow: hidden;
      display: flex; flex-direction: column;
    }
    .panel-header {
      padding: 12px 16px; background: var(--color-canvas-soft);
      border-bottom: 1px solid var(--color-border);
      font-size: 13px; font-weight: 500; color: var(--color-body);
      display: flex; justify-content: space-between; align-items: center;
    }
    textarea {
      flex: 1; border: none; padding: 16px; font-family: var(--font-mono);
      font-size: 14px; line-height: 1.6; resize: none; outline: none;
      background: var(--color-canvas); color: var(--color-ink);
      tab-size: 2;
    }
    .output {
      flex: 1; padding: 16px; overflow: auto;
      font-family: var(--font-mono); font-size: 13px; line-height: 1.6;
      background: var(--color-canvas); white-space: pre-wrap;
      word-break: break-all;
    }
    .json-key { color: #0066cc; }
    .json-string { color: #008000; }
    .json-number { color: #ff6600; }
    .json-boolean { color: #cc00cc; }
    .json-null { color: #999; }
    .stats-bar {
      display: flex; gap: 24px; padding: 12px 16px;
      background: var(--color-canvas-soft); border-top: 1px solid var(--color-border);
      font-size: 12px; color: var(--color-muted);
    }
    .stat-item {
      display: flex; align-items: center; gap: 6px;
    }
    .stat-value {
      color: var(--color-ink); font-weight: 500;
    }
    @media (max-width: 900px) {
      .editor-container { grid-template-columns: 1fr; height: auto; }
      .panel { min-height: 300px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">tool<span>.pumf.top</span></a>
      <a href="/" class="nav-back">← 返回首页</a>
    </div>
  </nav>
  
  <div class="container">
    <div class="header">
      <h1>JSON 格式化/验证器</h1>
      <p>格式化、压缩、验证 JSON。纯本地处理，数据不上传。</p>
    </div>
    
    <div class="toolbar">
      <button class="btn btn-primary" onclick="formatJSON()">格式化</button>
      <button class="btn" onclick="compressJSON()">压缩</button>
      <button class="btn" onclick="sortKeys()">排序键名</button>
      <button class="btn" onclick="escapeJSON()">转义</button>
      <button class="btn" onclick="unescapeJSON()">去转义</button>
      <button class="btn" onclick="toBase64()">→ Base64</button>
      <button class="btn" onclick="fromBase64()">Base64 →</button>
      <button class="btn btn-danger" onclick="clearAll()">清空</button>
      <button class="btn btn-success" onclick="copyOutput()">复制结果</button>
      <input type="file" id="fileInput" accept=".json,.txt" style="display:none" onchange="loadFile(event)">
      <button class="btn" onclick="document.getElementById('fileInput').click()">导入 JSON</button>
      <button class="btn" onclick="downloadJSON()">下载 JSON</button>
    </div>
    
    <div class="toolbar" id="statusBar" style="display:none;"></div>
    
    <div class="editor-container">
      <div class="panel">
        <div class="panel-header">
          <span>输入 (JSON)</span>
          <span id="inputStats">0 字符</span>
        </div>
        <textarea id="input" placeholder="在此粘贴 JSON..." oninput="autoValidate()">{"name": "示例", "version": "1.0", "features": ["格式化", "验证", "压缩"], "config": {"autoSave": true, "theme": "dark"}, "count": 42, "enabled": true, "data": null}</textarea>
        <div class="stats-bar">
          <div class="stat-item">行数: <span class="stat-value" id="lineCount">0</span></div>
          <div class="stat-item">对象: <span class="stat-value" id="objCount">0</span></div>
          <div class="stat-item">数组: <span class="stat-value" id="arrCount">0</span></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-header">
          <span>输出</span>
          <span id="outputStats">0 字符</span>
        </div>
        <div id="output" class="output"></div>
        <div class="stats-bar">
          <div class="stat-item">大小: <span class="stat-value" id="sizeDiff">-</span></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const statusBar = document.getElementById('statusBar');
    
    function showStatus(msg, type = 'error') {
      statusBar.innerHTML = `<div class="status ${type}">${type === 'success' ? '✓' : '✗'} ${msg}</div>`;
      statusBar.style.display = 'flex';
    }
    
    function hideStatus() {
      statusBar.style.display = 'none';
    }
    
    function syntaxHighlight(json) {
      if (!json) return '';
      return json
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/(".*?"):/g, '<span class="json-key">$1</span>:')
        .replace(/: "(.*?)"/g, ': <span class="json-string">"$1"</span>')
        .replace(/: (-?\d+\.?\d*)/g, ': <span class="json-number">$1</span>')
        .replace(/: (true|false)/g, ': <span class="json-boolean">$1</span>')
        .replace(/: (null)/g, ': <span class="json-null">$1</span>');
    }
    
    function updateStats(json) {
      const lines = json.split('\n').length;
      const objMatch = json.match(/\{/g);
      const arrMatch = json.match(/\[/g);
      document.getElementById('lineCount').textContent = lines;
      document.getElementById('objCount').textContent = objMatch ? objMatch.length : 0;
      document.getElementById('arrCount').textContent = arrMatch ? arrMatch.length : 0;
      document.getElementById('inputStats').textContent = `${json.length} 字符`;
    }
    
    function formatJSON() {
      try {
        const text = input.value.trim();
        if (!text) return;
        const obj = JSON.parse(text);
        const formatted = JSON.stringify(obj, null, 2);
        output.innerHTML = syntaxHighlight(formatted);
        document.getElementById('outputStats').textContent = `${formatted.length} 字符`;
        const diff = ((formatted.length - text.length) / text.length * 100).toFixed(1);
        document.getElementById('sizeDiff').textContent = diff > 0 ? `+${diff}%` : `${diff}%`;
        showStatus('格式化成功', 'success');
        localStorage.setItem('json_input', text);
      } catch (e) {
        showStatus(e.message, 'error');
        output.textContent = e.message;
      }
    }
    
    function compressJSON() {
      try {
        const text = input.value.trim();
        if (!text) return;
        const obj = JSON.parse(text);
        const compressed = JSON.stringify(obj);
        output.textContent = compressed;
        document.getElementById('outputStats').textContent = `${compressed.length} 字符`;
        const diff = ((text.length - compressed.length) / text.length * 100).toFixed(1);
        document.getElementById('sizeDiff').textContent = `节省 ${diff}%`;
        showStatus('压缩成功', 'success');
      } catch (e) {
        showStatus(e.message, 'error');
      }
    }
    
    function sortKeys() {
      try {
        const text = input.value.trim();
        if (!text) return;
        const obj = JSON.parse(text);
        const sorted = sortObjectKeys(obj);
        const formatted = JSON.stringify(sorted, null, 2);
        output.innerHTML = syntaxHighlight(formatted);
        showStatus('键名排序完成', 'success');
      } catch (e) {
        showStatus(e.message, 'error');
      }
    }
    
    function sortObjectKeys(obj) {
      if (Array.isArray(obj)) {
        return obj.map(sortObjectKeys);
      } else if (obj !== null && typeof obj === 'object') {
        return Object.keys(obj).sort().reduce((acc, key) => {
          acc[key] = sortObjectKeys(obj[key]);
          return acc;
        }, {});
      }
      return obj;
    }
    
    function escapeJSON() {
      const text = input.value;
      const escaped = JSON.stringify(text).slice(1, -1);
      output.textContent = escaped;
      showStatus('转义完成', 'success');
    }
    
    function unescapeJSON() {
      try {
        const text = input.value;
        const unescaped = JSON.parse(`"${text.replace(/"/g, '\\"')}"`);
        output.textContent = unescaped;
        showStatus('去转义完成', 'success');
      } catch (e) {
        showStatus('去转义失败', 'error');
      }
    }
    
    function toBase64() {
      try {
        const text = input.value.trim();
        const base64 = btoa(text);
        output.textContent = base64;
        showStatus('已转换为 Base64', 'success');
      } catch (e) {
        showStatus('转换失败: ' + e.message, 'error');
      }
    }
    
    function fromBase64() {
      try {
        const text = input.value.trim();
        const decoded = atob(text);
        input.value = decoded;
        formatJSON();
        showStatus('Base64 解码成功', 'success');
      } catch (e) {
        showStatus('解码失败', 'error');
      }
    }
    
    function clearAll() {
      if (confirm('确定要清空吗？')) {
        input.value = '';
        output.innerHTML = '';
        hideStatus();
        updateStats('');
      }
    }
    
    function copyOutput() {
      const text = output.textContent;
      navigator.clipboard.writeText(text);
      showStatus('已复制到剪贴板', 'success');
    }
    
    function loadFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        input.value = e.target.result;
        autoValidate();
        showStatus('文件已加载', 'success');
      };
      reader.readAsText(file);
    }
    
    function downloadJSON() {
      const text = output.textContent;
      if (!text) return;
      const blob = new Blob([text], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'data.json';
      a.click();
      URL.revokeObjectURL(url);
    }
    
    function autoValidate() {
      const text = input.value;
      updateStats(text);
      try {
        JSON.parse(text);
        showStatus('JSON 格式有效', 'success');
      } catch (e) {
        hideStatus();
      }
    }
    
    // Init
    const saved = localStorage.getItem('json_input');
    if (saved) {
      input.value = saved;
      autoValidate();
      formatJSON();
    } else {
      formatJSON();
    }
  </script>
</body>
</html>
