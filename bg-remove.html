<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>背景去除 - 小飞 AI 工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0abFA5;
      --color-on-primary: #ffffff;
      --color-primary-hover: #08d9a3;
      --color-primary-soft: rgba(10, 191, 165, 0.08);
      --color-error: #ef4444;
      --color-success: #10b981;
      --color-ink: #1a1a2e;
      --color-body: #5c5c72;
      --color-muted: #9494a8;
      --color-canvas: #ffffff;
      --color-canvas-soft: #f8f9fb;
      --color-border: rgba(0, 0, 0, 0.07);
      --radius-sm: 6px;
      --radius-md: 12px;
      --space-xs: 8px;
      --space-sm: 12px;
      --space-md: 16px;
      --space-lg: 24px;
      --font-sans: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--color-canvas-soft);
      color: var(--color-ink);
      min-height: 100vh;
    }
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-border);
      height: 56px; display: flex; align-items: center;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      width: 100%;
    }
    .nav-logo {
      font-size: 16px; font-weight: 600; color: var(--color-ink);
      text-decoration: none;
    }
    .nav-logo span { color: var(--color-primary); }
    .nav-back {
      font-size: 14px; color: var(--color-body); text-decoration: none;
      display: flex; align-items: center; gap: 6px;
    }
    .nav-back:hover { color: var(--color-primary); }
    .container {
      max-width: 1000px; margin: 0 auto; padding: 24px;
    }
    .header {
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 24px; font-weight: 600; letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 14px; color: var(--color-body);
    }
    .panel {
      background: var(--color-canvas); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); padding: 24px; margin-bottom: 20px;
    }
    .upload-area {
      border: 2px dashed var(--color-border);
      border-radius: var(--radius-md);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--color-canvas-soft);
    }
    .upload-area:hover {
      border-color: var(--color-primary);
      background: var(--color-primary-soft);
    }
    .upload-area.dragover {
      border-color: var(--color-primary);
      background: var(--color-primary-soft);
    }
    .upload-icon {
      font-size: 48px;
      margin-bottom: 12px;
      color: var(--color-primary);
    }
    .upload-text {
      font-size: 16px;
      color: var(--color-ink);
      margin-bottom: 6px;
    }
    .upload-hint {
      font-size: 13px;
      color: var(--color-muted);
    }
    #fileInput {
      display: none;
    }
    .preview-area {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 24px;
    }
    .preview-box {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .preview-header {
      padding: 12px 16px;
      background: var(--color-canvas-soft);
      font-size: 14px;
      font-weight: 500;
      border-bottom: 1px solid var(--color-border);
    }
    .preview-content {
      padding: 16px;
      background: repeating-conic-gradient(#f0f0f0 0% 25%, white 0% 50%) 50% / 20px 20px;
      min-height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-content img {
      max-width: 100%;
      max-height: 400px;
      object-fit: contain;
    }
    .preview-content.empty {
      color: var(--color-muted);
      font-size: 14px;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }
    .btn {
      flex: 1;
      padding: 12px 24px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--color-canvas);
      color: var(--color-ink);
    }
    .btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-primary {
      background: var(--color-primary);
      color: var(--color-on-primary);
      border-color: var(--color-primary);
    }
    .btn-primary:hover {
      background: var(--color-primary-hover);
      color: var(--color-on-primary);
    }
    .btn-primary:disabled {
      background: var(--color-muted);
      border-color: var(--color-muted);
    }
    .progress-bar {
      height: 4px;
      background: var(--color-border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 16px;
    }
    .progress-fill {
      height: 100%;
      background: var(--color-primary);
      transition: width 0.3s;
    }
    .status-text {
      text-align: center;
      font-size: 13px;
      color: var(--color-body);
      margin-top: 8px;
    }
    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid var(--color-on-primary);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .svg-icon {
      width: 16px;
      height: 16px;
    }
    .info-box {
      background: var(--color-primary-soft);
      border: 1px solid var(--color-primary);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin-top: 20px;
      font-size: 13px;
      color: var(--color-ink);
      line-height: 1.6;
    }
    @media (max-width: 768px) {
      .preview-area {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo"><span>小飞</span> AI 工具</a>
      <a href="index.html" class="nav-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        返回首页
      </a>
    </div>
  </nav>

  <div class="container">
    <div class="header">
      <h1>背景去除</h1>
      <p>AI 自动识别主体，一键去除图片背景，下载透明 PNG，纯本地处理</p>
    </div>

    <div class="panel">
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">✂️</div>
        <div class="upload-text">点击或拖拽上传图片</div>
        <div class="upload-hint">支持 JPG / PNG / WebP</div>
      </div>
      <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp" capture="environment" style="position:absolute;left:-9999px;opacity:0;pointer-events:none;width:1px;height:1px">
      <button id="fileSelectBtn" class="btn" style="width:100%;margin-top:16px">
        <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        选择图片文件
      </button>

      <div class="preview-area" id="previewArea" style="display: none;">
        <div class="preview-box">
          <div class="preview-header">原图</div>
          <div class="preview-content">
            <img id="originalImage" alt="原图">
          </div>
        </div>
        
        <div class="preview-box">
          <div class="preview-header">处理后</div>
          <div class="preview-content" id="resultContent">
            <span class="empty">处理结果将显示在此处</span>
          </div>
        </div>
      </div>

      <div class="progress-bar" id="progressBar" style="display: none;">
        <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
      </div>
      <div class="status-text" id="statusText"></div>

      <div class="btn-group" id="btnGroup" style="display: none;">
        <button class="btn" id="resetBtn">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
          </svg>
          重新选择
        </button>
        <button class="btn btn-primary" id="processBtn">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polygon points="10 8 16 12 10 16 10 8"/>
          </svg>
          开始处理
        </button>
        <button class="btn btn-primary" id="downloadBtn" style="display: none;">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          下载透明 PNG
        </button>
      </div>

      <div class="info-box">
        <strong>说明：</strong>本工具使用 <code>@imgly/background-removal</code> 库，首次使用需下载 AI 模型（约 10-20MB），之后会缓存在浏览器中。所有处理均在本地完成，照片不会上传服务器。
      </div>
    </div>
  </div>

  <script>
    // 文件选择逻辑（独立于模块加载，确保始终可用）
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const previewArea = document.getElementById('previewArea');
    const originalImage = document.getElementById('originalImage');
    const resultContent = document.getElementById('resultContent');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const btnGroup = document.getElementById('btnGroup');
    const resetBtn = document.getElementById('resetBtn');
    const processBtn = document.getElementById('processBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    let currentFile = null;
    let resultBlob = null;

    // 上传区域点击
    uploadArea.addEventListener('click', () => fileInput.click());

    // 文件选择按钮
    document.getElementById('fileSelectBtn').addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      fileInput.click();
    });

    // 文件选择
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleFile(file);
    });

    // 拖拽上传
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        handleFile(file);
      }
    });

    // 处理文件
    function handleFile(file) {
      currentFile = file;
      const reader = new FileReader();
      reader.onload = (e) => {
        originalImage.src = e.target.result;
        uploadArea.style.display = 'none';
        previewArea.style.display = 'grid';
        btnGroup.style.display = 'flex';
        processBtn.style.display = 'inline-flex';
        downloadBtn.style.display = 'none';
        resultContent.innerHTML = '<span class="empty">处理结果将显示在此处</span>';
        resultBlob = null;
      };
      reader.readAsDataURL(file);
    }

    // 重新选择
    resetBtn.addEventListener('click', () => {
      uploadArea.style.display = 'block';
      previewArea.style.display = 'none';
      btnGroup.style.display = 'none';
      fileInput.value = '';
      currentFile = null;
      resultBlob = null;
    });

    // 开始处理（加载模块后执行）
    processBtn.addEventListener('click', async () => {
      if (!currentFile) return;

      processBtn.disabled = true;
      progressBar.style.display = 'block';
      statusText.textContent = '正在加载 AI 模型，首次使用需要下载约 10-20MB...';

      try {
        const { removeBackground } = await import('https://esm.sh/@imgly/background-removal@1.4.5');

        const result = await removeBackground(currentFile, {
          progress: (key, current, total) => {
            if (key === 'compute:inference') {
              const percent = Math.round((current / total) * 100);
              progressFill.style.width = percent + '%';
              statusText.textContent = `正在处理... ${percent}%`;
            } else if (key.startsWith('fetch:')) {
              const percent = Math.round((current / total) * 100);
              progressFill.style.width = percent + '%';
              statusText.textContent = `下载模型中... ${percent}%`;
            }
          }
        });

        resultBlob = result;
        
        const url = URL.createObjectURL(result);
        resultContent.innerHTML = `<img src="${url}" alt="处理结果">`;
        
        statusText.textContent = '处理完成！';
        processBtn.style.display = 'none';
        downloadBtn.style.display = 'inline-flex';
      } catch (error) {
        console.error('Error:', error);
        statusText.textContent = '处理失败：' + error.message;
        processBtn.disabled = false;
      } finally {
        progressBar.style.display = 'none';
      }
    });

    // 下载
    downloadBtn.addEventListener('click', () => {
      if (!resultBlob) return;
      
      const url = URL.createObjectURL(resultBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'bg-removed.png';
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
</body>
</html>
