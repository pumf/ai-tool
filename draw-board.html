<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>画板 - 小飞 AI 工具</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0abFA5;
      --color-primary-light: rgba(10,191,165,0.1);
      --color-on-primary: #ffffff;
      --color-ink: #1a1a2e;
      --color-body: #5c5c72;
      --color-muted: #9494a8;
      --color-canvas: #ffffff;
      --color-canvas-soft: #f8f9fb;
      --color-border: rgba(0,0,0,0.08);
      --radius-sm: 8px;
      --radius-md: 12px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 20px rgba(0,0,0,0.1);
      --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background: var(--color-canvas-soft); height: 100vh; overflow: hidden; }
    .app { display: flex; height: 100vh; }
    
    .toolbar-left {
      width: 56px;
      background: var(--color-canvas);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 0;
      gap: 4px;
      z-index: 100;
    }
    .tool-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--color-border); width: 100%; align-items: center; }
    .tool-group:last-child { border-bottom: none; }
    .tool-btn {
      width: 40px;
      height: 40px;
      border: 1px solid transparent;
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-body);
      transition: all 0.2s;
      position: relative;
    }
    .tool-btn:hover { background: var(--color-canvas-soft); color: var(--color-ink); }
    .tool-btn.active { background: var(--color-primary-light); color: var(--color-primary); border-color: var(--color-primary); }
    .tool-btn svg { width: 20px; height: 20px; }
    .tool-btn .tooltip {
      position: absolute;
      left: 48px;
      background: var(--color-ink);
      color: white;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s;
      pointer-events: none;
      z-index: 1000;
    }
    .tool-btn:hover .tooltip { opacity: 1; visibility: visible; }
    
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    
    .top-bar {
      height: 56px;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    .logo { font-size: 16px; font-weight: 600; text-decoration: none; color: var(--color-ink); display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--color-primary); }
    .top-actions { display: flex; gap: 8px; align-items: center; }
    .btn {
      padding: 8px 16px;
      border: 1px solid var(--color-border);
      background: var(--color-canvas);
      border-radius: var(--radius-sm);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      color: var(--color-body);
    }
    .btn:hover { background: var(--color-canvas-soft); border-color: var(--color-primary); color: var(--color-primary); }
    .btn svg { width: 16px; height: 16px; }
    .btn-primary { background: var(--color-primary); color: white; border-color: var(--color-primary); }
    .btn-primary:hover { background: #09aa92; border-color: #09aa92; color: white; }
    
    .properties-bar {
      height: 48px;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 20px;
    }
    .prop-section { display: flex; align-items: center; gap: 10px; }
    .prop-label { font-size: 12px; color: var(--color-muted); }
    .color-palette { display: flex; gap: 6px; }
    .color-btn {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .color-btn:hover { transform: scale(1.1); }
    .color-btn.active { border-color: var(--color-ink); box-shadow: 0 0 0 2px white, 0 0 0 4px var(--color-primary); }
    .color-btn.custom { background: linear-gradient(135deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4, #ffeaa7); }
    input[type="color"] {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      padding: 0;
      background: none;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: 2px solid var(--color-border); border-radius: 6px; }
    input[type="range"] {
      width: 100px;
      height: 4px;
      border-radius: 2px;
      background: var(--color-border);
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--color-primary);
      cursor: pointer;
    }
    .size-value { font-size: 12px; color: var(--color-body); min-width: 24px; }
    
    .canvas-area {
      flex: 1;
      background: var(--color-canvas-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      position: relative;
    }
    .canvas-wrapper {
      position: relative;
      background: white;
      box-shadow: var(--shadow-lg);
      border-radius: var(--radius-sm);
      transition: transform 0.2s;
    }
    .canvas-container { position: relative; }
    canvas { display: block; border-radius: var(--radius-sm); }
    #drawingCanvas, #tempCanvas, #selectCanvas { position: absolute; top: 0; left: 0; }
    #bgCanvas { background: white; }
    #gridCanvas { position: absolute; top: 0; left: 0; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
    #gridCanvas.show { opacity: 1; }
    
    .selection-box {
      position: absolute;
      border: 2px dashed var(--color-primary);
      display: none;
      pointer-events: none;
    }
    .selection-box.show { display: block; }
    .selection-handle {
      position: absolute;
      width: 10px;
      height: 10px;
      background: var(--color-primary);
      border: 2px solid white;
      border-radius: 50%;
      box-shadow: var(--shadow-sm);
    }
    .handle-nw { top: -5px; left: -5px; cursor: nw-resize; }
    .handle-ne { top: -5px; right: -5px; cursor: ne-resize; }
    .handle-sw { bottom: -5px; left: -5px; cursor: sw-resize; }
    .handle-se { bottom: -5px; right: -5px; cursor: se-resize; }
    .handle-n { top: -5px; left: 50%; transform: translateX(-50%); cursor: n-resize; }
    .handle-s { bottom: -5px; left: 50%; transform: translateX(-50%); cursor: s-resize; }
    .handle-w { left: -5px; top: 50%; transform: translateY(-50%); cursor: w-resize; }
    .handle-e { right: -5px; top: 50%; transform: translateY(-50%); cursor: e-resize; }
    .handle-rotate {
      position: absolute;
      top: -25px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 12px;
      background: var(--color-primary);
      border: 2px solid white;
      border-radius: 50%;
      cursor: grab;
    }
    
    .bottom-bar {
      height: 36px;
      background: var(--color-canvas);
      border-top: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      font-size: 12px;
      color: var(--color-muted);
    }
    .status-left, .status-right { display: flex; gap: 16px; align-items: center; }
    .status-item { display: flex; align-items: center; gap: 4px; }
    
    .sidebar-right {
      width: 240px;
      background: var(--color-canvas);
      border-left: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
    }
    .panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--color-border);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-content { flex: 1; overflow-y: auto; padding: 12px; }
    .layer-item {
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      margin-bottom: 6px;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      transition: all 0.2s;
    }
    .layer-item:hover { background: var(--color-canvas-soft); }
    .layer-item.active { border-color: var(--color-primary); background: var(--color-primary-light); }
    .layer-item svg { width: 16px; height: 16px; color: var(--color-muted); }
    .layer-item.active svg { color: var(--color-primary); }
    .layer-thumb {
      width: 32px;
      height: 24px;
      background: white;
      border: 1px solid var(--color-border);
      border-radius: 4px;
      object-fit: cover;
    }
    .layer-info { flex: 1; }
    .layer-name { font-weight: 500; color: var(--color-ink); }
    .layer-meta { font-size: 11px; color: var(--color-muted); margin-top: 2px; }
    
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--color-canvas);
      border-radius: var(--radius-md);
      padding: 24px;
      max-width: 400px;
      width: 90%;
      box-shadow: var(--shadow-lg);
    }
    .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .modal-body { margin-bottom: 20px; }
    .modal-body input, .modal-body textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 12px;
    }
    .modal-body label { display: block; font-size: 12px; color: var(--color-muted); margin-bottom: 4px; }
    .modal-body .input-row { display: flex; gap: 12px; }
    .modal-body .input-row input { flex: 1; }
    .modal-body textarea { resize: vertical; min-height: 80px; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; }
    
    .toast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--color-ink);
      color: white;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 2000;
      box-shadow: var(--shadow-md);
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    
    .kbd { 
      background: var(--color-canvas-soft); 
      padding: 2px 6px; 
      border-radius: 4px; 
      font-size: 11px; 
      border: 1px solid var(--color-border);
      font-family: monospace;
    }
    
    .text-editor {
      position: absolute;
      background: white;
      border: 2px solid var(--color-primary);
      border-radius: var(--radius-sm);
      padding: 8px;
      min-width: 100px;
      min-height: 30px;
      display: none;
      z-index: 50;
      box-shadow: var(--shadow-md);
    }
    .text-editor.active { display: block; }
    .text-editor textarea {
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 16px;
      background: transparent;
      width: 100%;
      min-height: 20px;
    }
    
    #fileInput { display: none; }
    
    .transform-panel {
      position: absolute;
      background: white;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 12px;
      box-shadow: var(--shadow-md);
      display: none;
      z-index: 100;
      min-width: 180px;
    }
    .transform-panel.show { display: block; }
    .transform-panel-title { font-size: 12px; font-weight: 600; margin-bottom: 10px; color: var(--color-ink); }
    .transform-control { margin-bottom: 10px; }
    .transform-control label { display: block; font-size: 11px; color: var(--color-muted); margin-bottom: 4px; }
    .transform-control input[type="range"] { width: 100%; }
    .transform-control .value { font-size: 11px; color: var(--color-body); text-align: right; }
    .transform-colors { display: flex; gap: 6px; flex-wrap: wrap; }
    .transform-colors .color-btn { width: 20px; height: 20px; }
  </style>
</head>
<body>
  <div class="app">
    <!-- 左侧工具栏 -->
    <div class="toolbar-left">
      <div class="tool-group">
        <button class="tool-btn active" data-tool="select" title="选择 (V)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
          <span class="tooltip">选择 V</span>
        </button>
        <button class="tool-btn" data-tool="hand" title="抓手 (H)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.08-3.1a2 2 0 0 1 2.829-2.83l.79.8V8"/></svg>
          <span class="tooltip">抓手 H</span>
        </button>
      </div>
      
      <div class="tool-group">
        <button class="tool-btn" data-tool="pencil" title="铅笔 (P)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
          <span class="tooltip">铅笔 P</span>
        </button>
        <button class="tool-btn" data-tool="brush" title="画笔 (B)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 12.5V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2z"/><path d="M18 14v5a2 2 0 0 1-2 2H6"/><path d="M22 12h-2"/></svg>
          <span class="tooltip">画笔 B</span>
        </button>
        <button class="tool-btn" data-tool="marker" title="马克笔 (M)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 16v4h16v-4"/><path d="M12 2v14"/><path d="M8 6l4-4 4 4"/><path d="M16 22l-4-4-4 4"/></svg>
          <span class="tooltip">马克笔 M</span>
        </button>
        <button class="tool-btn" data-tool="spray" title="喷雾 (S)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><circle cx="6" cy="8" r="1.5"/><circle cx="18" cy="8" r="1.5"/><circle cx="6" cy="16" r="1.5"/><circle cx="18" cy="16" r="1.5"/><circle cx="20" cy="12" r="1"/><circle cx="4" cy="12" r="1"/></svg>
          <span class="tooltip">喷雾 S</span>
        </button>
        <button class="tool-btn" data-tool="eraser" title="橡皮擦 (E)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12l-7 7-7-7 7-7 7 7z"/><path d="M5 12h14"/></svg>
          <span class="tooltip">橡皮擦 E</span>
        </button>
      </div>
      
      <div class="tool-group">
        <button class="tool-btn" data-tool="line" title="直线 (L)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/></svg>
          <span class="tooltip">直线 L</span>
        </button>
        <button class="tool-btn" data-tool="arrow" title="箭头 (A)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="19 5 15 5 19 9"/></svg>
          <span class="tooltip">箭头 A</span>
        </button>
        <button class="tool-btn" data-tool="rect" title="矩形 (R)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
          <span class="tooltip">矩形 R</span>
        </button>
        <button class="tool-btn" data-tool="circle" title="圆形 (C)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
          <span class="tooltip">圆形 C</span>
        </button>
        <button class="tool-btn" data-tool="triangle" title="三角形 (T)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3L3 20h18L12 3z"/></svg>
          <span class="tooltip">三角形 T</span>
        </button>
        <button class="tool-btn" data-tool="star" title="星形 (*)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span class="tooltip">星形 *</span>
        </button>
      </div>
      
      <div class="tool-group">
        <button class="tool-btn" data-tool="text" title="文字 (F)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v2"/><path d="M12 20V4"/></svg>
          <span class="tooltip">文字 F</span>
        </button>
        <button class="tool-btn" data-tool="fill" title="填充 (G)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 11l-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2a2 2 0 0 0 2.8 0L19 11z"/><path d="M5 22h14"/></svg>
          <span class="tooltip">填充 G</span>
        </button>
        <button class="tool-btn" data-tool="picker" title="吸管 (I)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16.5 3.5l4 4L7 21l-4.5-4.5L16.5 3.5z"/><path d="M14 5l2 2"/><path d="M3 21l2.5-2.5"/></svg>
          <span class="tooltip">吸管 I</span>
        </button>
      </div>
    </div>

    <!-- 主区域 -->
    <div class="main">
      <!-- 顶部栏 -->
      <div class="top-bar">
        <a href="/" class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="currentColor" stroke-width="2" fill="none"/></svg>
          小飞<span>画板</span>
        </a>
        <div class="top-actions">
          <button class="btn" onclick="app.undo()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
            撤销
          </button>
          <button class="btn" onclick="app.redo()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/></svg>
            重做
          </button>
          <button class="btn" onclick="app.clearCanvas()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            清空
          </button>
          <button class="btn" onclick="document.getElementById('fileInput').click()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            导入
          </button>
          <button class="btn btn-primary" onclick="app.exportCanvas()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            导出
          </button>
          <button class="btn" onclick="app.showCanvasSizeDialog()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg>
            画布
          </button>
        </div>
      </div>

      <!-- 属性栏 -->
      <div class="properties-bar">
        <div class="prop-section">
          <span class="prop-label">颜色</span>
          <div class="color-palette">
            <div class="color-btn active" data-color="#1a1a2e" style="background:#1a1a2e"></div>
            <div class="color-btn" data-color="#ef4444" style="background:#ef4444"></div>
            <div class="color-btn" data-color="#f97316" style="background:#f97316"></div>
            <div class="color-btn" data-color="#facc15" style="background:#facc15"></div>
            <div class="color-btn" data-color="#22c55e" style="background:#22c55e"></div>
            <div class="color-btn" data-color="#0abFA5" style="background:#0abFA5"></div>

  <!-- Toast 提示 -->

  <!-- 隐藏的文件输入 -->

  <script>
    class DrawBoard {
      constructor() {
        this.canvasWidth = 800;
        this.canvasHeight = 600;
        this.zoom = 1;
        this.currentTool = 'select';
        this.currentColor = '#1a1a2e';
        this.currentSize = 3;
        this.currentOpacity = 1;
        this.fillShape = false;
        
        this.drawingCanvas = document.getElementById('drawingCanvas');
        this.tempCanvas = document.getElementById('tempCanvas');
        this.selectCanvas = document.getElementById('selectCanvas');
        this.gridCanvas = document.getElementById('gridCanvas');
        this.bgCanvas = document.getElementById('bgCanvas');
        
        this.ctx = this.drawingCanvas.getContext('2d');
        this.tempCtx = this.tempCanvas.getContext('2d');
        this.selectCtx = this.selectCanvas.getContext('2d');
        this.gridCtx = this.gridCanvas.getContext('2d');
        this.bgCtx = this.bgCanvas.getContext('2d');
        
        this.isDrawing = false;
        this.startX = 0;
        this.startY = 0;
        this.lastX = 0;
        this.lastY = 0;
        
        this.history = [];
        this.historyStep = -1;
        this.maxHistory = 50;
        
        this.layers = [{ id: 1, name: '图层 1', visible: true, opacity: 1 }];
        this.currentLayer = 0;
        this.layerCounter = 1;
        
        this.showGrid = false;
        this.gridSize = 20;
        
        // 选区和变换
        this.selection = null;
        this.isTransforming = false;
        this.textPosition = null;
        
        this.init();
      }
      
      init() {
        this.ctx.lineCap = 'round';
        this.ctx.lineJoin = 'round';
        this.tempCtx.lineCap = 'round';
        this.tempCtx.lineJoin = 'round';
        
        this.setupEventListeners();
        this.setupTools();
        this.setupColors();
        this.setupSliders();
        this.setupKeyboard();
        this.setupTransformControls();
        this.drawGrid();
        this.saveState();
        this.updateLayerList();
        this.showToast('画板已就绪');
      }
      
      setupEventListeners() {
        const container = document.getElementById('canvasContainer');
        
        container.addEventListener('mousedown', (e) => this.handleMouseDown(e));
        container.addEventListener('mousemove', (e) => this.handleMouseMove(e));
        container.addEventListener('mouseup', (e) => this.handleMouseUp(e));
        container.addEventListener('mouseleave', () => this.handleMouseUp());
        container.addEventListener('wheel', (e) => this.handleWheel(e));
        
        // 变换手柄事件
        document.querySelectorAll('.selection-handle').forEach(handle => {
          handle.addEventListener('mousedown', (e) => this.handleTransformStart(e));
        });
        
        // 触摸支持
        container.addEventListener('touchstart', (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          const mouseEvent = new MouseEvent('mousedown', {
            clientX: touch.clientX,
            clientY: touch.clientY
          });
          container.dispatchEvent(mouseEvent);
        }, { passive: false });
        
        container.addEventListener('touchmove', (e) => {
          e.preventDefault();
          const touch = e.touches[0];
          const mouseEvent = new MouseEvent('mousemove', {
            clientX: touch.clientX,
            clientY: touch.clientY
          });
          container.dispatchEvent(mouseEvent);
        }, { passive: false });
        
        container.addEventListener('touchend', () => {
          const mouseEvent = new MouseEvent('mouseup', {});
          container.dispatchEvent(mouseEvent);
        });
      }
      
      getMousePos(e) {
        const rect = this.drawingCanvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) / this.zoom,
          y: (e.clientY - rect.top) / this.zoom
        };
      }
      
      handleMouseDown(e) {
        if (e.target.classList.contains('selection-handle')) return;
        
        const pos = this.getMousePos(e);
        this.isDrawing = true;
        this.startX = pos.x;
        this.startY = pos.y;
        this.lastX = pos.x;
        this.lastY = pos.y;
        
        this.tempCtx.clearRect(0, 0, this.canvasWidth, this.canvasHeight);
        this.tempCtx.strokeStyle = this.currentColor;
        this.tempCtx.fillStyle = this.currentColor;
        this.tempCtx.lineWidth = this.currentSize;
        this.tempCtx.globalAlpha = this.currentOpacity;
        
        this.ctx.globalAlpha = this.currentOpacity;
        
        switch(this.currentTool) {
          case 'pencil':
          case 'brush':
          case 'marker':
            this.ctx.beginPath();
            this.ctx.moveTo(pos.x, pos.y);
            break;
          case 'spray':
            this.spray(pos.x, pos.y);
            break;
          case 'eraser':
            this.ctx.globalCompositeOperation = 'destination-out';
            this.ctx.beginPath();
            this.ctx.moveTo(pos.x, pos.y);
            break;
          case 'picker':
            this.pickColor(pos.x, pos.y);
            this.isDrawing = false;
            break;
          case 'fill':
            this.floodFill(Math.floor(pos.x), Math.floor(pos.y));
            this.isDrawing = false;
            break;
          case 'text':
            this.textPosition = { x: pos.x, y: pos.y };
            this.showTextModal();
            this.isDrawing = false;
            break;
          case 'select':
            this.startSelection(pos.x, pos.y);
            break;
        }
      }
      
      handleMouseMove(e) {
        const pos = this.getMousePos(e);
        document.getElementById('position').textContent = `${Math.round(pos.x)}, ${Math.round(pos.y)}`;
        
        if (!this.isDrawing) return;
        
        switch(this.currentTool) {
          case 'pencil':
            this.ctx.strokeStyle = this.currentColor;
            this.ctx.lineWidth = this.currentSize;
            this.ctx.lineTo(pos.x, pos.y);
            this.ctx.stroke();
            break;
          case 'brush':
            this.ctx.strokeStyle = this.currentColor;
            this.ctx.lineWidth = this.currentSize * 2;
            this.ctx.shadowBlur = this.currentSize;
            this.ctx.shadowColor = this.currentColor;
            this.ctx.lineTo(pos.x, pos.y);
            this.ctx.stroke();
            this.ctx.shadowBlur = 0;
            break;
          case 'marker':
            this.ctx.strokeStyle = this.currentColor;
            this.ctx.lineWidth = this.currentSize * 3;
            this.ctx.globalAlpha = this.currentOpacity * 0.5;
            this.ctx.lineTo(pos.x, pos.y);
            this.ctx.stroke();
            this.ctx.globalAlpha = this.currentOpacity;
            break;
          case 'spray':
            this.spray(pos.x, pos.y);
            break;
          case 'eraser':
            this.ctx.lineTo(pos.x, pos.y);
            this.ctx.stroke();
            break;
          case 'line':
            this.drawShapePreview('line', pos);
            break;
          case 'arrow':
            this.drawShapePreview('arrow', pos);
            break;
          case 'rect':
            this.drawShapePreview('rect', pos);
            break;
          case 'circle':
            this.drawShapePreview('circle', pos);
            break;
          case 'triangle':
            this.drawShapePreview('triangle', pos);
            break;
          case 'star':
            this.drawShapePreview('star', pos);
            break;
          case 'select':
            this.updateSelection(pos.x, pos.y);
            break;
        }
        
        this.lastX = pos.x;
        this.lastY = pos.y;
      }
      
      handleMouseUp(e) {
        if (!this.isDrawing) return;
        this.isDrawing = false;
        
        if (this.currentTool === 'eraser') {
          this.ctx.globalCompositeOperation = 'source-over';
        }
        
        if (['line', 'arrow', 'rect', 'circle', 'triangle', 'star'].includes(this.currentTool)) {
          this.commitShape();
        }
        
        if (this.currentTool === 'select') {
          this.finishSelection();
        }
        
        this.saveState();
      }
      
      handleWheel(e) {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          const delta = e.deltaY > 0 ? 0.9 : 1.1;
          this.zoom = Math.max(0.1, Math.min(5, this.zoom * delta));
          this.updateZoom();
        }
      }
      
      spray(x, y) {
        const density = this.currentSize * 2;
        const radius = this.currentSize * 5;
        
        for (let i = 0; i < density; i++) {
          const angle = Math.random() * Math.PI * 2;
          const r = Math.random() * radius;
          const px = x + Math.cos(angle) * r;
          const py = y + Math.sin(angle) * r;
          
          this.ctx.fillStyle = this.currentColor;
          this.ctx.globalAlpha = this.currentOpacity * Math.random();
          this.ctx.fillRect(px, py, 1, 1);
        }
        this.ctx.globalAlpha = this.currentOpacity;
      }
      
      drawShapePreview(shape, pos) {
        this.tempCtx.clearRect(0, 0, this.canvasWidth, this.canvasHeight);
        this.tempCtx.strokeStyle = this.currentColor;
        this.tempCtx.fillStyle = this.currentColor;
        this.tempCtx.lineWidth = this.currentSize;
        this.tempCtx.globalAlpha = this.currentOpacity;
        
        const x = Math.min(this.startX, pos.x);
        const y = Math.min(this.startY, pos.y);
        const w = Math.abs(pos.x - this.startX);
        const h = Math.abs(pos.y - this.startY);
        
        switch(shape) {
          case 'line':
            this.tempCtx.beginPath();
            this.tempCtx.moveTo(this.startX, this.startY);
            this.tempCtx.lineTo(pos.x, pos.y);
            this.tempCtx.stroke();
            break;
          case 'arrow':
            this.drawArrow(this.tempCtx, this.startX, this.startY, pos.x, pos.y);
            break;
          case 'rect':
            if (this.fillShape) {
              this.tempCtx.fillRect(x, y, w, h);
            } else {
              this.tempCtx.strokeRect(x, y, w, h);
            }
            break;
          case 'circle':
            this.tempCtx.beginPath();
            const radius = Math.sqrt(w * w + h * h) / 2;
            const centerX = (this.startX + pos.x) / 2;
            const centerY = (this.startY + pos.y) / 2;
            this.tempCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            this.fillShape ? this.tempCtx.fill() : this.tempCtx.stroke();
            break;
          case 'triangle':
            this.tempCtx.beginPath();
            this.tempCtx.moveTo((this.startX + pos.x) / 2, this.startY);
            this.tempCtx.lineTo(pos.x, pos.y);
            this.tempCtx.lineTo(this.startX, pos.y);
            this.tempCtx.closePath();
            this.fillShape ? this.tempCtx.fill() : this.tempCtx.stroke();
            break;
          case 'star':
            this.drawStar(this.tempCtx, (this.startX + pos.x) / 2, (this.startY + pos.y) / 2, 5, w / 2, h / 4);
            break;
        }
      }
      
      drawArrow(ctx, fromX, fromY, toX, toY) {
        const headLen = this.currentSize * 3;
        const angle = Math.atan2(toY - fromY, toX - fromX);
        
        ctx.beginPath();
        ctx.moveTo(fromX, fromY);
        ctx.lineTo(toX, toY);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(toX, toY);
        ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI / 6), toY - headLen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI / 6), toY - headLen * Math.sin(angle + Math.PI / 6));
        ctx.closePath();
        ctx.fill();
      }
      
      drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius) {
        let rot = Math.PI / 2 * 3;
        let x = cx;
        let y = cy;
        let step = Math.PI / spikes;
        
        ctx.beginPath();
        ctx.moveTo(cx, cy - outerRadius);
        for (let i = 0; i < spikes; i++) {
          x = cx + Math.cos(rot) * outerRadius;
          y = cy + Math.sin(rot) * outerRadius;
          ctx.lineTo(x, y);
          rot += step;
          
          x = cx + Math.cos(rot) * innerRadius;
          y = cy + Math.sin(rot) * innerRadius;
          ctx.lineTo(x, y);
          rot += step;
        }
        ctx.lineTo(cx, cy - outerRadius);
        ctx.closePath();
        this.fillShape ? ctx.fill() : ctx.stroke();
      }
      
      commitShape() {
        this.ctx.drawImage(this.tempCanvas, 0, 0);
        this.tempCtx.clearRect(0, 0, this.canvasWidth, this.canvasHeight);
      }
      
      pickColor(x, y) {
        const pixel = this.ctx.getImageData(x, y, 1, 1).data;
        const hex = '#' + [pixel[0], pixel[1], pixel[2]].map(v => v.toString(16).padStart(2, '0')).join('');
        this.setColor(hex);
        this.showToast(`已选取颜色: ${hex}`);
      }
      
      // 完整的 Flood Fill 填充算法
      floodFill(startX, startY) {
        if (startX < 0 || startX >= this.canvasWidth || startY < 0 || startY >= this.canvasHeight) return;
        
        const imageData = this.ctx.getImageData(0, 0, this.canvasWidth, this.canvasHeight);
        const data = imageData.data;
        const width = this.canvasWidth;
        const height = this.canvasHeight;
        
        // 获取目标颜色
        const targetIdx = (startY * width + startX) * 4;
        const targetR = data[targetIdx];
        const targetG = data[targetIdx + 1];
        const targetB = data[targetIdx + 2];
        const targetA = data[targetIdx + 3];
        
        // 获取填充颜色
        const fillColor = this.hexToRgb(this.currentColor);
        if (!fillColor) return;
        
        // 如果颜色相同则不填充
        if (targetR === fillColor.r && targetG === fillColor.g && targetB === fillColor.b) return;
        
        const stack = [[startX, startY]];
        const visited = new Set();
        const tolerance = 32; // 颜色容差
        
        const colorMatch = (idx) => {
          return Math.abs(data[idx] - targetR) <= tolerance &&
                 Math.abs(data[idx + 1] - targetG) <= tolerance &&
                 Math.abs(data[idx + 2] - targetB) <= tolerance &&
                 Math.abs(data[idx + 3] - targetA) <= tolerance;
        };
        
        while (stack.length > 0) {
          const [x, y] = stack.pop();
          const key = `${x},${y}`;
          
          if (visited.has(key)) continue;
          visited.add(key);
          
          if (x < 0 || x >= width || y < 0 || y >= height) continue;
          
          const idx = (y * width + x) * 4;
          if (!colorMatch(idx)) continue;
          
          data[idx] = fillColor.r;
          data[idx + 1] = fillColor.g;
          data[idx + 2] = fillColor.b;
          data[idx + 3] = 255;
          
          stack.push([x + 1, y]);
          stack.push([x - 1, y]);
          stack.push([x, y + 1]);
          stack.push([x, y - 1]);
        }
        
        this.ctx.putImageData(imageData, 0, 0);
        this.saveState();
        this.showToast('已填充');
      }
      
      hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
          r: parseInt(result[1], 16),
          g: parseInt(result[2], 16),
          b: parseInt(result[3], 16)
        } : null;
      }
      
      // 文字功能
      showTextModal() {
        document.getElementById('textModal').classList.add('show');
        document.getElementById('textModalInput').focus();
        document.getElementById('textColorInput').value = this.currentColor;
      }
      
      commitTextModal() {
        const text = document.getElementById('textModalInput').value;
        const size = parseInt(document.getElementById('textSizeInput').value) || 24;
        const color = document.getElementById('textColorInput').value;
        
        if (text.trim() && this.textPosition) {
          this.ctx.fillStyle = color;
          this.ctx.font = `${size}px 'Noto Sans SC', sans-serif`;
          this.ctx.textBaseline = 'top';
          
          const lines = text.split('\n');
          lines.forEach((line, i) => {
            this.ctx.fillText(line, this.textPosition.x, this.textPosition.y + (i * size * 1.2));
          });
          
          this.saveState();
          this.showToast('已添加文字');
        }
        
        document.getElementById('textModal').classList.remove('show');
        document.getElementById('textModalInput').value = '';
      }
      
      // 选区和变换功能
      startSelection(x, y) {
        this.selectCtx.clearRect(0, 0, this.canvasWidth, this.canvasHeight);
        this.selection = { x, y, w: 0, h: 0 };
        this.hideTransformPanel();
      }
      
      updateSelection(x, y) {
        if (!this.selection) return;
        this.selection.w = x - this.startX;
        this.selection.h = y - this.startY;
        
        this.selectCtx.clearRect(0, 0, this.canvasWidth, this.canvasHeight);
        this.selectCtx.strokeStyle = '#0abFA5';
        this.selectCtx.setLineDash([5, 5]);
        this.selectCtx.strokeRect(this.selection.x, this.selection.y, this.selection.w, this.selection.h);
        this.selectCtx.setLineDash([]);
      }
      
      finishSelection() {
        if (!this.selection || Math.abs(this.selection.w) < 10 || Math.abs(this.selection.h) < 10) {
          this.selectCtx.clearRect(0, 0, this.canvasWidth, this.canvasHeight);
          this.selection = null;
          return;
        }
        
        // 标准化选区
        if (this.selection.w < 0) {
          this.selection.x += this.selection.w;
          this.selection.w = Math.abs(this.selection.w);
        }
        if (this.selection.h < 0) {
          this.selection.y += this.selection.h;
          this.selection.h = Math.abs(this.selection.h);
        }
        
        // 显示选区框和变换面板
        this.showSelectionBox();
        this.showTransformPanel();
        
        // 捕获选区内容
        this.selection.imageData = this.ctx.getImageData(this.selection.x, this.selection.y, this.selection.w, this.selection.h);
        
        // 清空原位置
        this.ctx.clearRect(this.selection.x, this.selection.y, this.selection.w, this.selection.h);
        this.saveState();
      }
      
      showSelectionBox() {
        const box = document.getElementById('selectionBox');
        box.style.left = (this.selection.x * this.zoom) + 'px';
        box.style.top = (this.selection.y * this.zoom) + 'px';
        box.style.width = (this.selection.w * this.zoom) + 'px';
        box.style.height = (this.selection.h * this.zoom) + 'px';
        box.classList.add('show');
      }
      
      hideSelectionBox() {
        document.getElementById('selectionBox').classList.remove('show');
      }
      
      showTransformPanel() {
        const panel = document.getElementById('transformPanel');
        const box = document.getElementById('selectionBox');
        const rect = box.getBoundingClientRect();
        panel.style.left = (rect.right + 10) + 'px';
        panel.style.top = rect.top + 'px';
        panel.classList.add('show');
      }
      
      hideTransformPanel() {
        document.getElementById('transformPanel').classList.remove('show');
      }
      
      setupTransformControls() {
        // 缩放
        document.getElementById('transformScale').addEventListener('input', (e) => {
          document.getElementById('transformScaleVal').textContent = e.target.value + '%';
          this.previewTransform();
        });
        
        // 旋转
        document.getElementById('transformRotate').addEventListener('input', (e) => {
          document.getElementById('transformRotateVal').textContent = e.target.value + '°';
          this.previewTransform();
        });
        
        // 变换颜色
        document.querySelectorAll('.transform-color').forEach(btn => {
          btn.addEventListener('click', () => {
            if (this.selection) {
              this.currentColor = btn.dataset.color;
              this.previewTransform();
            }
          });
        });
      }
      
      previewTransform() {
        if (!this.selection || !this.selection.imageData) return;
        
        const scale = parseInt(document.getElementById('transformScale').value) / 100;
        const rotation = parseInt(document.getElementById('transformRotate').value) * Math.PI / 180;
        
        this.selectCtx.clearRect(0, 0, this.canvasWidth, this.canvasHeight);
        this.selectCtx.save();
        this.selectCtx.translate(this.selection.x + this.selection.w/2, this.selection.y + this.selection.h/2);
        this.selectCtx.rotate(rotation);
        this.selectCtx.scale(scale, scale);
        this.selectCtx.putImageData(this.selection.imageData, -this.selection.w/2, -this.selection.h/2);
        this.selectCtx.restore();
      }
      
      applyTransform() {
        if (!this.selection || !this.selection.imageData) return;
        
        const scale = parseInt(document.getElementById('transformScale').value) / 100;
        const rotation = parseInt(document.getElementById('transformRotate').value) * Math.PI / 180;
        
        // 创建临时canvas进行变换
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = this.selection.w;
        tempCanvas.height = this.selection.h;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.putImageData(this.selection.imageData, 0, 0);
        
        // 应用变换
        this.ctx.save();
        this.ctx.translate(this.selection.x + this.selection.w/2, this.selection.y + this.selection.h/2);
        this.ctx.rotate(rotation);
        this.ctx.scale(scale, scale);
        this.ctx.drawImage(tempCanvas, -this.selection.w/2, -this.selection.h/2);
        this.ctx.restore();
        
        // 清除选区
        this.selectCtx.clearRect(0, 0, this.canvasWidth, this.canvasHeight);
        this.hideSelectionBox();
        this.hideTransformPanel();
        this.selection = null;
        
        this.saveState();
        this.showToast('变换已应用');
      }
      
      handleTransformStart(e) {
        e.stopPropagation();
        this.isTransforming = true;
        // 这里可以实现拖拽变换手柄的功能
      }
      
      // 画布尺寸设置
      showCanvasSizeDialog() {
        document.getElementById('canvasWidthInput').value = this.canvasWidth;
        document.getElementById('canvasHeightInput').value = this.canvasHeight;
        document.getElementById('canvasSizeModal').classList.add('show');
      }
      
      setCanvasSize() {
        const w = parseInt(document.getElementById('canvasWidthInput').value) || 800;
        const h = parseInt(document.getElementById('canvasHeightInput').value) || 600;
        
        // 保存当前内容
        const currentData = this.ctx.getImageData(0, 0, this.canvasWidth, this.canvasHeight);
        
        // 更新画布尺寸
        this.canvasWidth = Math.min(Math.max(w, 100), 3000);
        this.canvasHeight = Math.min(Math.max(h, 100), 3000);
        
        // 更新所有canvas
        ['drawingCanvas', 'tempCanvas', 'selectCanvas', 'gridCanvas', 'bgCanvas'].forEach(id => {
          const canvas = document.getElementById(id);
          canvas.width = this.canvasWidth;
          canvas.height = this.canvasHeight;
        });
        
        // 恢复内容
        this.ctx.putImageData(currentData, 0, 0);
        
        // 更新显示
        document.getElementById('canvasSize').textContent = `${this.canvasWidth} × ${this.canvasHeight}`;
        this.drawGrid();
        this.saveState();
        
        document.getElementById('canvasSizeModal').classList.remove('show');
        this.showToast(`画布尺寸已设为 ${this.canvasWidth} × ${this.canvasHeight}`);
      }
      
      setupTools() {
        document.querySelectorAll('[data-tool]').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.currentTool = btn.dataset.tool;
            this.updateToolStatus();
            this.hideSelectionBox();
            this.hideTransformPanel();
          });
        });
        
        document.getElementById('fillCheckbox').addEventListener('change', (e) => {
          this.fillShape = e.target.checked;
        });
      }
      
      setupColors() {
        document.querySelectorAll('.color-btn[data-color]').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.color-btn[data-color]').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.setColor(btn.dataset.color);
          });
        });
        
        document.getElementById('colorPicker').addEventListener('change', (e) => {
          this.setColor(e.target.value);
        });
      }
      
      setupSliders() {
        const sizeSlider = document.getElementById('sizeSlider');
        const sizeValue = document.getElementById('sizeValue');
        sizeSlider.addEventListener('input', (e) => {
          this.currentSize = parseInt(e.target.value);
          sizeValue.textContent = this.currentSize + 'px';
        });
        
        const opacitySlider = document.getElementById('opacitySlider');
        const opacityValue = document.getElementById('opacityValue');
        opacitySlider.addEventListener('input', (e) => {
          this.currentOpacity = parseInt(e.target.value) / 100;
          opacityValue.textContent = e.target.value + '%';
        });
      }
      
      setupKeyboard() {
        document.addEventListener('keydown', (e) => {
          if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
          
          const keyMap = {
            'v': 'select', 'h': 'hand', 'p': 'pencil', 'b': 'brush', 'm': 'marker',
            's': 'spray', 'e': 'eraser', 'l': 'line', 'a': 'arrow', 'r': 'rect',
            'c': 'circle', 't': 'triangle', '*': 'star', 'f': 'text', 'g': 'fill', 'i': 'picker'
          };
          
          if (keyMap[e.key.toLowerCase()]) {
            this.setTool(keyMap[e.key.toLowerCase()]);
          }
          
          if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
            e.preventDefault();
            if (e.shiftKey) {
              this.redo();
            } else {
              this.undo();
            }
          }
          
          if ((e.ctrlKey || e.metaKey) && e.key === 'y') {
            e.preventDefault();
            this.redo();
          }
          
          if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            this.exportCanvas();
          }
        });
      }
      
      setColor(color) {
        this.currentColor = color;
        document.getElementById('colorPicker').value = color;
      }
      
      setTool(tool) {
        this.currentTool = tool;
        document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
        const btn = document.querySelector(`[data-tool="${tool}"]`);
        if (btn) btn.classList.add('active');
        this.updateToolStatus();
        this.hideSelectionBox();
        this.hideTransformPanel();
      }
      
      updateToolStatus() {
        const toolNames = {
          select: '选择工具', hand: '抓手工具', pencil: '铅笔', brush: '画笔', marker: '马克笔',
          spray: '喷雾', eraser: '橡皮擦', line: '直线', arrow: '箭头', rect: '矩形',
          circle: '圆形', triangle: '三角形', star: '星形', text: '文字', fill: '填充', picker: '吸管'
        };
        document.getElementById('toolStatus').textContent = toolNames[this.currentTool] || this.currentTool;
      }
      
      drawGrid() {
        this.gridCtx.clearRect(0, 0, this.canvasWidth, this.canvasHeight);
        this.gridCtx.strokeStyle = 'rgba(0,0,0,0.05)';
        this.gridCtx.lineWidth = 1;
        
        for (let x = 0; x <= this.canvasWidth; x += this.gridSize) {
          this.gridCtx.beginPath();
          this.gridCtx.moveTo(x, 0);
          this.gridCtx.lineTo(x, this.canvasHeight);
          this.gridCtx.stroke();
        }
        
        for (let y = 0; y <= this.canvasHeight; y += this.gridSize) {
          this.gridCtx.beginPath();
          this.gridCtx.moveTo(0, y);
          this.gridCtx.lineTo(this.canvasWidth, y);
          this.gridCtx.stroke();
        }
      }
      
      updateZoom() {
        const wrapper = document.getElementById('canvasWrapper');
        wrapper.style.transform = `scale(${this.zoom})`;
        document.getElementById('zoomLevel').textContent = Math.round(this.zoom * 100) + '%';
      }
      
      saveState() {
        if (this.historyStep < this.maxHistory - 1) {
          this.historyStep++;
          this.history = this.history.slice(0, this.historyStep);
        } else {
          this.history.shift();
        }
        this.history.push(this.ctx.getImageData(0, 0, this.canvasWidth, this.canvasHeight));
      }
      
      undo() {
        if (this.historyStep > 0) {
          this.historyStep--;
          this.ctx.putImageData(this.history[this.historyStep], 0, 0);
          this.showToast('已撤销');
        }
      }
      
      redo() {
        if (this.historyStep < this.history.length - 1) {
          this.historyStep++;
          this.ctx.putImageData(this.history[this.historyStep], 0, 0);
          this.showToast('已重做');
        }
      }
      
      clearCanvas() {
        if (confirm('确定要清空画布吗？')) {
          this.ctx.clearRect(0, 0, this.canvasWidth, this.canvasHeight);
          this.saveState();
          this.showToast('画布已清空');
        }
      }
      
      exportCanvas() {
        const link = document.createElement('a');
        link.download = `draw-board-${Date.now()}.png`;
        
        // 合并所有图层
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = this.canvasWidth;
        exportCanvas.height = this.canvasHeight;
        const exportCtx = exportCanvas.getContext('2d');
        exportCtx.fillStyle = 'white';
        exportCtx.fillRect(0, 0, this.canvasWidth, this.canvasHeight);
        exportCtx.drawImage(this.drawingCanvas, 0, 0);
        
        link.href = exportCanvas.toDataURL('image/png');
        link.click();
        this.showToast('已导出图片');
      }
      
      handleFileSelect(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const aspectRatio = img.width / img.height;
            let drawWidth = Math.min(img.width, this.canvasWidth * 0.8);
            let drawHeight = drawWidth / aspectRatio;
            
            if (drawHeight > this.canvasHeight * 0.8) {
              drawHeight = this.canvasHeight * 0.8;
              drawWidth = drawHeight * aspectRatio;
            }
            
            const x = (this.canvasWidth - drawWidth) / 2;
            const y = (this.canvasHeight - drawHeight) / 2;
            
            this.ctx.drawImage(img, x, y, drawWidth, drawHeight);
            this.saveState();
            this.showToast('图片已导入');
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      }
      
      addLayer() {
        this.layerCounter++;
        this.layers.unshift({ 
          id: this.layerCounter, 
          name: `图层 ${this.layerCounter}`, 
          visible: true, 
          opacity: 1 
        });
        this.updateLayerList();
        this.showToast(`已添加图层 ${this.layerCounter}`);
      }
      
      updateLayerList() {
        const list = document.getElementById('layerList');
        list.innerHTML = this.layers.map((layer, index) => `
          <div class="layer-item ${index === this.currentLayer ? 'active' : ''}" onclick="app.selectLayer(${index})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
            </svg>
            <div class="layer-info">
              <div class="layer-name">${layer.name}</div>
              <div class="layer-meta">${layer.visible ? '可见' : '隐藏'}</div>
            </div>
          </div>
        `).join('');
      }
      
      selectLayer(index) {
        this.currentLayer = index;
        this.updateLayerList();
      }
      
      showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }
    }
    
    const app = new DrawBoard();
  </script>
</body>
</html>
