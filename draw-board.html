<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>画板 - 小飞 AI 工具</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0abFA5;
      --color-on-primary: #ffffff;
      --color-ink: #1a1a2e;
      --color-body: #5c5c72;
      --color-muted: #9494a8;
      --color-canvas: #ffffff;
      --color-canvas-soft: #f8f9fb;
      --color-border: rgba(0,0,0,0.07);
      --radius-sm: 6px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { font-family: 'Inter', 'Noto Sans SC', sans-serif; background: var(--color-canvas-soft); height: 100vh; overflow: hidden; }
    .app { display: flex; height: 100vh; }
    .sidebar { width: 240px; background: var(--color-canvas); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid var(--color-border); display: flex; justify-content: space-between; align-items: center; }
    .btn-small { padding: 6px 12px; border: 1px solid var(--color-border); background: var(--color-canvas); border-radius: var(--radius-sm); font-size: 12px; cursor: pointer; }
    .btn-small.primary { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); }
    .canvas-list { flex: 1; overflow-y: auto; padding: 8px; }
    .canvas-item { padding: 10px; border-radius: var(--radius-sm); cursor: pointer; margin-bottom: 6px; border: 2px solid transparent; }
    .canvas-item:hover { background: var(--color-canvas-soft); }
    .canvas-item.active { border-color: var(--color-primary); }
    .canvas-thumb { width: 100%; height: 100px; background: #fff; border-radius: 4px; margin-bottom: 6px; object-fit: cover; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .top-bar { height: 56px; background: var(--color-canvas); border-bottom: 1px solid var(--color-border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .logo { font-size: 16px; font-weight: 600; text-decoration: none; color: var(--color-ink); }
    .logo span { color: var(--color-primary); }
    .toolbar { background: var(--color-canvas); border-bottom: 1px solid var(--color-border); padding: 8px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .tool-section { display: flex; align-items: center; gap: 4px; padding-right: 12px; border-right: 1px solid var(--color-border); }
    .tool-btn { width: 36px; height: 36px; border: 1px solid transparent; background: transparent; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--color-body); }
    .tool-btn:hover { background: var(--color-canvas-soft); }
    .tool-btn.active { background: rgba(10,191,165,0.08); color: var(--color-primary); border-color: var(--color-primary); }
    .color-btn { width: 20px; height: 20px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; }
    .color-btn.active { border-color: var(--color-ink); }
    .size-slider { width: 100px; }
    .canvas-area { flex: 1; background: var(--color-canvas-soft); display: flex; align-items: center; justify-content: center; overflow: auto; padding: 40px; }
    .canvas-wrapper { position: relative; background: white; box-shadow: 0 8px 40px rgba(0,0,0,0.08); border-radius: var(--radius-sm); }
    #mainCanvas, #tempCanvas { display: block; }
    #tempCanvas { position: absolute; top: 0; left: 0; pointer-events: none; }
    .transform-box { position: absolute; border: 2px dashed var(--color-primary); display: none; }
    .transform-box.show { display: block; }
    .transform-handle { position: absolute; width: 10px; height: 10px; background: var(--color-primary); border: 2px solid white; border-radius: 50%; cursor: pointer; }
    .bottom-bar { height: 36px; background: var(--color-canvas); border-top: 1px solid var(--color-border); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 12px; color: var(--color-muted); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--color-canvas); border-radius: var(--radius-sm); padding: 20px; max-width: 360px; width: 90%; }
    .toast { position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--color-ink); color: white; padding: 10px 20px; border-radius: var(--radius-sm); font-size: 13px; opacity: 0; transition: all 0.3s; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    #fileInput { display: none; }
  </style>
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <div class="sidebar-header">
        <span>画板列表</span>
        <button class="btn-small primary" onclick="app.newCanvas()">+ 新建</button>
      </div>
      <div class="canvas-list" id="canvasList"></div>
    </div>
    <div class="main">
      <div class="top-bar">
        <a href="/" class="logo">小飞<span> AI 工具</span></a>
        <div>
          <button class="btn-small" onclick="app.undo()">撤销</button>
          <button class="btn-small" onclick="app.exportCanvas()">导出</button>
        </div>
      </div>
      <div class="toolbar">
        <div class="tool-section">
          <button class="tool-btn" onclick="app.setTool('pen')">✏️</button>
          <button class="tool-btn" onclick="app.setTool('marker')">🖍️</button>
          <button class="tool-btn" onclick="app.setTool('eraser')">🧹</button>
          <button class="tool-btn" onclick="app.setTool('line')">📏</button>
          <button class="tool-btn" onclick="app.setTool('rect')">⬜</button>
          <button class="tool-btn" onclick="app.setTool('circle')">⭕</button>
          <button class="tool-btn" onclick="app.setTool('text')">📝</button>
        </div>
        <div class="tool-section">
          <div class="color-btn active" style="background:#1a1a2e" onclick="app.setColor('#1a1a2e')"></div>
          <div class="color-btn" style="background:#ef4444" onclick="app.setColor('#ef4444')"></div>
          <div class="color-btn" style="background:#0abFA5" onclick="app.setColor('#0abFA5')"></div>
          <input type="color" id="colorPicker" value="#1a1a2e" onchange="app.setColor(this.value)">
          <input type="range" class="size-slider" min="1" max="50" value="3" onchange="app.setSize(this.value)">
        </div>
      </div>
      <div class="canvas-area">
        <div class="canvas-wrapper">
          <canvas id="mainCanvas" width="800" height="600"></canvas>
          <canvas id="tempCanvas" width="800" height="600"></canvas>
          <div class="transform-box" id="transformBox"></div>
        </div>
      </div>
      <div class="bottom-bar">
        <span id="elementInfo">0 个元素</span>
        <span>画板已就绪</span>
      </div>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/*" onchange="app.handleImageFile(event)">
  <div class="modal-overlay" id="textModal">
    <div class="modal">
      <div>添加文字</div>
      <textarea id="textInput" placeholder="输入文字..."></textarea>
      <button onclick="app.confirmText()">确定</button>
      <button onclick="app.closeTextModal()">取消</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
  class DrawBoardApp {
    constructor() {
      this.mainCanvas = document.getElementById('mainCanvas');
      this.mainCtx = this.mainCanvas.getContext('2d');
      this.tempCanvas = document.getElementById('tempCanvas');
      this.tempCtx = this.tempCanvas.getContext('2d');
      this.currentTool = 'pen';
      this.currentColor = '#1a1a2e';
      this.currentSize = 3;
      this.isDrawing = false;
      this.elements = [];
      this.history = [];
      this.historyIndex = -1;
      this.canvases = [];
      this.currentCanvasIndex = 0;
      this.init();
    }
    
    init() {
      this.mainCtx.lineCap = 'round';
      this.mainCtx.lineJoin = 'round';
      this.bindEvents();
      this.newCanvas();
      this.showToast('画板已就绪');
    }
    
    bindEvents() {
      let startX, startY;
      
      const getPos = (e) => {
        const rect = this.mainCanvas.getBoundingClientRect();
        return { x: e.clientX - rect.left, y: e.clientY - rect.top };
      };
      
      this.mainCanvas.onmousedown = (e) => {
        const pos = getPos(e);
        startX = pos.x; startY = pos.y;
        this.isDrawing = true;
        this.mainCtx.beginPath();
        this.mainCtx.moveTo(pos.x, pos.y);
      };
      
      this.mainCanvas.onmousemove = (e) => {
        if (!this.isDrawing) return;
        const pos = getPos(e);
        this.mainCtx.strokeStyle = this.currentColor;
        this.mainCtx.lineWidth = this.currentSize;
        this.mainCtx.lineTo(pos.x, pos.y);
        this.mainCtx.stroke();
      };
      
      this.mainCanvas.onmouseup = () => {
        this.isDrawing = false;
        this.saveHistory();
      };
    }
    
    setTool(tool) { this.currentTool = tool; }
    setColor(color) { this.currentColor = color; }
    setSize(size) { this.currentSize = parseInt(size); }
    
    newCanvas() {
      this.mainCtx.fillStyle = 'white';
      this.mainCtx.fillRect(0, 0, 800, 600);
      this.elements = [];
      this.saveHistory();
      this.updateCanvasList();
    }
    
    saveHistory() {
      this.historyIndex++;
      this.history[this.historyIndex] = this.mainCanvas.toDataURL();
      if (this.history.length > 20) { this.history.shift(); this.historyIndex--; }
    }
    
    undo() {
      if (this.historyIndex > 0) {
        this.historyIndex--;
        const img = new Image();
        img.onload = () => this.mainCtx.drawImage(img, 0, 0);
        img.src = this.history[this.historyIndex];
      }
    }
    
    exportCanvas() {
      const link = document.createElement('a');
      link.download = 'draw-board-' + Date.now() + '.png';
      link.href = this.mainCanvas.toDataURL();
      link.click();
      this.showToast('已导出');
    }
    
    handleImageFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          this.mainCtx.drawImage(img, 100, 100, 200, 200);
          this.saveHistory();
          this.showToast('图片已插入');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }
    
    updateCanvasList() {
      document.getElementById('canvasList').innerHTML = '<div class="canvas-item active">当前画板</div>';
    }
    
    showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }
  }
  
  const app = new DrawBoardApp();
  </script>
</body>
</html>
