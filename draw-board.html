<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>画板 - tool.pumf.top</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0abFA5;
      --color-on-primary: #ffffff;
      --color-primary-hover: #08d9a3;
      --color-primary-soft: rgba(10, 191, 165, 0.08);
      --color-ink: #1a1a2e;
      --color-body: #5c5c72;
      --color-muted: #9494a8;
      --color-canvas: #ffffff;
      --color-canvas-soft: #f8f9fb;
      --color-canvas-soft-2: #f0f2f8;
      --color-border: rgba(0, 0, 0, 0.07);
      --color-border-hover: rgba(10, 191, 165, 0.3);
      --color-shadow: rgba(0, 0, 0, 0.08);
      --radius-sm: 6px;
      --radius-md: 12px;
      --font-sans: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      font-family: var(--font-sans);
      background: var(--color-canvas-soft);
      color: var(--color-ink);
      height: 100vh;
      overflow: hidden;
    }
    
    .app {
      display: flex;
      height: 100vh;
    }
    
    /* Sidebar */
    .sidebar {
      width: 220px;
      background: var(--color-canvas);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-title { font-size: 14px; font-weight: 600; }
    .btn-small {
      padding: 6px 12px;
      border: 1px solid var(--color-border);
      background: var(--color-canvas);
      border-radius: var(--radius-sm);
      font-size: 12px;
      cursor: pointer;
      color: var(--color-body);
    }
    .btn-small:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .btn-small.primary { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); }
    
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .history-item {
      padding: 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      margin-bottom: 6px;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .history-item:hover { background: var(--color-canvas-soft); }
    .history-item.active { border-color: var(--color-primary); background: var(--color-primary-soft); }
    .history-thumb { width: 100%; height: 100px; background: #fff; border-radius: 4px; margin-bottom: 6px; object-fit: cover; border: 1px solid var(--color-border); }
    .history-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-actions { display: flex; gap: 4px; margin-top: 6px; }
    .history-btn { flex: 1; padding: 4px 8px; border: 1px solid var(--color-border); background: var(--color-canvas); border-radius: 4px; font-size: 11px; cursor: pointer; }
    .history-btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
    
    /* Main */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    
    .top-bar {
      height: 56px;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }
    .logo { font-size: 16px; font-weight: 600; text-decoration: none; color: var(--color-ink); }
    .logo span { color: var(--color-primary); }
    
    /* Toolbar */
    .toolbar {
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .tool-section {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-right: 12px;
      border-right: 1px solid var(--color-border);
    }
    .tool-section:last-child { border-right: none; padding-right: 0; }
    
    .tool-btn {
      width: 38px; height: 38px;
      border: 1px solid transparent;
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      color: var(--color-body);
      position: relative;
    }
    .tool-btn:hover { background: var(--color-canvas-soft); color: var(--color-ink); }
    .tool-btn.active { background: var(--color-primary-soft); color: var(--color-primary); border-color: var(--color-primary); }
    .tool-btn svg { width: 20px; height: 20px; }
    .tool-btn .shortcut { position: absolute; bottom: 2px; right: 4px; font-size: 9px; opacity: 0.6; }
    
    /* Color Palette */
    .color-palette { display: flex; flex-direction: column; gap: 4px; }
    .color-row { display: flex; gap: 4px; }
    .color-btn { width: 20px; height: 20px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; transition: transform 0.2s; }
    .color-btn:hover { transform: scale(1.1); }
    .color-btn.active { border-color: var(--color-ink); box-shadow: 0 0 0 2px var(--color-canvas); }
    .color-picker-wrapper { position: relative; width: 24px; height: 24px; }
    .color-picker { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .color-preview { width: 100%; height: 100%; border-radius: 4px; background: linear-gradient(45deg, #ff0000, #00ff00, #0000ff); pointer-events: none; border: 2px solid var(--color-border); }
    
    .size-control { display: flex; align-items: center; gap: 8px; }
    .size-slider { width: 80px; height: 6px; -webkit-appearance: none; background: var(--color-canvas-soft-2); border-radius: 3px; outline: none; }
    .size-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: var(--color-primary); border-radius: 50%; cursor: pointer; }
    .size-value { font-size: 12px; color: var(--color-muted); min-width: 32px; }
    
    .font-control { display: flex; align-items: center; gap: 8px; }
    .font-select, .font-input { padding: 6px 10px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: 13px; background: var(--color-canvas); }
    .font-input { width: 60px; }
    
    /* Canvas Area */
    .canvas-area {
      flex: 1;
      background: var(--color-canvas-soft-2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 40px;
      position: relative;
    }
    .canvas-wrapper { position: relative; background: white; box-shadow: 0 8px 40px var(--color-shadow); border-radius: var(--radius-sm); overflow: hidden; }
    #mainCanvas, #tempCanvas { display: block; }
    #tempCanvas { position: absolute; top: 0; left: 0; pointer-events: none; }
    
    /* Selection Box */
    .selection-box {
      position: absolute;
      border: 2px dashed var(--color-primary);
      pointer-events: none;
      display: none;
    }
    .selection-box.show { display: block; }
    .selection-handle {
      position: absolute;
      width: 10px; height: 10px;
      background: var(--color-primary);
      border: 2px solid white;
      border-radius: 50%;
    }
    .selection-handle.nw { top: -6px; left: -6px; }
    .selection-handle.ne { top: -6px; right: -6px; }
    .selection-handle.sw { bottom: -6px; left: -6px; }
    .selection-handle.se { bottom: -6px; right: -6px; }
    
    /* Bottom Bar */
    .bottom-bar {
      height: 40px;
      background: var(--color-canvas);
      border-top: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 12px;
      color: var(--color-muted);
    }
    .bottom-left { display: flex; gap: 16px; }
    
    /* Modals */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--color-canvas); border-radius: var(--radius-md); padding: 24px; max-width: 400px; width: 90%; }
    .modal-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
    .modal-input { width: 100%; padding: 10px 12px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: 14px; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    
    /* Toast */
    .toast { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--color-ink); color: white; padding: 10px 20px; border-radius: var(--radius-sm); font-size: 13px; z-index: 1000; opacity: 0; transition: all 0.3s; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    
    #fileInput { display: none; }
    
    @media (max-width: 1024px) { .sidebar { display: none; } }
    @media (max-width: 768px) { .toolbar { padding: 8px; gap: 8px; } .tool-section { padding-right: 8px; } .font-control { display: none !important; } .canvas-area { padding: 20px; } }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">📁 画板历史</span>
        <button class="btn-small primary" onclick="newCanvas()">+ 新建</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
    
    <!-- Main -->
    <div class="main">
      <!-- Top Bar -->
      <div class="top-bar">
        <a href="/" class="logo">tool<span>.pumf.top</span></a>
        <div>
          <button class="btn-small" onclick="saveCanvas()">💾 保存</button>
          <button class="btn-small" onclick="exportCanvas()">📤 导出</button>
        </div>
      </div>
      
      <!-- Toolbar -->
      <div class="toolbar">
        <div class="tool-section">
          <button class="tool-btn" id="tool-select" onclick="setTool('select')" title="选择/移动 (V)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/></svg>
            <span class="shortcut">V</span>
          </button>
          <button class="tool-btn active" id="tool-pen" onclick="setTool('pen')" title="画笔 (B)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
            <span class="shortcut">B</span>
          </button>
          <button class="tool-btn" id="tool-marker" onclick="setTool('marker')" title="荧光笔 (M)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19l-5 2 2-5L16 6l3 3-10 10z"/></svg>
            <span class="shortcut">M</span>
          </button>
          <button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')" title="橡皮擦 (E)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 20Z"/></svg>
            <span class="shortcut">E</span>
          </button>
          <button class="tool-btn" id="tool-line" onclick="setTool('line')" title="直线 (L)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/></svg>
            <span class="shortcut">L</span>
          </button>
          <button class="tool-btn" id="tool-rect" onclick="setTool('rect')" title="矩形 (R)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            <span class="shortcut">R</span>
          </button>
          <button class="tool-btn" id="tool-circle" onclick="setTool('circle')" title="圆形 (O)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
            <span class="shortcut">O</span>
          </button>
          <button class="tool-btn" id="tool-text" onclick="setTool('text')" title="文字 (T)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
            <span class="shortcut">T</span>
          </button>
          <button class="tool-btn" onclick="addImage()" title="插入图片 (I)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <span class="shortcut">I</span>
          </button>
        </div>
        
        <div class="tool-section">
          <div class="color-palette">
            <div class="color-row">
              <div class="color-btn active" style="background: #1a1a2e;" onclick="setColor('#1a1a2e')"></div>
              <div class="color-btn" style="background: #ef4444;" onclick="setColor('#ef4444')"></div>
              <div class="color-btn" style="background: #f59e0b;" onclick="setColor('#f59e0b')"></div>
              <div class="color-btn" style="background: #10b981;" onclick="setColor('#10b981')"></div>
              <div class="color-btn" style="background: #0abFA5;" onclick="setColor('#0abFA5')"></div>
              <div class="color-btn" style="background: #3b82f6;" onclick="setColor('#3b82f6')"></div>
              <div class="color-btn" style="background: #8b5cf6;" onclick="setColor('#8b5cf6')"></div>
              <div class="color-picker-wrapper">
                <div class="color-preview"></div>
                <input type="color" class="color-picker" id="colorPicker" value="#1a1a2e" onchange="setColor(this.value)">
              </div>
            </div>
          </div>
        </div>
        
        <div class="tool-section">
          <div class="size-control">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--color-muted);"><circle cx="12" cy="12" r="3"/></svg>
            <input type="range" class="size-slider" id="sizeSlider" min="1" max="50" value="3" oninput="setSize(this.value)">
            <span class="size-value" id="sizeValue">3px</span>
          </div>
        </div>
        
        <div class="tool-section font-control" id="fontControl" style="display: none;">
          <select class="font-select" id="fontFamily" onchange="setFont(this.value)">
            <option value="'Noto Sans SC', sans-serif">思源黑体</option>
            <option value="'Inter', sans-serif">Inter</option>
            <option value="serif">宋体</option>
            <option value="monospace">等宽</option>
          </select>
          <input type="number" class="font-input" id="fontSize" value="24" min="12" max="120" onchange="setFontSize(this.value)">
        </div>
        
        <div class="tool-section">
          <button class="tool-btn" id="btn-undo" onclick="undo()" disabled title="撤销">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>
          </button>
          <button class="tool-btn" id="btn-redo" onclick="redo()" disabled title="重做">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 019-9 9 9 0 016 2.3L21 13"/></svg>
          </button>
          <button class="tool-btn" id="btn-delete" onclick="deleteSelected()" disabled title="删除选中">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          </button>
          <button class="tool-btn" onclick="clearCanvas()" title="清空">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          </button>
        </div>
      </div>
      
      <!-- Canvas Area -->
      <div class="canvas-area" id="canvasArea">
        <div class="canvas-wrapper" id="canvasWrapper">
          <canvas id="mainCanvas" width="1200" height="800"></canvas>
          <canvas id="tempCanvas" width="1200" height="800"></canvas>
          <!-- Selection Box -->
          <div class="selection-box" id="selectionBox">
            <div class="selection-handle nw"></div>
            <div class="selection-handle ne"></div>
            <div class="selection-handle sw"></div>
            <div class="selection-handle se"></div>
          </div>
        </div>
      </div>
      
      <!-- Bottom Bar -->
      <div class="bottom-bar">
        <div class="bottom-left">
          <span>📐 1200 x 800</span>
          <span id="elementInfo">0 个元素</span>
          <span id="toolInfo">画笔</span>
        </div>
        <span id="coords">0, 0</span>
      </div>
    </div>
  </div>
  
  <!-- Text Modal -->
  <div class="modal-overlay" id="textModal">
    <div class="modal">
      <div class="modal-title">输入文字</div>
      <textarea class="modal-input" id="textInput" rows="4" placeholder="输入文字内容..."></textarea>
      <div class="modal-actions">
        <button class="btn-small" onclick="closeTextModal()">取消</button>
        <button class="btn-small primary" onclick="confirmText()">确定</button>
      </div>
    </div>
  </div>
  
  <input type="file" id="fileInput" accept="image/*" onchange="handleImageFile(event)">
  <div class="toast" id="toast"></div>
  
  <script>
    // Canvases
    const mainCanvas = document.getElementById('mainCanvas');
    const tempCanvas = document.getElementById('tempCanvas');
    const mainCtx = mainCanvas.getContext('2d');
    const tempCtx = tempCanvas.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');
    const selectionBox = document.getElementById('selectionBox');
    
    // State
    let currentTool = 'pen';
    let currentColor = '#1a1a2e';
    let currentSize = 3;
    let currentFont = "'Noto Sans SC', sans-serif";
    let currentFontSize = 24;
    
    // Element-based storage
    let elements = []; // {id, type, x, y, width, height, color, size, data, ...}
    let selectedElement = null;
    let isDrawing = false;
    let isDragging = false;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let dragStartX = 0;
    let dragStartY = 0;
    let tempElement = null;
    
    // Multi-canvas
    let canvases = [];
    let currentCanvasIndex = -1;
    
    // Undo/Redo
    let historyStack = [];
    let redoStack = [];
    const MAX_HISTORY = 50;
    
    // Tool names
    const toolNames = {
      select: '选择/移动',
      pen: '画笔',
      marker: '荧光笔',
      eraser: '橡皮擦',
      line: '直线',
      rect: '矩形',
      circle: '圆形',
      text: '文字'
    };
    
    // Init
    mainCtx.lineCap = 'round';
    mainCtx.lineJoin = 'round';
    tempCtx.lineCap = 'round';
    tempCtx.lineJoin = 'round';
    
    // Create first canvas
    newCanvas();
    
    // ==================== Tool Functions ====================
    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tool-' + tool)?.classList.add('active');
      
      document.getElementById('fontControl').style.display = (tool === 'text') ? 'flex' : 'none';
      document.getElementById('toolInfo').textContent = toolNames[tool] || tool;
      
      // Set cursor
      if (tool === 'select') {
        mainCanvas.style.cursor = 'default';
      } else if (tool === 'text') {
        mainCanvas.style.cursor = 'text';
      } else {
        mainCanvas.style.cursor = 'crosshair';
      }
      
      // Clear selection when switching tools
      if (tool !== 'select') {
        deselect();
      }
      
      tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
      render();
    }
    
    function setColor(color) {
      currentColor = color;
      document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('colorPicker').value = color;
      
      // Update selected element
      if (selectedElement) {
        selectedElement.color = color;
        saveHistory();
        render();
      }
    }
    
    function setSize(size) {
      currentSize = parseInt(size);
      document.getElementById('sizeValue').textContent = size + 'px';
      
      if (selectedElement) {
        selectedElement.size = currentSize;
        saveHistory();
        render();
      }
    }
    
    function setFont(font) { currentFont = font; }
    function setFontSize(size) { currentFontSize = parseInt(size); }
    
    // ==================== Element System ====================
    function createElement(type, data) {
      return {
        id: Date.now() + Math.random(),
        type: type,
        x: data.x || 0,
        y: data.y || 0,
        width: data.width || 0,
        height: data.height || 0,
        color: data.color || currentColor,
        size: data.size || currentSize,
        font: data.font || currentFont,
        fontSize: data.fontSize || currentFontSize,
        points: data.points || [],
        text: data.text || '',
        image: data.image || null,
        rotation: data.rotation || 0
      };
    }
    
    function render() {
      // Clear main canvas
      mainCtx.fillStyle = 'white';
      mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
      
      // Render all elements
      elements.forEach(el => {
        renderElement(mainCtx, el);
      });
      
      // Update UI
      document.getElementById('elementInfo').textContent = elements.length + ' 个元素';
      updateSelectionBox();
    }
    
    function renderElement(ctx, el, isTemp = false) {
      ctx.save();
      
      // Apply rotation if exists
      if (el.rotation) {
        const centerX = el.x + (el.width || 0) / 2;
        const centerY = el.y + (el.height || 0) / 2;
        ctx.translate(centerX, centerY);
        ctx.rotate(el.rotation * Math.PI / 180);
        ctx.translate(-centerX, -centerY);
      }
      
      switch(el.type) {
        case 'path':
          if (el.points.length > 1) {
            ctx.beginPath();
            ctx.moveTo(el.points[0].x, el.points[0].y);
            for (let i = 1; i < el.points.length; i++) {
              ctx.lineTo(el.points[i].x, el.points[i].y);
            }
            setupStroke(ctx, el);
            ctx.stroke();
          }
          break;
          
        case 'line':
          ctx.beginPath();
          ctx.moveTo(el.x, el.y);
          ctx.lineTo(el.x + el.width, el.y + el.height);
          setupStroke(ctx, el);
          ctx.stroke();
          break;
          
        case 'rect':
          ctx.beginPath();
          ctx.rect(el.x, el.y, el.width, el.height);
          setupStroke(ctx, el);
          ctx.stroke();
          break;
          
        case 'circle':
          ctx.beginPath();
          const radius = Math.sqrt(el.width * el.width + el.height * el.height);
          ctx.arc(el.x, el.y, radius, 0, 2 * Math.PI);
          setupStroke(ctx, el);
          ctx.stroke();
          break;
          
        case 'text':
          ctx.fillStyle = el.color;
          ctx.font = `${el.fontSize}px ${el.font}`;
          ctx.textBaseline = 'top';
          const lines = el.text.split('\n');
          lines.forEach((line, i) => {
            ctx.fillText(line, el.x, el.y + i * (el.fontSize * 1.4));
          });
          break;
          
        case 'image':
          if (el.image) {
            ctx.drawImage(el.image, el.x, el.y, el.width, el.height);
          }
          break;
      }
      
      ctx.restore();
    }
    
    function setupStroke(ctx, el) {
      if (el.type === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.strokeStyle = 'rgba(0,0,0,1)';
        ctx.lineWidth = (el.size || 3) * 3;
      } else if (el.type === 'marker') {
        ctx.globalCompositeOperation = 'multiply';
        ctx.strokeStyle = (el.color || '#000') + '66';
        ctx.lineWidth = (el.size || 3) * 2;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = el.color || '#000';
        ctx.lineWidth = el.size || 3;
      }
    }
    
    // ==================== Mouse Events ====================
    function getCoords(e) {
      const rect = mainCanvas.getBoundingClientRect();
      const scaleX = mainCanvas.width / rect.width;
      const scaleY = mainCanvas.height / rect.height;
      
      let clientX, clientY;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }
    
    function hitTest(x, y) {
      // Check from top to bottom (reverse order)
      for (let i = elements.length - 1; i >= 0; i--) {
        const el = elements[i];
        if (isPointInElement(x, y, el)) {
          return el;
        }
      }
      return null;
    }
    
    function isPointInElement(x, y, el) {
      switch(el.type) {
        case 'path':
          // Approximate with bounding box
          const bounds = getPathBounds(el.points);
          return x >= bounds.minX - el.size && x <= bounds.maxX + el.size &&
                 y >= bounds.minY - el.size && y <= bounds.maxY + el.size;
        case 'line':
        case 'rect':
        case 'text':
        case 'image':
          return x >= el.x && x <= el.x + el.width && y >= el.y && y <= el.y + el.height;
        case 'circle':
          const radius = Math.sqrt(el.width * el.width + el.height * el.height);
          const dist = Math.sqrt((x - el.x) ** 2 + (y - el.y) ** 2);
          return dist <= radius;
      }
      return false;
    }
    
    function getPathBounds(points) {
      if (!points.length) return { minX: 0, minY: 0, maxX: 0, maxY: 0 };
      let minX = points[0].x, maxX = points[0].x;
      let minY = points[0].y, maxY = points[0].y;
      points.forEach(p => {
        minX = Math.min(minX, p.x);
        maxX = Math.max(maxX, p.x);
        minY = Math.min(minY, p.y);
        maxY = Math.max(maxY, p.y);
      });
      return { minX, minY, maxX, maxY };
    }
    
    // Event listeners
    mainCanvas.addEventListener('mousedown', onPointerDown);
    mainCanvas.addEventListener('mousemove', onPointerMove);
    mainCanvas.addEventListener('mouseup', onPointerUp);
    mainCanvas.addEventListener('touchstart', onPointerDown, { passive: false });
    mainCanvas.addEventListener('touchmove', onPointerMove, { passive: false });
    mainCanvas.addEventListener('touchend', onPointerUp);
    
    function onPointerDown(e) {
      e.preventDefault();
      const coords = getCoords(e);
      
      if (currentTool === 'select') {
        const hit = hitTest(coords.x, coords.y);
        if (hit) {
          selectElement(hit);
          isDragging = true;
          dragOffsetX = coords.x - hit.x;
          dragOffsetY = coords.y - hit.y;
          dragStartX = hit.x;
          dragStartY = hit.y;
        } else {
          deselect();
        }
        return;
      }
      
      isDrawing = true;
      
      if (currentTool === 'text') {
        openTextModal(coords.x, coords.y);
        return;
      }
      
      if (currentTool === 'pen' || currentTool === 'eraser' || currentTool === 'marker') {
        tempElement = createElement('path', {
          x: coords.x,
          y: coords.y,
          points: [{x: coords.x, y: coords.y}]
        });
      } else {
        tempElement = createElement(currentTool, {
          x: coords.x,
          y: coords.y,
          width: 0,
          height: 0
        });
      }
    }
    
    function onPointerMove(e) {
      e.preventDefault();
      const coords = getCoords(e);
      document.getElementById('coords').textContent = `${Math.round(coords.x)}, ${Math.round(coords.y)}`;
      
      if (isDragging && selectedElement) {
        selectedElement.x = coords.x - dragOffsetX;
        selectedElement.y = coords.y - dragOffsetY;
        render();
        return;
      }
      
      if (!isDrawing || !tempElement) return;
      
      if (tempElement.type === 'path') {
        tempElement.points.push({x: coords.x, y: coords.y});
        // Render path on temp canvas
        tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
        renderElement(tempCtx, tempElement, true);
      } else {
        tempElement.width = coords.x - tempElement.x;
        tempElement.height = coords.y - tempElement.y;
        tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
        renderElement(tempCtx, tempElement, true);
      }
    }
    
    function onPointerUp() {
      if (isDragging) {
        isDragging = false;
        if (selectedElement && (selectedElement.x !== dragStartX || selectedElement.y !== dragStartY)) {
          saveHistory();
        }
        return;
      }
      
      if (!isDrawing || !tempElement) return;
      isDrawing = false;
      
      // Add element to list
      if (tempElement.type === 'path' && tempElement.points.length > 1) {
        elements.push(tempElement);
        saveHistory();
      } else if (tempElement.type !== 'path' && (Math.abs(tempElement.width) > 5 || Math.abs(tempElement.height) > 5)) {
        elements.push(tempElement);
        saveHistory();
      }
      
      tempElement = null;
      tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
      render();
      updateUndoRedoButtons();
    }
    
    // ==================== Selection ====================
    function selectElement(el) {
      selectedElement = el;
      updateSelectionBox();
      document.getElementById('btn-delete').disabled = false;
      
      // Update toolbar to show element properties
      document.getElementById('sizeSlider').value = el.size || 3;
      document.getElementById('sizeValue').textContent = (el.size || 3) + 'px';
    }
    
    function deselect() {
      selectedElement = null;
      selectionBox.classList.remove('show');
      document.getElementById('btn-delete').disabled = true;
    }
    
    function updateSelectionBox() {
      if (!selectedElement) {
        selectionBox.classList.remove('show');
        return;
      }
      
      const el = selectedElement;
      let x, y, w, h;
      
      switch(el.type) {
        case 'path':
          const bounds = getPathBounds(el.points);
          x = bounds.minX; y = bounds.minY;
          w = bounds.maxX - bounds.minX;
          h = bounds.maxY - bounds.minY;
          break;
        case 'circle':
          const r = Math.sqrt(el.width * el.width + el.height * el.height);
          x = el.x - r; y = el.y - r;
          w = r * 2; h = r * 2;
          break;
        default:
          x = el.x; y = el.y;
          w = Math.abs(el.width); h = Math.abs(el.height);
      }
      
      selectionBox.style.left = x + 'px';
      selectionBox.style.top = y + 'px';
      selectionBox.style.width = w + 'px';
      selectionBox.style.height = h + 'px';
      selectionBox.classList.add('show');
    }
    
    function deleteSelected() {
      if (!selectedElement) return;
      const index = elements.indexOf(selectedElement);
      if (index > -1) {
        elements.splice(index, 1);
        deselect();
        saveHistory();
        render();
        updateUndoRedoButtons();
      }
    }
    
    // ==================== Text ====================
    let textPos = null;
    function openTextModal(x, y) {
      textPos = {x, y};
      document.getElementById('textModal').classList.add('show');
      document.getElementById('textInput').value = '';
      document.getElementById('textInput').focus();
    }
    
    function closeTextModal() {
      document.getElementById('textModal').classList.remove('show');
      textPos = null;
      isDrawing = false;
    }
    
    function confirmText() {
      const text = document.getElementById('textInput').value.trim();
      if (text && textPos) {
        const el = createElement('text', {
          x: textPos.x,
          y: textPos.y,
          width: 200,
          height: text.split('\n').length * currentFontSize * 1.4,
          text: text,
          font: currentFont,
          fontSize: currentFontSize
        });
        elements.push(el);
        saveHistory();
        render();
        updateUndoRedoButtons();
      }
      closeTextModal();
    }
    
    // ==================== Image ====================
    function addImage() { document.getElementById('fileInput').click(); }
    
    function handleImageFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          const scale = Math.min(400 / img.width, 300 / img.height, 1);
          const el = createElement('image', {
            x: (mainCanvas.width - img.width * scale) / 2,
            y: (mainCanvas.height - img.height * scale) / 2,
            width: img.width * scale,
            height: img.height * scale,
            image: img
          });
          elements.push(el);
          saveHistory();
          render();
          updateUndoRedoButtons();
          showToast('图片已插入');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }
    
    // ==================== History ====================
    function saveHistory() {
      const state = JSON.stringify(elements.map(el => ({
        ...el,
        image: el.image ? '[Image]' : null
      })));
      historyStack.push({ elements: state, dataUrl: mainCanvas.toDataURL() });
      if (historyStack.length > MAX_HISTORY) historyStack.shift();
      redoStack = [];
    }
    
    function undo() {
      if (historyStack.length <= 1) return;
      redoStack.push(historyStack.pop());
      const prev = historyStack[historyStack.length - 1];
      loadState(prev);
      showToast('已撤销');
    }
    
    function redo() {
      if (redoStack.length === 0) return;
      const next = redoStack.pop();
      historyStack.push(next);
      loadState(next);
      showToast('已重做');
    }
    
    function loadState(state) {
      // Note: This is a simplified version. For full restoration, 
      // we'd need to store element data and recreate images
      const img = new Image();
      img.onload = () => {
        mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
        mainCtx.drawImage(img, 0, 0);
      };
      img.src = state.dataUrl;
      deselect();
      updateUndoRedoButtons();
    }
    
    function updateUndoRedoButtons() {
      document.getElementById('btn-undo').disabled = historyStack.length <= 1;
      document.getElementById('btn-redo').disabled = redoStack.length === 0;
    }
    
    // ==================== Canvas Management ====================
    function newCanvas() {
      if (currentCanvasIndex >= 0) {
        canvases[currentCanvasIndex] = { elements: [...elements], thumbnail: mainCanvas.toDataURL() };
      }
      
      elements = [];
      historyStack = [{ dataUrl: mainCanvas.toDataURL() }];
      redoStack = [];
      
      mainCtx.fillStyle = 'white';
      mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
      
      canvases.push({ elements: [], thumbnail: null, name: `画板 ${canvases.length + 1}` });
      currentCanvasIndex = canvases.length - 1;
      
      deselect();
      render();
      updateHistoryList();
      updateUndoRedoButtons();
      showToast('新建画板');
    }
    
    function switchCanvas(index) {
      if (index === currentCanvasIndex) return;
      
      canvases[currentCanvasIndex] = { elements: [...elements], thumbnail: mainCanvas.toDataURL() };
      
      currentCanvasIndex = index;
      const canvas = canvases[index];
      elements = canvas.elements || [];
      
      render();
      deselect();
      updateHistoryList();
      updateUndoRedoButtons();
    }
    
    function updateHistoryList() {
      const list = document.getElementById('historyList');
      list.innerHTML = canvases.map((c, i) => `
        <div class="history-item ${i === currentCanvasIndex ? 'active' : ''}" onclick="switchCanvas(${i})">
          <img class="history-thumb" src="${c.thumbnail || 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'}" alt="">
          <div class="history-name">${c.name || `画板 ${i + 1}`}</div>
          <div class="history-actions">
            <button class="history-btn" onclick="event.stopPropagation(); renameCanvas(${i})">重命名</button>
            <button class="history-btn" onclick="event.stopPropagation(); deleteCanvas(${i})">删除</button>
          </div>
        </div>
      `).join('');
    }
    
    function renameCanvas(i) {
      const name = prompt('重命名画板:', canvases[i].name || `画板 ${i + 1}`);
      if (name) {
        canvases[i].name = name;
        updateHistoryList();
      }
    }
    
    function deleteCanvas(i) {
      if (!confirm('确定删除这个画板吗？')) return;
      canvases.splice(i, 1);
      if (canvases.length === 0) {
        newCanvas();
      } else {
        currentCanvasIndex = Math.min(currentCanvasIndex, canvases.length - 1);
        switchCanvas(currentCanvasIndex);
      }
      updateHistoryList();
    }
    
    function saveCanvas() {
      canvases[currentCanvasIndex] = { elements: [...elements], thumbnail: mainCanvas.toDataURL() };
      showToast('已保存');
    }
    
    function exportCanvas() {
      const link = document.createElement('a');
      link.download = `drawing-${Date.now()}.png`;
      link.href = mainCanvas.toDataURL('image/png');
      link.click();
      showToast('已导出');
    }
    
    function clearCanvas() {
      if (!confirm('确定清空当前画板？')) return;
      elements = [];
      deselect();
      mainCtx.fillStyle = 'white';
      mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
      saveHistory();
      render();
      updateUndoRedoButtons();
      showToast('已清空');
    }
    
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    // ==================== Keyboard ====================
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      
      if (e.ctrlKey || e.metaKey) {
        switch(e.key.toLowerCase()) {
          case 'z': e.preventDefault(); undo(); break;
          case 'y': e.preventDefault(); redo(); break;
          case 's': e.preventDefault(); saveCanvas(); break;
        }
      } else {
        switch(e.key.toLowerCase()) {
          case 'v': setTool('select'); break;
          case 'b': setTool('pen'); break;
          case 'm': setTool('marker'); break;
          case 'e': setTool('eraser'); break;
          case 'l': setTool('line'); break;
          case 'r': setTool('rect'); break;
          case 'o': setTool('circle'); break;
          case 't': setTool('text'); break;
          case 'delete':
          case 'backspace':
            if (selectedElement) deleteSelected();
            break;
        }
      }
    });
    
    // Prevent scroll
    document.body.addEventListener('touchmove', (e) => {
      if (e.target === mainCanvas) e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
