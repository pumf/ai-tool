<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>画板 - tool.pumf.top</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0abFA5;
      --color-on-primary: #ffffff;
      --color-primary-hover: #08d9a3;
      --color-primary-soft: rgba(10, 191, 165, 0.08);
      --color-ink: #1a1a2e;
      --color-body: #5c5c72;
      --color-muted: #9494a8;
      --color-canvas: #ffffff;
      --color-canvas-soft: #f8f9fb;
      --color-canvas-soft-2: #f0f2f8;
      --color-border: rgba(0, 0, 0, 0.07);
      --color-border-hover: rgba(10, 191, 165, 0.3);
      --color-shadow: rgba(0, 0, 0, 0.08);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font-sans: 'Inter', 'Noto Sans SC', -apple-system, sans-serif;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      font-family: var(--font-sans);
      background: var(--color-canvas-soft);
      color: var(--color-ink);
      height: 100vh;
      overflow: hidden;
    }
    
    /* Layout */
    .app {
      display: flex;
      height: 100vh;
    }
    
    /* Sidebar - History */
    .sidebar {
      width: 220px;
      background: var(--color-canvas);
      border-right: 1px solid var(--color-border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-title {
      font-size: 14px;
      font-weight: 600;
    }
    .btn-small {
      padding: 6px 12px;
      border: 1px solid var(--color-border);
      background: var(--color-canvas);
      border-radius: var(--radius-sm);
      font-size: 12px;
      cursor: pointer;
      color: var(--color-body);
    }
    .btn-small:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .btn-small.primary {
      background: var(--color-primary);
      color: var(--color-on-primary);
      border-color: var(--color-primary);
    }
    
    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .history-item {
      padding: 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      margin-bottom: 6px;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .history-item:hover {
      background: var(--color-canvas-soft);
    }
    .history-item.active {
      border-color: var(--color-primary);
      background: var(--color-primary-soft);
    }
    .history-thumb {
      width: 100%;
      height: 100px;
      background: #fff;
      border-radius: 4px;
      margin-bottom: 6px;
      object-fit: cover;
      border: 1px solid var(--color-border);
    }
    .history-name {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-time {
      font-size: 11px;
      color: var(--color-muted);
    }
    .history-actions {
      display: flex;
      gap: 4px;
      margin-top: 6px;
    }
    .history-btn {
      flex: 1;
      padding: 4px 8px;
      border: 1px solid var(--color-border);
      background: var(--color-canvas);
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
    }
    .history-btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    
    /* Main Area */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* Top Toolbar */
    .top-bar {
      height: 56px;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }
    .logo {
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      color: var(--color-ink);
    }
    .logo span { color: var(--color-primary); }
    
    /* Toolbar */
    .toolbar {
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .tool-section {
      display: flex;
      align-items: center;
      gap: 4px;
      padding-right: 12px;
      border-right: 1px solid var(--color-border);
    }
    .tool-section:last-child { border-right: none; padding-right: 0; }
    
    .tool-btn {
      width: 38px;
      height: 38px;
      border: 1px solid transparent;
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      color: var(--color-body);
      position: relative;
    }
    .tool-btn:hover { background: var(--color-canvas-soft); color: var(--color-ink); }
    .tool-btn.active { 
      background: var(--color-primary-soft); 
      color: var(--color-primary);
      border-color: var(--color-primary);
    }
    .tool-btn svg { width: 20px; height: 20px; }
    .tool-btn .shortcut {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 9px;
      opacity: 0.6;
    }
    
    /* Color Palette */
    .color-palette {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .color-row {
      display: flex;
      gap: 4px;
    }
    .color-btn {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .color-btn:hover { transform: scale(1.1); }
    .color-btn.active {
      border-color: var(--color-ink);
      box-shadow: 0 0 0 2px var(--color-canvas);
    }
    
    .color-picker-wrapper {
      position: relative;
      width: 24px;
      height: 24px;
    }
    .color-picker {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }
    .color-preview {
      width: 100%;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(45deg, #ff0000, #00ff00, #0000ff);
      pointer-events: none;
      border: 2px solid var(--color-border);
    }
    
    /* Size Slider */
    .size-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .size-slider {
      width: 80px;
      height: 6px;
      -webkit-appearance: none;
      background: var(--color-canvas-soft-2);
      border-radius: 3px;
      outline: none;
    }
    .size-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--color-primary);
      border-radius: 50%;
      cursor: pointer;
    }
    .size-value {
      font-size: 12px;
      color: var(--color-muted);
      min-width: 24px;
    }
    
    /* Font Control */
    .font-control {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .font-select, .font-input {
      padding: 6px 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      background: var(--color-canvas);
    }
    .font-input { width: 60px; }
    
    /* Canvas Area */
    .canvas-area {
      flex: 1;
      background: var(--color-canvas-soft-2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 40px;
      position: relative;
    }
    
    .canvas-wrapper {
      position: relative;
      background: white;
      box-shadow: 0 8px 40px var(--color-shadow);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    
    #mainCanvas, #tempCanvas {
      display: block;
    }
    #tempCanvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    
    /* Image Transform Handle */
    .transform-handle {
      position: absolute;
      border: 2px dashed var(--color-primary);
      cursor: move;
    }
    .transform-handle .resize-handle {
      position: absolute;
      width: 12px;
      height: 12px;
      background: var(--color-primary);
      border-radius: 50%;
    }
    .transform-handle .resize-handle.nw { top: -6px; left: -6px; cursor: nw-resize; }
    .transform-handle .resize-handle.ne { top: -6px; right: -6px; cursor: ne-resize; }
    .transform-handle .resize-handle.sw { bottom: -6px; left: -6px; cursor: sw-resize; }
    .transform-handle .resize-handle.se { bottom: -6px; right: -6px; cursor: se-resize; }
    .transform-handle .rotate-handle {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 20px;
      background: var(--color-primary);
      border-radius: 50%;
      cursor: grab;
    }
    
    /* Text Input Overlay */
    .text-input-overlay {
      position: absolute;
      border: 2px dashed var(--color-primary);
      padding: 8px;
      background: transparent;
      min-width: 100px;
      outline: none;
    }
    
    /* Bottom Bar */
    .bottom-bar {
      height: 40px;
      background: var(--color-canvas);
      border-top: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 12px;
      color: var(--color-muted);
    }
    .bottom-left { display: flex; gap: 16px; }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--color-ink);
      color: white;
      padding: 10px 20px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      z-index: 1000;
      opacity: 0;
      transition: all 0.3s;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    
    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--color-canvas);
      border-radius: var(--radius-md);
      padding: 24px;
      max-width: 400px;
      width: 90%;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .modal-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      margin-bottom: 16px;
    }
    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    
    /* Hidden file input */
    #fileInput { display: none; }
    
    /* Responsive */
    @media (max-width: 1024px) {
      .sidebar { display: none; }
    }
    @media (max-width: 768px) {
      .toolbar { padding: 8px; gap: 8px; }
      .tool-section { padding-right: 8px; }
      .font-control { display: none; }
      .canvas-area { padding: 20px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- Sidebar - History -->
    <div class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">📁 画板历史</span>
        <button class="btn-small primary" onclick="newCanvas()">+ 新建</button>
      </div>
      <div class="history-list" id="historyList">
        <!-- History items will be added here -->
      </div>
    </div>
    
    <!-- Main Area -->
    <div class="main">
      <!-- Top Bar -->
      <div class="top-bar">
        <a href="/" class="logo">tool<span>.pumf.top</span></a>
        <div>
          <button class="btn-small" onclick="saveCanvas()">💾 保存</button>
          <button class="btn-small" onclick="exportCanvas()">📤 导出</button>
        </div>
      </div>
      
      <!-- Toolbar -->
      <div class="toolbar">
        <!-- Tools -->
        <div class="tool-section">
          <button class="tool-btn active" id="tool-pen" onclick="setTool('pen')" title="画笔">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg>
            <span class="shortcut">B</span>
          </button>
          <button class="tool-btn" id="tool-marker" onclick="setTool('marker')" title="荧光笔">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19l-5 2 2-5L16 6l3 3-10 10z"/><path d="M17 8l3-3"/><path d="M2 22l5-2"/></svg>
            <span class="shortcut">M</span>
          </button>
          <button class="tool-btn" id="tool-eraser" onclick="setTool('eraser')" title="橡皮擦">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 20Z"/></svg>
            <span class="shortcut">E</span>
          </button>
          <button class="tool-btn" id="tool-line" onclick="setTool('line')" title="直线">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/></svg>
            <span class="shortcut">L</span>
          </button>
          <button class="tool-btn" id="tool-rect" onclick="setTool('rect')" title="矩形">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
            <span class="shortcut">R</span>
          </button>
          <button class="tool-btn" id="tool-circle" onclick="setTool('circle')" title="圆形">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
            <span class="shortcut">C</span>
          </button>
          <button class="tool-btn" id="tool-text" onclick="setTool('text')" title="文字">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
            <span class="shortcut">T</span>
          </button>
          <button class="tool-btn" id="tool-image" onclick="addImage()" title="插入图片">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            <span class="shortcut">I</span>
          </button>
        </div>
        
        <!-- Color Palette -->
        <div class="tool-section">
          <div class="color-palette">
            <div class="color-row">
              <div class="color-btn active" style="background: #1a1a2e;" onclick="setColor('#1a1a2e')"></div>
              <div class="color-btn" style="background: #ef4444;" onclick="setColor('#ef4444')"></div>
              <div class="color-btn" style="background: #f59e0b;" onclick="setColor('#f59e0b')"></div>
              <div class="color-btn" style="background: #10b981;" onclick="setColor('#10b981')"></div>
              <div class="color-btn" style="background: #0abFA5;" onclick="setColor('#0abFA5')"></div>
              <div class="color-btn" style="background: #3b82f6;" onclick="setColor('#3b82f6')"></div>
              <div class="color-btn" style="background: #8b5cf6;" onclick="setColor('#8b5cf6')"></div>
            </div>
            <div class="color-row">
              <div class="color-btn" style="background: #6b7280;" onclick="setColor('#6b7280')"></div>
              <div class="color-btn" style="background: #fca5a5;" onclick="setColor('#fca5a5')"></div>
              <div class="color-btn" style="background: #fcd34d;" onclick="setColor('#fcd34d')"></div>
              <div class="color-btn" style="background: #6ee7b7;" onclick="setColor('#6ee7b7')"></div>
              <div class="color-btn" style="background: #93c5fd;" onclick="setColor('#93c5fd')"></div>
              <div class="color-btn" style="background: #c4b5fd;" onclick="setColor('#c4b5fd')"></div>
              <div class="color-picker-wrapper">
                <div class="color-preview"></div>
                <input type="color" class="color-picker" id="colorPicker" value="#1a1a2e" onchange="setColor(this.value)">
              </div>
            </div>
          </div>
        </div>
        
        <!-- Size -->
        <div class="tool-section">
          <div class="size-control">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--color-muted);"><circle cx="12" cy="12" r="3"/></svg>
            <input type="range" class="size-slider" id="sizeSlider" min="1" max="50" value="3" oninput="setSize(this.value)">
            <span class="size-value" id="sizeValue">3px</span>
          </div>
        </div>
        
        <!-- Font (only for text tool) -->
        <div class="tool-section font-control" id="fontControl" style="display: none;">
          <select class="font-select" id="fontFamily" onchange="setFont(this.value)">
            <option value="'Noto Sans SC', sans-serif">思源黑体</option>
            <option value="'Inter', sans-serif">Inter</option>
            <option value="serif">宋体</option>
            <option value="monospace">等宽</option>
          </select>
          <input type="number" class="font-input" id="fontSize" value="24" min="12" max="120" onchange="setFontSize(this.value)">
        </div>
        
        <!-- History -->
        <div class="tool-section">
          <button class="tool-btn" id="btn-undo" onclick="undo()" disabled title="撤销">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/></svg>
            <span class="shortcut">Z</span>
          </button>
          <button class="tool-btn" id="btn-redo" onclick="redo()" disabled title="重做">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 019-9 9 9 0 016 2.3L21 13"/></svg>
            <span class="shortcut">Y</span>
          </button>
          <button class="tool-btn" onclick="clearCanvas()" title="清空">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
          </button>
        </div>
      </div>
      
      <!-- Canvas Area -->
      <div class="canvas-area" id="canvasArea">
        <div class="canvas-wrapper" id="canvasWrapper">
          <canvas id="mainCanvas" width="1200" height="800"></canvas>
          <canvas id="tempCanvas" width="1200" height="800"></canvas>
        </div>
      </div>
      
      <!-- Bottom Bar -->
      <div class="bottom-bar">
        <div class="bottom-left">
          <span>📐 1200 x 800</span>
          <span id="strokeInfo">0 笔</span>
          <span id="zoomInfo">100%</span>
        </div>
        <span id="coords">0, 0</span>
      </div>
    </div>
  </div>
  
  <!-- Text Input Modal -->
  <div class="modal-overlay" id="textModal">
    <div class="modal">
      <div class="modal-title">输入文字</div>
      <textarea class="modal-input" id="textInput" rows="4" placeholder="输入文字内容..."></textarea>
      <div class="modal-actions">
        <button class="btn-small" onclick="closeTextModal()">取消</button>
        <button class="btn-small primary" onclick="confirmText()">确定</button>
      </div>
    </div>
  </div>
  
  <!-- Hidden File Input -->
  <input type="file" id="fileInput" accept="image/*" onchange="handleImageFile(event)">
  
  <!-- Toast -->
  <div class="toast" id="toast"></div>
  
  <script>
    // Canvas Setup
    const mainCanvas = document.getElementById('mainCanvas');
    const tempCanvas = document.getElementById('tempCanvas');
    const mainCtx = mainCanvas.getContext('2d');
    const tempCtx = tempCanvas.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');
    
    // State
    let currentTool = 'pen';
    let currentColor = '#1a1a2e';
    let currentSize = 3;
    let currentFont = "'Noto Sans SC', sans-serif";
    let currentFontSize = 24;
    let isDrawing = false;
    let startX, startY;
    let currentImage = null;
    let textPosition = null;
    
    // History System
    let drawings = []; // Array of canvas image data
    let currentDrawingIndex = -1;
    let drawingNames = [];
    
    // Undo/Redo System
    let historyStack = [];
    let redoStack = [];
    const MAX_HISTORY = 50;
    
    // Initialize
    mainCtx.fillStyle = 'white';
    mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
    mainCtx.lineCap = 'round';
    mainCtx.lineJoin = 'round';
    tempCtx.lineCap = 'round';
    tempCtx.lineJoin = 'round';
    
    // Create first drawing
    newCanvas();
    
    // ==================== Tools ====================
    function setTool(tool) {
      currentTool = tool;
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('tool-' + tool)?.classList.add('active');
      
      // Show/hide font control
      document.getElementById('fontControl').style.display = 
        (tool === 'text') ? 'flex' : 'none';
      
      // Set cursor
      mainCanvas.style.cursor = tool === 'text' ? 'text' : 'crosshair';
      
      // Clear temp canvas
      tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
    }
    
    function setColor(color) {
      currentColor = color;
      document.querySelectorAll('.color-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('colorPicker').value = color;
    }
    
    function setSize(size) {
      currentSize = parseInt(size);
      document.getElementById('sizeValue').textContent = size + 'px';
    }
    
    function setFont(font) {
      currentFont = font;
    }
    
    function setFontSize(size) {
      currentFontSize = parseInt(size);
    }
    
    // ==================== Drawing ====================
    function getCoords(e) {
      const rect = mainCanvas.getBoundingClientRect();
      const scaleX = mainCanvas.width / rect.width;
      const scaleY = mainCanvas.height / rect.height;
      
      let clientX, clientY;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }
    
    mainCanvas.addEventListener('mousedown', startDrawing);
    mainCanvas.addEventListener('mousemove', draw);
    mainCanvas.addEventListener('mouseup', endDrawing);
    mainCanvas.addEventListener('mouseout', endDrawing);
    mainCanvas.addEventListener('touchstart', startDrawing, { passive: false });
    mainCanvas.addEventListener('touchmove', draw, { passive: false });
    mainCanvas.addEventListener('touchend', endDrawing);
    
    function startDrawing(e) {
      if (currentTool === 'text') {
        const coords = getCoords(e);
        textPosition = coords;
        openTextModal();
        return;
      }
      
      e.preventDefault();
      isDrawing = true;
      const coords = getCoords(e);
      startX = coords.x;
      startY = coords.y;
      
      if (currentTool === 'pen' || currentTool === 'eraser' || currentTool === 'marker') {
        mainCtx.beginPath();
        mainCtx.moveTo(startX, startY);
        
        setupContext(mainCtx);
        
        // Draw dot
        mainCtx.lineTo(startX, startY);
        mainCtx.stroke();
      }
    }
    
    function draw(e) {
      e.preventDefault();
      const coords = getCoords(e);
      document.getElementById('coords').textContent = `${Math.round(coords.x)}, ${Math.round(coords.y)}`;
      
      if (!isDrawing) return;
      
      if (currentTool === 'pen' || currentTool === 'eraser') {
        mainCtx.lineTo(coords.x, coords.y);
        mainCtx.stroke();
      } else if (currentTool === 'marker') {
        mainCtx.lineTo(coords.x, coords.y);
        mainCtx.stroke();
      } else {
        // Shape preview on temp canvas
        tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
        tempCtx.beginPath();
        setupContext(tempCtx);
        
        if (currentTool === 'line') {
          tempCtx.moveTo(startX, startY);
          tempCtx.lineTo(coords.x, coords.y);
        } else if (currentTool === 'rect') {
          tempCtx.rect(startX, startY, coords.x - startX, coords.y - startY);
        } else if (currentTool === 'circle') {
          const radius = Math.sqrt(Math.pow(coords.x - startX, 2) + Math.pow(coords.y - startY, 2));
          tempCtx.arc(startX, startY, radius, 0, 2 * Math.PI);
        }
        
        tempCtx.stroke();
      }
    }
    
    function endDrawing() {
      if (!isDrawing) return;
      isDrawing = false;
      
      if (currentTool === 'line' || currentTool === 'rect' || currentTool === 'circle') {
        // Copy from temp to main
        mainCtx.drawImage(tempCanvas, 0, 0);
        tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
      }
      
      saveHistory();
      updateUndoRedoButtons();
    }
    
    function setupContext(ctx) {
      if (currentTool === 'eraser') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.strokeStyle = 'rgba(0,0,0,1)';
        ctx.lineWidth = currentSize * 3;
      } else if (currentTool === 'marker') {
        ctx.globalCompositeOperation = 'multiply';
        ctx.strokeStyle = currentColor + '66'; // 40% opacity
        ctx.lineWidth = currentSize * 2;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = currentColor;
        ctx.lineWidth = currentSize;
      }
    }
    
    // ==================== Text ====================
    function openTextModal() {
      document.getElementById('textModal').classList.add('show');
      document.getElementById('textInput').value = '';
      document.getElementById('textInput').focus();
    }
    
    function closeTextModal() {
      document.getElementById('textModal').classList.remove('show');
      textPosition = null;
    }
    
    function confirmText() {
      const text = document.getElementById('textInput').value.trim();
      if (text && textPosition) {
        mainCtx.globalCompositeOperation = 'source-over';
        mainCtx.fillStyle = currentColor;
        mainCtx.font = `${currentFontSize}px ${currentFont}`;
        mainCtx.textBaseline = 'top';
        
        const lines = text.split('\n');
        lines.forEach((line, i) => {
          mainCtx.fillText(line, textPosition.x, textPosition.y + i * (currentFontSize * 1.4));
        });
        
        saveHistory();
        updateUndoRedoButtons();
      }
      closeTextModal();
    }
    
    // ==================== Image ====================
    function addImage() {
      document.getElementById('fileInput').click();
    }
    
    function handleImageFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          // Draw image centered on canvas
          const scale = Math.min(400 / img.width, 300 / img.height, 1);
          const w = img.width * scale;
          const h = img.height * scale;
          const x = (mainCanvas.width - w) / 2;
          const y = (mainCanvas.height - h) / 2;
          
          mainCtx.drawImage(img, x, y, w, h);
          saveHistory();
          updateUndoRedoButtons();
          showToast('图片已插入');
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }
    
    // ==================== History System ====================
    function saveHistory() {
      const imageData = mainCanvas.toDataURL();
      historyStack.push(imageData);
      if (historyStack.length > MAX_HISTORY) {
        historyStack.shift();
      }
      redoStack = [];
      
      // Update current drawing
      if (currentDrawingIndex >= 0) {
        drawings[currentDrawingIndex] = imageData;
        updateHistoryList();
      }
    }
    
    function undo() {
      if (historyStack.length <= 1) return;
      
      redoStack.push(historyStack.pop());
      const previous = historyStack[historyStack.length - 1];
      loadImageData(previous);
      updateUndoRedoButtons();
      showToast('已撤销');
    }
    
    function redo() {
      if (redoStack.length === 0) return;
      
      const next = redoStack.pop();
      historyStack.push(next);
      loadImageData(next);
      updateUndoRedoButtons();
      showToast('已重做');
    }
    
    function loadImageData(dataUrl) {
      const img = new Image();
      img.onload = function() {
        mainCtx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
        mainCtx.drawImage(img, 0, 0);
        
        // Update current drawing
        if (currentDrawingIndex >= 0) {
          drawings[currentDrawingIndex] = dataUrl;
          updateHistoryList();
        }
      };
      img.src = dataUrl;
    }
    
    function updateUndoRedoButtons() {
      document.getElementById('btn-undo').disabled = historyStack.length <= 1;
      document.getElementById('btn-redo').disabled = redoStack.length === 0;
      document.getElementById('strokeInfo').textContent = `${historyStack.length - 1} 笔`;
    }
    
    // ==================== Multi Canvas ====================
    function newCanvas() {
      // Save current
      if (currentDrawingIndex >= 0 && drawings[currentDrawingIndex]) {
        drawings[currentDrawingIndex] = mainCanvas.toDataURL();
      }
      
      // Create new
      mainCtx.fillStyle = 'white';
      mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
      
      const imageData = mainCanvas.toDataURL();
      drawings.push(imageData);
      drawingNames.push(`画板 ${drawings.length}`);
      currentDrawingIndex = drawings.length - 1;
      
      // Reset history
      historyStack = [imageData];
      redoStack = [];
      
      updateHistoryList();
      updateUndoRedoButtons();
      showToast('新建画板');
    }
    
    function switchDrawing(index) {
      if (index === currentDrawingIndex) return;
      
      // Save current
      if (currentDrawingIndex >= 0) {
        drawings[currentDrawingIndex] = mainCanvas.toDataURL();
      }
      
      // Load new
      currentDrawingIndex = index;
      loadImageData(drawings[index]);
      
      // Reset history for new drawing
      historyStack = [drawings[index]];
      redoStack = [];
      
      updateHistoryList();
      updateUndoRedoButtons();
    }
    
    function deleteDrawing(index, event) {
      event.stopPropagation();
      if (!confirm('确定删除这个画板吗？')) return;
      
      drawings.splice(index, 1);
      drawingNames.splice(index, 1);
      
      if (drawings.length === 0) {
        newCanvas();
      } else {
        currentDrawingIndex = Math.min(currentDrawingIndex, drawings.length - 1);
        loadImageData(drawings[currentDrawingIndex]);
        historyStack = [drawings[currentDrawingIndex]];
        redoStack = [];
        updateHistoryList();
        updateUndoRedoButtons();
      }
    }
    
    function renameDrawing(index, event) {
      event.stopPropagation();
      const newName = prompt('重命名画板:', drawingNames[index]);
      if (newName) {
        drawingNames[index] = newName;
        updateHistoryList();
      }
    }
    
    function updateHistoryList() {
      const list = document.getElementById('historyList');
      list.innerHTML = drawings.map((data, i) => `
        <div class="history-item ${i === currentDrawingIndex ? 'active' : ''}" onclick="switchDrawing(${i})">
          <img class="history-thumb" src="${data}" alt="">
          <div class="history-name">${drawingNames[i]}</div>
          <div class="history-actions">
            <button class="history-btn" onclick="renameDrawing(${i}, event)">重命名</button>
            <button class="history-btn" onclick="deleteDrawing(${i}, event)">删除</button>
          </div>
        </div>
      `).join('');
    }
    
    // ==================== Actions ====================
    function clearCanvas() {
      if (!confirm('确定清空当前画板？')) return;
      
      mainCtx.fillStyle = 'white';
      mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
      saveHistory();
      updateUndoRedoButtons();
      showToast('已清空');
    }
    
    function saveCanvas() {
      if (currentDrawingIndex >= 0) {
        drawings[currentDrawingIndex] = mainCanvas.toDataURL();
      }
      showToast('已保存到历史');
    }
    
    function exportCanvas() {
      const link = document.createElement('a');
      link.download = `drawing-${Date.now()}.png`;
      link.href = mainCanvas.toDataURL('image/png');
      link.click();
      showToast('已导出');
    }
    
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
    
    // ==================== Keyboard Shortcuts ====================
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
      
      if (e.ctrlKey || e.metaKey) {
        switch(e.key.toLowerCase()) {
          case 'z': e.preventDefault(); undo(); break;
          case 'y': e.preventDefault(); redo(); break;
          case 's': e.preventDefault(); saveCanvas(); break;
        }
      } else {
        switch(e.key.toLowerCase()) {
          case 'b': setTool('pen'); break;
          case 'm': setTool('marker'); break;
          case 'e': setTool('eraser'); break;
          case 'l': setTool('line'); break;
          case 'r': setTool('rect'); break;
          case 'c': setTool('circle'); break;
          case 't': setTool('text'); break;
          case 'i': addImage(); break;
          case '[': setSize(Math.max(1, currentSize - 1)); document.getElementById('sizeSlider').value = currentSize; break;
          case ']': setSize(Math.min(50, currentSize + 1)); document.getElementById('sizeSlider').value = currentSize; break;
        }
      }
    });
    
    // Prevent scrolling
    document.body.addEventListener('touchmove', (e) => {
      if (e.target === mainCanvas) e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
