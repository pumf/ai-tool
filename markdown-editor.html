<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown 编辑器 - 小飞 AI 工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0abFA5;
      --color-on-primary: #ffffff;
      --color-primary-hover: #08d9a3;
      --color-primary-soft: rgba(10, 191, 165, 0.08);
      --color-primary-glow: rgba(10, 191, 165, 0.15);
      --color-ink: #1a1a2e;
      --color-body: #5c5c72;
      --color-muted: #9494a8;
      --color-canvas: #ffffff;
      --color-canvas-soft: #f8f9fb;
      --color-canvas-soft-2: #f0f2f8;
      --color-border: rgba(0, 0, 0, 0.07);
      --color-border-hover: rgba(10, 191, 165, 0.3);
      --color-border-strong: rgba(0, 0, 0, 0.12);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --space-xs: 8px;
      --space-sm: 12px;
      --space-md: 16px;
      --space-lg: 24px;
      --font-sans: 'Inter', -apple-system, sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--color-canvas-soft);
      color: var(--color-ink);
      min-height: 100vh;
    }
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-border);
      height: 56px; display: flex; align-items: center;
    }
    .nav-inner {
      max-width: 1400px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      width: 100%;
    }
    .nav-logo {
      font-size: 16px; font-weight: 600; color: var(--color-ink);
      text-decoration: none;
    }
    .nav-logo span { color: var(--color-primary); }
    .nav-back {
      font-size: 14px; color: var(--color-body); text-decoration: none;
      display: flex; align-items: center; gap: 6px;
    }
    .nav-back:hover { color: var(--color-primary); }
    .container {
      max-width: 1400px; margin: 0 auto; padding: 24px;
      height: calc(100vh - 56px);
    }
    .header {
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 24px; font-weight: 600; letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 14px; color: var(--color-body);
    }
    .toolbar {
      display: flex; gap: 8px; margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 8px 16px; border: 1px solid var(--color-border);
      background: var(--color-canvas); border-radius: var(--radius-sm);
      font-size: 13px; cursor: pointer; transition: all 0.2s;
      color: var(--color-body);
    }
    .btn:hover {
      border-color: var(--color-border-hover);
      color: var(--color-primary);
    }
    .btn-primary {
      background: var(--color-primary); color: var(--color-on-primary);
      border-color: var(--color-primary);
    }
    .btn-primary:hover {
      background: var(--color-primary-hover);
      color: var(--color-on-primary);
    }
    .editor-container {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      height: calc(100% - 140px);
    }
    .panel {
      background: var(--color-canvas); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); overflow: hidden;
      display: flex; flex-direction: column;
    }
    .panel-header {
      padding: 12px 16px; background: var(--color-canvas-soft);
      border-bottom: 1px solid var(--color-border);
      font-size: 13px; font-weight: 500; color: var(--color-body);
      display: flex; justify-content: space-between; align-items: center;
    }
    textarea {
      flex: 1; border: none; padding: 16px; font-family: var(--font-mono);
      font-size: 14px; line-height: 1.7; resize: none; outline: none;
      background: var(--color-canvas); color: var(--color-ink);
    }
    .preview {
      flex: 1; padding: 16px; overflow-y: auto;
      font-size: 15px; line-height: 1.8;
    }
    .preview h1, .preview h2, .preview h3, .preview h4 {
      margin-top: 24px; margin-bottom: 12px;
      font-weight: 600;
    }
    .preview h1 { font-size: 28px; border-bottom: 1px solid var(--color-border); padding-bottom: 8px; }
    .preview h2 { font-size: 22px; border-bottom: 1px solid var(--color-border); padding-bottom: 6px; }
    .preview h3 { font-size: 18px; }
    .preview p { margin-bottom: 12px; }
    .preview code {
      background: var(--color-canvas-soft-2); padding: 2px 6px;
      border-radius: 4px; font-family: var(--font-mono); font-size: 13px;
    }
    .preview pre {
      background: var(--color-canvas-soft-2); padding: 16px;
      border-radius: var(--radius-sm); overflow-x: auto;
      margin-bottom: 16px;
    }
    .preview pre code { background: none; padding: 0; }
    .preview blockquote {
      border-left: 4px solid var(--color-primary);
      padding-left: 16px; margin: 16px 0;
      color: var(--color-body);
    }
    .preview ul, .preview ol {
      margin-left: 24px; margin-bottom: 12px;
    }
    .preview li { margin-bottom: 4px; }
    .preview a { color: var(--color-primary); text-decoration: none; }
    .preview a:hover { text-decoration: underline; }
    .preview img { max-width: 100%; border-radius: var(--radius-sm); }
    .preview table {
      width: 100%; border-collapse: collapse; margin-bottom: 16px;
    }
    .preview th, .preview td {
      padding: 8px 12px; border: 1px solid var(--color-border);
      text-align: left;
    }
    .preview th {
      background: var(--color-canvas-soft); font-weight: 500;
    }
    @media (max-width: 900px) {
      .editor-container { grid-template-columns: 1fr; height: auto; }
      .panel { min-height: 400px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">小飞<span> AI 工具</span></a>
      <a href="/" class="nav-back">← 返回首页</a>
    </div>
  </nav>
  
  <div class="container">
    <div class="header">
      <h1>Markdown 编辑器</h1>
      <p>所见即所得，实时预览。所有处理在本地完成，内容不会上传。</p>
    </div>
    
    <div class="toolbar">
      <button class="btn btn-primary" onclick="insertText('# 标题\n')">H1</button>
      <button class="btn btn-primary" onclick="insertText('## 标题\n')">H2</button>
      <button class="btn btn-primary" onclick="insertText('**粗体**')">粗体</button>
      <button class="btn btn-primary" onclick="insertText('*斜体*')">斜体</button>
      <button class="btn btn-primary" onclick="insertText('```\n代码\n```')">代码块</button>
      <button class="btn btn-primary" onclick="insertText('- [ ] 任务')">任务</button>
      <button class="btn" onclick="clearEditor()">清空</button>
      <button class="btn" onclick="copyMarkdown()">复制 Markdown</button>
      <button class="btn" onclick="copyHTML()">复制 HTML</button>
      <button class="btn" onclick="downloadMD()">下载 .md</button>
      <input type="file" id="fileInput" accept=".md,.txt,.markdown" style="display:none" onchange="loadFile(event)">
      <button class="btn" onclick="document.getElementById('fileInput').click()">导入文件</button>
    </div>
    
    <div class="editor-container">
      <div class="panel">
        <div class="panel-header">
          <span>Markdown</span>
          <span id="charCount">0 字符</span>
        </div>
        <textarea id="editor" placeholder="在此输入 Markdown..."># 欢迎使用 Markdown 编辑器

这是一个**简洁高效**的 Markdown 编辑器。

> 简洁工具，专注本质。</textarea>
      </div>
      <div class="panel">
        <div class="panel-header">
          <span>预览</span>
        </div>
        <div id="preview" class="preview"></div>
      </div>
    </div>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const charCount = document.getElementById('charCount');
    
    // Simple Markdown parser
    function parseMarkdown(text) {
      let html = text
        // Escape HTML
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        // Headers
        .replace(/^###### (.*$)/gim, '<h6>$1</h6>')
        .replace(/^##### (.*$)/gim, '<h5>$1</h5>')
        .replace(/^#### (.*$)/gim, '<h4>$1</h4>')
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        // Bold & Italic
        .replace(/\*\*\*(.*?)\*\*\*/g, '<strong><em>$1</em></strong>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/__(.*?)__/g, '<strong>$1</strong>')
        .replace(/_(.*?)_/g, '<em>$1</em>')
        // Code blocks
        .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        // Links
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
        // Images
        .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2">')
        // Task lists
        .replace(/^- \[x\] (.*$)/gim, '<li style="list-style:none;margin-left:0;"><input type="checkbox" checked disabled> $1</li>')
        .replace(/^- \[ \] (.*$)/gim, '<li style="list-style:none;margin-left:0;"><input type="checkbox" disabled> $1</li>')
        // Lists
        .replace(/^\* (.*$)/gim, '<li>$1</li>')
        .replace(/^- (.*$)/gim, '<li>$1</li>')
        .replace(/^\d+\. (.*$)/gim, '<li>$1</li>')
        // Blockquote
        .replace(/^> (.*$)/gim, '<blockquote>$1</blockquote>')
        // Tables
        .replace(/\|(.+)\|/g, function(match) {
          const cells = match.split('|').filter(c => c.trim() !== '');
          if (cells.length === 0) return '';
          if (cells[0].trim().match(/^-+$/)) return '';
          return '<tr>' + cells.map(c => `<td>${c.trim()}</td>`).join('') + '</tr>';
        })
        // Line breaks
        .replace(/\n/g, '<br>');
      
      // Wrap lists
      html = html.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
      
      return html;
    }
    
    function updatePreview() {
      const text = editor.value;
      preview.innerHTML = parseMarkdown(text);
      charCount.textContent = `${text.length} 字符`;
      localStorage.setItem('markdown_content', text);
    }
    
    function insertText(text) {
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      const value = editor.value;
      editor.value = value.substring(0, start) + text + value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + text.length;
      editor.focus();
      updatePreview();
    }
    
    function clearEditor() {
      if (confirm('确定要清空所有内容吗？')) {
        editor.value = '';
        updatePreview();
      }
    }
    
    function copyMarkdown() {
      navigator.clipboard.writeText(editor.value);
      showToast('Markdown 已复制');
    }
    
    function copyHTML() {
      navigator.clipboard.writeText(preview.innerHTML);
      showToast('HTML 已复制');
    }
    
    function downloadMD() {
      const blob = new Blob([editor.value], { type: 'text/markdown' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'document.md';
      a.click();
      URL.revokeObjectURL(url);
    }
    
    function loadFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        editor.value = e.target.result;
        updatePreview();
        showToast('文件已导入');
      };
      reader.readAsText(file);
    }
    
    function showToast(msg) {
      const toast = document.createElement('div');
      toast.textContent = msg;
      toast.style.cssText = 'position:fixed;bottom:24px;right:24px;background:var(--color-ink);color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;z-index:9999;';
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2000);
    }
    
    // Init
    const saved = localStorage.getItem('markdown_content');
    if (saved) editor.value = saved;
    editor.addEventListener('input', updatePreview);
    updatePreview();
  </script>
</body>
</html>
