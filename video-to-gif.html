<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频转 GIF — 小飞 AI 工具</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🎬</text></svg>">
<style>
:root {
  --primary: #3b82f6;
  --primary-light: #eff6ff;
  --primary-dark: #2563eb;
  --bg: #f8fafc;
  --card: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --text-secondary: #64748b;
  --radius: 12px;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 10;
}
header a {
  color: var(--text-secondary);
  text-decoration: none;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 4px;
}
header a:hover { color: var(--primary); }
header h1 { font-size: 18px; font-weight: 600; flex: 1; }
.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 24px 16px 60px;
  width: 100%;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.card-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--text);
}
.drop-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  transition: all .2s;
  position: relative;
}
.drop-zone:hover, .drop-zone.dragover {
  border-color: var(--primary);
  background: var(--primary-light);
}
.drop-zone-icon {
  font-size: 40px;
  margin-bottom: 8px;
}
.drop-zone-text {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.6;
}
.drop-zone-text strong { color: var(--primary); cursor: pointer; }
.drop-zone-hint {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 8px;
}
input[type="file"] { display: none; }
.video-preview {
  display: none;
  margin-top: 16px;
}
.video-preview video {
  width: 100%;
  max-height: 360px;
  border-radius: 8px;
  background: #000;
}
.settings-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.setting-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.setting-group label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
}
.setting-group input[type="range"] {
  width: 100%;
  accent-color: var(--primary);
}
.setting-group .value-display {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary);
}
.setting-group select {
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  background: var(--card);
  color: var(--text);
  cursor: pointer;
}
.setting-group select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(59,130,246,.15);
}
.time-range {
  display: flex;
  align-items: center;
  gap: 8px;
}
.time-range input[type="number"] {
  width: 70px;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  text-align: center;
}
.time-range input[type="number"]:focus {
  outline: none;
  border-color: var(--primary);
}
.time-range span {
  font-size: 13px;
  color: var(--text-secondary);
}
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 24px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all .2s;
  width: 100%;
}
.btn-primary {
  background: var(--primary);
  color: #fff;
}
.btn-primary:hover { background: var(--primary-dark); }
.btn-primary:disabled {
  background: #93c5fd;
  cursor: not-allowed;
}
.btn-secondary {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--border); }
.progress-area {
  display: none;
  margin-top: 16px;
}
.progress-bar-bg {
  width: 100%;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  background: var(--primary);
  border-radius: 3px;
  transition: width .3s;
  width: 0%;
}
.progress-text {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 8px;
  text-align: center;
}
.result-area {
  display: none;
  margin-top: 16px;
}
.result-area img {
  width: 100%;
  max-height: 400px;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.result-info {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 12px;
  padding: 12px;
  background: var(--bg);
  border-radius: 8px;
  font-size: 13px;
  color: var(--text-secondary);
}
.result-info .size {
  font-weight: 600;
  color: var(--text);
}
.action-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 12px;
}
.alert {
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 12px;
  display: none;
}
.alert-error {
  background: #fef2f2;
  color: #dc2626;
  border: 1px solid #fecaca;
  display: block;
}
.alert-info {
  background: var(--primary-light);
  color: var(--primary-dark);
  border: 1px solid #bfdbfe;
  display: block;
}
footer {
  text-align: center;
  padding: 20px;
  font-size: 12px;
  color: var(--text-secondary);
  border-top: 1px solid var(--border);
  margin-top: auto;
}
@media (max-width: 600px) {
  .settings-grid { grid-template-columns: 1fr; }
  .action-buttons { grid-template-columns: 1fr; }
  .container { padding: 16px 12px 40px; }
  .card { padding: 16px; }
}
</style>
</head>
<body>

<header>
  <a href="/">← 返回首页</a>
  <h1>视频转 GIF</h1>
</header>

<div class="container">

  <div class="card">
    <div class="card-title">选择视频</div>
    <div class="drop-zone" id="dropZone">
      <div class="drop-zone-icon">🎬</div>
      <div class="drop-zone-text">
        拖拽视频文件到这里，或 <strong>点击选择文件</strong>
      </div>
      <div class="drop-zone-hint">支持 MP4、WebM、MOV、AVI 等常见格式</div>
      <input type="file" id="fileInput" accept="video/*">
    </div>
    <div class="video-preview" id="videoPreview">
      <video id="videoEl" controls></video>
    </div>
  </div>

  <div class="card" id="settingsCard" style="display:none">
    <div class="card-title">转换设置</div>
    <div class="settings-grid">
      <div class="setting-group">
        <label>帧率 (FPS)</label>
        <div style="display:flex;align-items:center;gap:8px">
          <input type="range" id="fpsSlider" min="1" max="30" value="10" step="1">
          <span class="value-display" id="fpsDisplay">10</span>
        </div>
      </div>
      <div class="setting-group">
        <label>宽度 (px)</label>
        <div style="display:flex;align-items:center;gap:8px">
          <input type="range" id="widthSlider" min="100" max="1920" value="480" step="10">
          <span class="value-display" id="widthDisplay">480</span>
        </div>
      </div>
      <div class="setting-group">
        <label>起始时间</label>
        <div class="time-range">
          <input type="number" id="startMin" value="0" min="0"> <span>分</span>
          <input type="number" id="startSec" value="0" min="0" max="59"> <span>秒</span>
        </div>
      </div>
      <div class="setting-group">
        <label>持续时间</label>
        <div class="time-range">
          <input type="number" id="durationSec" value="3" min="1" max="60"> <span>秒</span>
        </div>
      </div>
      <div class="setting-group" style="grid-column:1/-1">
        <label>缩放模式</label>
        <select id="fitMode">
          <option value="contain">保持比例（填充黑边）</option>
          <option value="cover">裁剪填充</option>
          <option value="fill">拉伸填充</option>
        </select>
      </div>
    </div>

    <div class="alert" id="alert"></div>

    <div class="progress-area" id="progressArea">
      <div class="progress-bar-bg">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="progress-text" id="progressText">处理中...</div>
    </div>

    <div class="result-area" id="resultArea">
      <img id="resultImg" alt="转换结果">
      <div class="result-info">
        <span>GIF 大小：<span class="size" id="gifSize">--</span></span>
        <span>帧数：<span id="frameCount">--</span></span>
      </div>
      <div class="action-buttons">
        <button class="btn btn-primary" id="downloadBtn">⬇ 下载 GIF</button>
        <button class="btn btn-secondary" id="resetBtn">🔄 重新选择</button>
      </div>
    </div>

    <button class="btn btn-primary" id="convertBtn" style="margin-top:16px" disabled>
      ⚡ 开始转换
    </button>
  </div>

</div>

<footer>
  纯浏览器端处理，视频不上传服务器 · 小飞 AI 工具
</footer>

<script>
// ===== GIF Encoder (Web Worker) =====
// GIF encoding runs in a Web Worker to avoid blocking the main thread

// Create worker from blob URL
const workerCode = `
// Octree color quantization
function buildOctreePalette(allPixels, maxColors) {
  const root = { children: null, count: 0, isLeaf: false, r: 0, g: 0, b: 0 };
  
  const addColor = (node, r, g, b, depth) => {
    if (depth === 8) {
      node.isLeaf = true;
      node.count++;
      node.r += r; node.g += g; node.b += b;
      return;
    }
    if (!node.children) node.children = new Array(8).fill(null);
    const idx = ((r >> (7-depth)) & 1) << 2 | ((g >> (7-depth)) & 1) << 1 | ((b >> (7-depth)) & 1);
    if (!node.children[idx]) {
      node.children[idx] = { children: null, count: 0, isLeaf: false, r: 0, g: 0, b: 0 };
    }
    addColor(node.children[idx], r, g, b, depth + 1);
  };

  for (const p of allPixels) addColor(root, p[0], p[1], p[2], 0);

  const leaves = [];
  const collectLeaves = (node) => {
    if (node.isLeaf) { leaves.push(node); return; }
    if (node.children) for (const child of node.children) if (child) collectLeaves(child);
  };
  collectLeaves(root);

  while (leaves.length > maxColors) {
    let minIdx = 0;
    for (let i = 1; i < leaves.length; i++) if (leaves[i].count < leaves[minIdx].count) minIdx = i;
    leaves.splice(minIdx, 1);
  }

  return leaves.map(l => [Math.round(l.r / l.count), Math.round(l.g / l.count), Math.round(l.b / l.count)]);
}

function findClosest(color, palette) {
  let minDist = Infinity, idx = 0;
  for (let i = 0; i < palette.length; i++) {
    const dr = color[0] - palette[i][0], dg = color[1] - palette[i][1], db = color[2] - palette[i][2];
    const dist = dr*dr + dg*dg + db*db;
    if (dist < minDist) { minDist = dist; idx = i; }
  }
  return idx;
}

function ditherFrame(data, w, h, palette) {
  const pixels = new Uint8Array(data);
  const indices = new Uint16Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const idx = (y * w + x) * 4;
      const oldR = pixels[idx], oldG = pixels[idx+1], oldB = pixels[idx+2];
      const ci = findClosest([oldR, oldG, oldB], palette);
      indices[y * w + x] = ci;
      const newR = palette[ci][0], newG = palette[ci][1], newB = palette[ci][2];
      const errR = oldR - newR, errG = oldG - newG, errB = oldB - newB;
      const dist = (px, py, f) => {
        if (px < 0 || px >= w || py < 0 || py >= h) return;
        const pi = (py * w + px) * 4;
        pixels[pi] = Math.max(0, Math.min(255, pixels[pi] + errR * f));
        pixels[pi+1] = Math.max(0, Math.min(255, pixels[pi+1] + errG * f));
        pixels[pi+2] = Math.max(0, Math.min(255, pixels[pi+2] + errB * f));
      };
      dist(x+1, y, 7/16); dist(x-1, y+1, 3/16); dist(x, y+1, 5/16); dist(x+1, y+1, 1/16);
    }
  }
  return indices;
}

function lzwEncode(indices, minCodeSize) {
  const clearCode = 1 << minCodeSize;
  const eoiCode = clearCode + 1;
  let codeSize = minCodeSize + 1;
  let nextCode = eoiCode + 1;
  
  // Use string keys for dictionary to avoid number overflow issues
  const dict = new Map();
  for (let i = 0; i < clearCode; i++) dict.set(String.fromCharCode(i), i);
  
  const output = [];
  let bitBuffer = 0, bitCount = 0;
  
  const writeCode = (code) => {
    bitBuffer |= (code << bitCount);
    bitCount += codeSize;
    while (bitCount >= 8) {
      output.push(bitBuffer & 0xFF);
      bitBuffer >>= 8;
      bitCount -= 8;
    }
  };
  
  writeCode(clearCode);
  
  // Build string of character codes
  let current = String.fromCharCode(indices[0]);
  
  for (let i = 1; i < indices.length; i++) {
    const nextChar = String.fromCharCode(indices[i]);
    const combined = current + nextChar;
    
    if (dict.has(combined)) {
      current = combined;
    } else {
      writeCode(dict.get(current));
      if (nextCode < 4096) {
        dict.set(combined, nextCode++);
        if (nextCode > (1 << codeSize) && codeSize < 12) codeSize++;
      }
      current = nextChar;
    }
  }
  
  writeCode(dict.get(current));
  writeCode(eoiCode);
  
  if (bitCount > 0) output.push(bitBuffer & 0xFF);
  return output;
}

function buildGIF(frames, width, height, delay, repeat) {
  // Collect sampled pixels for global palette (sample every 4th pixel for speed)
  const allPixels = [];
  const sampleStep = 4;
  for (const f of frames) {
    for (let i = 0; i < f.length; i += 4 * sampleStep) {
      allPixels.push([f[i], f[i+1], f[i+2]]);
    }
  }
  
  const palette = buildOctreePalette(allPixels, 256);
  const colorBits = Math.max(2, Math.ceil(Math.log2(palette.length)));
  
  const stream = [];
  const w = (b) => stream.push(b & 0xFF);
  
  // Header
  w(0x47); w(0x49); w(0x46); w(0x38); w(0x39); w(0x61);
  // Logical screen
  w(width & 0xFF); w((width >> 8) & 0xFF);
  w(height & 0xFF); w((height >> 8) & 0xFF);
  w(0x80 | ((colorBits - 1) << 4) | (colorBits - 1));
  w(0); w(0);
  // Global color table
  for (let i = 0; i < 256; i++) {
    if (i < palette.length) { w(palette[i][0]); w(palette[i][1]); w(palette[i][2]); }
    else { w(0); w(0); w(0); }
  }
  // Loop extension
  if (repeat >= 0) {
    w(0x21); w(0xFF); w(0x0B);
    w(0x4E); w(0x45); w(0x54); w(0x53); w(0x43); w(0x41); w(0x50); w(0x45); w(0x32); w(0x2E); w(0x30);
    w(0x03); w(0x01); w(repeat & 0xFF); w((repeat >> 8) & 0xFF); w(0x00);
  }
  
  // Frames
  for (let fi = 0; fi < frames.length; fi++) {
    const indices = ditherFrame(frames[fi], width, height, palette);
    // GCE
    w(0x21); w(0xF9); w(0x04); w(0x00);
    w(delay & 0xFF); w((delay >> 8) & 0xFF);
    w(0x00); w(0x00);
    // Image descriptor
    w(0x2C); w(0); w(0); w(0); w(0);
    w(width & 0xFF); w((width >> 8) & 0xFF);
    w(height & 0xFF); w((height >> 8) & 0xFF);
    w(colorBits - 1);
    w(colorBits);
    // LZW data
    const lzwData = lzwEncode(Array.from(indices), colorBits);
    for (let i = 0; i < lzwData.length; i += 255) {
      const chunk = lzwData.slice(i, i + 255);
      w(chunk.length);
      for (let j = 0; j < chunk.length; j++) w(chunk[j]);
    }
    w(0x00);
    
    // Report progress back to main thread
    self.postMessage({ type: 'frame', done: fi + 1, total: frames.length });
  }
  
  w(0x3B);
  return new Uint8Array(stream);
}

self.onmessage = function(e) {
  const { frames, width, height, delay, repeat } = e.data;
  try {
    const gifData = buildGIF(frames, width, height, delay, repeat);
    self.postMessage({ type: 'done', data: gifData.buffer }, [gifData.buffer]);
  } catch(err) {
    self.postMessage({ type: 'error', message: err.message });
  }
};
`;

const workerBlob = new Blob([workerCode], { type: 'application/javascript' });
const workerUrl = URL.createObjectURL(workerBlob);

// ===== Main App =====
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const videoPreview = document.getElementById('videoPreview');
const videoEl = document.getElementById('videoEl');
const settingsCard = document.getElementById('settingsCard');
const convertBtn = document.getElementById('convertBtn');
const fpsSlider = document.getElementById('fpsSlider');
const fpsDisplay = document.getElementById('fpsDisplay');
const widthSlider = document.getElementById('widthSlider');
const widthDisplay = document.getElementById('widthDisplay');
const startMin = document.getElementById('startMin');
const startSec = document.getElementById('startSec');
const durationSec = document.getElementById('durationSec');
const fitMode = document.getElementById('fitMode');
const progressArea = document.getElementById('progressArea');
const progressBar = document.getElementById('progressBar');
const progressText = document.getElementById('progressText');
const resultArea = document.getElementById('resultArea');
const resultImg = document.getElementById('resultImg');
const gifSize = document.getElementById('gifSize');
const frameCount = document.getElementById('frameCount');
const downloadBtn = document.getElementById('downloadBtn');
const resetBtn = document.getElementById('resetBtn');
const alert = document.getElementById('alert');

let currentFile = null;
let videoLoaded = false;

// Drop zone handlers
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => {
  e.preventDefault();
  dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => {
  dropZone.classList.remove('dragover');
});
dropZone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('video/')) {
    loadVideo(file);
  } else {
    showAlert('请选择视频文件', 'error');
  }
});
fileInput.addEventListener('change', (e) => {
  if (e.target.files[0]) loadVideo(e.target.files[0]);
});

// Settings
fpsSlider.addEventListener('input', () => {
  fpsDisplay.textContent = fpsSlider.value;
});
widthSlider.addEventListener('input', () => {
  widthDisplay.textContent = widthSlider.value;
});

function loadVideo(file) {
  currentFile = file;
  const url = URL.createObjectURL(file);
  videoEl.src = url;
  videoPreview.style.display = 'block';
  videoEl.onloadedmetadata = () => {
    videoLoaded = true;
    settingsCard.style.display = 'block';
    convertBtn.disabled = false;
    // Auto-set max duration
    durationSec.max = Math.floor(videoEl.duration);
    if (parseInt(durationSec.value) > videoEl.duration) {
      durationSec.value = Math.min(3, Math.floor(videoEl.duration));
    }
    // Auto-set width based on video
    const suggestedWidth = Math.min(480, videoEl.videoWidth);
    widthSlider.value = suggestedWidth;
    widthDisplay.textContent = suggestedWidth;
    hideAlert();
    resultArea.style.display = 'none';
    progressArea.style.display = 'none';
  };
}

function showAlert(msg, type = 'error') {
  alert.textContent = msg;
  alert.className = `alert alert-${type}`;
  alert.style.display = 'block';
}

function hideAlert() {
  alert.style.display = 'none';
}

// ===== Async frame capture + Web Worker encoding =====

// Helper: seek video and wait
function seekVideo(time) {
  return new Promise((resolve) => {
    videoEl.currentTime = time;
    const onSeeked = () => { videoEl.removeEventListener('seeked', onSeeked); resolve(); };
    videoEl.addEventListener('seeked', onSeeked);
    setTimeout(resolve, 200); // fallback
  });
}

// Capture frames in chunks to keep UI responsive
async function captureFrames(video, startTime, fps, duration, targetWidth, targetHeight, drawX, drawY, drawW, drawH, onProgress) {
  const totalFrames = Math.floor(fps * duration);
  const frameInterval = 1 / fps;
  const frames = [];
  
  const canvas = document.createElement('canvas');
  canvas.width = targetWidth;
  canvas.height = targetHeight;
  const ctx = canvas.getContext('2d');

  // Process in chunks of 5 frames, yield to UI between chunks
  const CHUNK = 5;
  for (let start = 0; start < totalFrames; start += CHUNK) {
    const end = Math.min(start + CHUNK, totalFrames);
    
    for (let i = start; i < end; i++) {
      const time = startTime + i * frameInterval;
      await seekVideo(time);
      
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, targetWidth, targetHeight);
      ctx.drawImage(video, drawX, drawY, drawW, drawH);
      
      // Copy raw RGBA data
      const imageData = ctx.getImageData(0, 0, targetWidth, targetHeight);
      frames.push(new Uint8Array(imageData.data));
    }
    
    // Yield to UI thread
    await new Promise(r => setTimeout(r, 0));
    if (onProgress) onProgress(Math.round(end / totalFrames * 50), end, totalFrames);
  }
  
  return frames;
}

// Convert
convertBtn.addEventListener('click', async () => {
  if (!videoLoaded || !currentFile) return;

  convertBtn.disabled = true;
  progressArea.style.display = 'block';
  resultArea.style.display = 'none';
  progressBar.style.width = '0%';
  hideAlert();

  const fps = parseInt(fpsSlider.value);
  const targetWidth = parseInt(widthSlider.value);
  const startTime = parseInt(startMin.value) * 60 + parseInt(startSec.value);
  const duration = parseInt(durationSec.value);
  const mode = fitMode.value;

  try {
    // Seek to start
    await seekVideo(startTime);

    const vw = videoEl.videoWidth;
    const vh = videoEl.videoHeight;
    const aspect = vw / vh;
    const targetHeight = Math.round(targetWidth / aspect);

    let drawX = 0, drawY = 0, drawW = targetWidth, drawH = targetHeight;

    if (mode === 'cover') {
      const coverAspect = targetWidth / targetHeight;
      if (aspect > coverAspect) {
        drawW = targetWidth;
        drawH = Math.round(targetWidth / aspect);
        drawY = Math.round((targetHeight - drawH) / 2);
      } else {
        drawH = targetHeight;
        drawW = Math.round(targetHeight * aspect);
        drawX = Math.round((targetWidth - drawW) / 2);
      }
    } else if (mode !== 'fill') {
      // contain
      if (aspect > targetWidth / targetHeight) {
        drawW = targetWidth;
        drawH = Math.round(targetWidth / aspect);
        drawY = Math.round((targetHeight - drawH) / 2);
      } else {
        drawH = targetHeight;
        drawW = Math.round(targetHeight * aspect);
        drawX = Math.round((targetWidth - drawW) / 2);
      }
    }

    progressText.textContent = '正在采集视频帧... 0%';

    // Step 1: Capture frames (async, yields to UI)
    const frames = await captureFrames(
      videoEl, startTime, fps, duration,
      targetWidth, targetHeight,
      drawX, drawY, drawW, drawH,
      (pct, done, total) => {
        progressBar.style.width = pct + '%';
        progressText.textContent = `正在采集视频帧... ${done}/${total} 帧`;
      }
    );

    progressText.textContent = '正在编码 GIF（后台处理，请稍候）...';
    progressBar.style.width = '50%';

    // Step 2: Encode in Web Worker
    const gifData = await new Promise((resolve, reject) => {
      const worker = new Worker(workerUrl);
      
      worker.onmessage = (e) => {
        if (e.data.type === 'frame') {
          const pct = 50 + Math.round((e.data.done / e.data.total) * 50);
          progressBar.style.width = pct + '%';
          progressText.textContent = `正在编码 GIF... ${e.data.done}/${e.data.total} 帧`;
        } else if (e.data.type === 'done') {
          resolve(new Uint8Array(e.data.data));
          worker.terminate();
        } else if (e.data.type === 'error') {
          reject(new Error(e.data.message));
          worker.terminate();
        }
      };
      
      worker.onerror = (err) => {
        reject(new Error('Worker error: ' + err.message));
        worker.terminate();
      };
      
      // Transfer frame buffers to worker (zero-copy)
      const transferables = frames.map(f => f.buffer);
      worker.postMessage({
        frames: frames,
        width: targetWidth,
        height: targetHeight,
        delay: Math.round(1000 / fps),
        repeat: 0
      }, transferables);
    });

    progressBar.style.width = '100%';
    progressText.textContent = 'GIF 生成完成！';

    const blob = new Blob([gifData], { type: 'image/gif' });
    const url = URL.createObjectURL(blob);

    resultImg.src = url;
    resultArea.style.display = 'block';
    gifSize.textContent = formatSize(blob.size);
    frameCount.textContent = frames.length;

    progressArea.style.display = 'none';

    downloadBtn.onclick = () => {
      const a = document.createElement('a');
      a.href = url;
      const baseName = currentFile.name.replace(/\.[^.]+$/, '');
      a.download = `${baseName}.gif`;
      a.click();
    };

  } catch (err) {
    showAlert('转换失败：' + err.message, 'error');
    progressArea.style.display = 'none';
  } finally {
    convertBtn.disabled = false;
  }
});

// Reset
resetBtn.addEventListener('click', () => {
  currentFile = null;
  videoLoaded = false;
  videoEl.src = '';
  videoPreview.style.display = 'none';
  settingsCard.style.display = 'none';
  resultArea.style.display = 'none';
  progressArea.style.display = 'none';
  convertBtn.disabled = true;
  hideAlert();
  fileInput.value = '';
});

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}
</script>
</body>
