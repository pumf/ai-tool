<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>秒表与倒计时 - 小飞 AI 工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0abFA5;
      --color-on-primary: #ffffff;
      --color-primary-hover: #08d9a3;
      --color-primary-soft: rgba(10, 191, 165, 0.08);
      --color-ink: #1a1a2e;
      --color-body: #5c5c72;
      --color-muted: #9494a8;
      --color-canvas: #ffffff;
      --color-canvas-soft: #f8f9fb;
      --color-border: rgba(0, 0, 0, 0.07);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --font-sans: 'Inter', sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--color-canvas-soft);
      color: var(--color-ink);
      min-height: 100vh;
    }
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-border);
      height: 56px; display: flex; align-items: center;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      width: 100%;
    }
    .nav-logo {
      font-size: 16px; font-weight: 600; color: var(--color-ink);
      text-decoration: none;
    }
    .nav-logo span { color: var(--color-primary); }
    .nav-back {
      font-size: 14px; color: var(--color-body); text-decoration: none;
    }
    .nav-back:hover { color: var(--color-primary); }
    .container {
      max-width: 800px; margin: 0 auto; padding: 24px;
    }
    .header {
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 24px; font-weight: 600; margin-bottom: 6px;
    }
    .header p {
      font-size: 14px; color: var(--color-body);
    }
    .tabs {
      display: flex; gap: 8px; margin-bottom: 20px;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 12px;
    }
    .tab {
      padding: 10px 20px;
      border: none;
      background: none;
      font-size: 14px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      color: var(--color-body);
      transition: all 0.2s;
      font-family: var(--font-sans);
    }
    .tab:hover { color: var(--color-primary); }
    .tab.active {
      background: var(--color-primary-soft);
      color: var(--color-primary);
      font-weight: 500;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .panel {
      background: var(--color-canvas);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 32px 24px;
      text-align: center;
    }
    .timer-display {
      font-family: var(--font-mono);
      font-size: 64px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 32px;
      color: var(--color-ink);
    }
    .timer-ms {
      font-size: 32px;
      color: var(--color-muted);
    }
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-sans);
    }
    .btn-primary {
      background: var(--color-primary);
      color: var(--color-on-primary);
    }
    .btn-primary:hover {
      background: var(--color-primary-hover);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: var(--color-canvas-soft);
      color: var(--color-ink);
      border: 1px solid var(--color-border);
    }
    .btn-secondary:hover {
      background: var(--color-border);
    }
    .btn-danger {
      background: #ef4444;
      color: white;
    }
    .btn-danger:hover {
      background: #dc2626;
    }
    .laps-container {
      margin-top: 24px;
      max-height: 300px;
      overflow-y: auto;
      text-align: left;
    }
    .lap-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--color-border);
      font-family: var(--font-mono);
    }
    .lap-number {
      font-weight: 600;
      color: var(--color-primary);
    }
    .lap-time {
      color: var(--color-body);
    }
    .countdown-inputs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-label {
      font-size: 12px;
      color: var(--color-muted);
      font-weight: 500;
    }
    .input-field {
      padding: 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: 24px;
      font-family: var(--font-mono);
      text-align: center;
      transition: border-color 0.2s;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--color-primary);
    }
    .preset-btns {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .preset-btn {
      padding: 8px 16px;
      border: 1px solid var(--color-border);
      background: var(--color-canvas);
      border-radius: var(--radius-sm);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-sans);
    }
    .preset-btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--color-border);
      border-radius: 3px;
      margin-bottom: 24px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--color-primary);
      transition: width 0.1s;
    }
    @media (max-width: 600px) {
      .timer-display {
        font-size: 48px;
      }
      .timer-ms {
        font-size: 24px;
      }
      .countdown-inputs {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">小飞 <span>AI</span> 工具</a>
      <a href="/" class="nav-back">← 返回首页</a>
    </div>
  </nav>

  <div class="container">
    <div class="header">
      <h1>秒表与倒计时</h1>
      <p>精准计时工具，支持分段记录</p>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('stopwatch')">秒表</button>
      <button class="tab" onclick="switchTab('countdown')">倒计时</button>
    </div>

    <!-- 秒表 -->
    <div class="tab-content active" id="stopwatchTab">
      <div class="panel">
        <div class="timer-display">
          <span id="swTime">00:00:00</span><span class="timer-ms" id="swMs">.00</span>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="swStartBtn" onclick="toggleStopwatch()">开始</button>
          <button class="btn btn-secondary" onclick="recordLap()">记录</button>
          <button class="btn btn-danger" onclick="resetStopwatch()">重置</button>
        </div>
        <div class="laps-container" id="lapsContainer"></div>
      </div>
    </div>

    <!-- 倒计时 -->
    <div class="tab-content" id="countdownTab">
      <div class="panel">
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="timer-display">
          <span id="cdTime">00:00:00</span>
        </div>
        <div class="countdown-inputs" id="cdInputs">
          <div class="input-group">
            <label class="input-label">小时</label>
            <input type="number" class="input-field" id="cdHours" value="0" min="0" max="99">
          </div>
          <div class="input-group">
            <label class="input-label">分钟</label>
            <input type="number" class="input-field" id="cdMinutes" value="5" min="0" max="59">
          </div>
          <div class="input-group">
            <label class="input-label">秒</label>
            <input type="number" class="input-field" id="cdSeconds" value="0" min="0" max="59">
          </div>
        </div>
        <div class="preset-btns">
          <button class="preset-btn" onclick="setCountdown(0, 1, 0)">1分钟</button>
          <button class="preset-btn" onclick="setCountdown(0, 5, 0)">5分钟</button>
          <button class="preset-btn" onclick="setCountdown(0, 10, 0)">10分钟</button>
          <button class="preset-btn" onclick="setCountdown(0, 25, 0)">25分钟</button>
          <button class="preset-btn" onclick="setCountdown(1, 0, 0)">1小时</button>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="cdStartBtn" onclick="toggleCountdown()">开始</button>
          <button class="btn btn-danger" onclick="resetCountdown()">重置</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 秒表逻辑
    let swInterval = null;
    let swTime = 0;
    let swRunning = false;
    let laps = [];

    function toggleStopwatch() {
      const btn = document.getElementById('swStartBtn');
      if (swRunning) {
        clearInterval(swInterval);
        btn.textContent = '继续';
        swRunning = false;
      } else {
        swInterval = setInterval(() => {
          swTime += 10;
          updateStopwatchDisplay();
        }, 10);
        btn.textContent = '暂停';
        swRunning = true;
      }
    }

    function updateStopwatchDisplay() {
      const hours = Math.floor(swTime / 3600000);
      const minutes = Math.floor((swTime % 3600000) / 60000);
      const seconds = Math.floor((swTime % 60000) / 1000);
      const ms = Math.floor((swTime % 1000) / 10);
      
      document.getElementById('swTime').textContent = 
        `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      document.getElementById('swMs').textContent = `.${String(ms).padStart(2, '0')}`;
    }

    function recordLap() {
      if (!swRunning) return;
      
      laps.unshift({ number: laps.length + 1, time: swTime });
      
      const hours = Math.floor(swTime / 3600000);
      const minutes = Math.floor((swTime % 3600000) / 60000);
      const seconds = Math.floor((swTime % 60000) / 1000);
      const ms = Math.floor((swTime % 1000) / 10);
      
      const lapEl = document.createElement('div');
      lapEl.className = 'lap-item';
      lapEl.innerHTML = `
        <span class="lap-number">第 ${laps.length} 圈</span>
        <span class="lap-time">${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(ms).padStart(2, '0')}</span>
      `;
      
      document.getElementById('lapsContainer').prepend(lapEl);
    }

    function resetStopwatch() {
      clearInterval(swInterval);
      swTime = 0;
      swRunning = false;
      laps = [];
      document.getElementById('swStartBtn').textContent = '开始';
      updateStopwatchDisplay();
      document.getElementById('lapsContainer').innerHTML = '';
    }

    // 倒计时逻辑
    let cdInterval = null;
    let cdTotalTime = 0;
    let cdRemainingTime = 0;
    let cdRunning = false;

    function setCountdown(hours, minutes, seconds) {
      document.getElementById('cdHours').value = hours;
      document.getElementById('cdMinutes').value = minutes;
      document.getElementById('cdSeconds').value = seconds;
    }

    function toggleCountdown() {
      const btn = document.getElementById('cdStartBtn');
      
      if (cdRunning) {
        clearInterval(cdInterval);
        btn.textContent = '继续';
        cdRunning = false;
      } else {
        if (cdRemainingTime === 0) {
          const h = parseInt(document.getElementById('cdHours').value) || 0;
          const m = parseInt(document.getElementById('cdMinutes').value) || 0;
          const s = parseInt(document.getElementById('cdSeconds').value) || 0;
          cdTotalTime = (h * 3600 + m * 60 + s) * 1000;
          cdRemainingTime = cdTotalTime;
          
          if (cdTotalTime === 0) {
            alert('请设置倒计时时间');
            return;
          }
          
          document.getElementById('cdInputs').style.display = 'none';
        }
        
        cdInterval = setInterval(() => {
          cdRemainingTime -= 100;
          updateCountdownDisplay();
          
          if (cdRemainingTime <= 0) {
            clearInterval(cdInterval);
            cdRunning = false;
            btn.textContent = '开始';
            document.getElementById('cdInputs').style.display = 'grid';
            
            // 播放提示音
            const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2teleU84i9WYXj8oJ4vRlFI7Koa+xZRRPi8mhMnLlFhAQCaFycyYX0JAJ4XJzZhnREAnhcnNmGdEQCeFyc2YZ0RAJ4XJzZhnREAnhcnNmGdEQCeFyc2YZ0RAJ4XJzZhnREAnhcnNmGdEQA==');
            audio.play();
            
            alert('倒计时结束！');
            resetCountdown();
          }
        }, 100);
        
        btn.textContent = '暂停';
        cdRunning = true;
      }
    }

    function updateCountdownDisplay() {
      const hours = Math.floor(cdRemainingTime / 3600000);
      const minutes = Math.floor((cdRemainingTime % 3600000) / 60000);
      const seconds = Math.floor((cdRemainingTime % 60000) / 1000);
      
      document.getElementById('cdTime').textContent = 
        `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      const progress = (1 - cdRemainingTime / cdTotalTime) * 100;
      document.getElementById('progressFill').style.width = `${progress}%`;
    }

    function resetCountdown() {
      clearInterval(cdInterval);
      cdTotalTime = 0;
      cdRemainingTime = 0;
      cdRunning = false;
      document.getElementById('cdStartBtn').textContent = '开始';
      document.getElementById('cdInputs').style.display = 'grid';
      document.getElementById('cdTime').textContent = '00:00:00';
      document.getElementById('progressFill').style.width = '0%';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if (tab === 'stopwatch') {
        document.querySelector('.tab:first-child').classList.add('active');
        document.getElementById('stopwatchTab').classList.add('active');
      } else {
        document.querySelector('.tab:last-child').classList.add('active');
        document.getElementById('countdownTab').classList.add('active');
      }
    }
  </script>
</body>
</html>
