<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单位换算器 - 小飞 AI 工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0abFA5;
      --color-on-primary: #ffffff;
      --color-primary-hover: #08d9a3;
      --color-primary-soft: rgba(10, 191, 165, 0.08);
      --color-ink: #1a1a2e;
      --color-body: #5c5c72;
      --color-muted: #9494a8;
      --color-canvas: #ffffff;
      --color-canvas-soft: #f8f9fb;
      --color-border: rgba(0, 0, 0, 0.07);
      --radius-sm: 6px;
      --radius-md: 12px;
      --space-md: 16px;
      --space-lg: 24px;
      --font-sans: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--color-canvas-soft);
      color: var(--color-ink);
      min-height: 100vh;
    }
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-border);
      height: 56px; display: flex; align-items: center;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      width: 100%;
    }
    .nav-logo {
      font-size: 16px; font-weight: 600; color: var(--color-ink);
      text-decoration: none;
    }
    .nav-logo span { color: var(--color-primary); }
    .nav-back {
      font-size: 14px; color: var(--color-body); text-decoration: none;
    }
    .nav-back:hover { color: var(--color-primary); }
    .container {
      max-width: 800px; margin: 0 auto; padding: 24px;
    }
    .header {
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 24px; font-weight: 600; margin-bottom: 6px;
    }
    .header p {
      font-size: 14px; color: var(--color-body);
    }
    .category-tabs {
      display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .category-tab {
      padding: 8px 16px;
      border: 1px solid var(--color-border);
      background: var(--color-canvas);
      border-radius: var(--radius-sm);
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .category-tab:hover {
      border-color: var(--color-primary);
    }
    .category-tab.active {
      background: var(--color-primary);
      color: var(--color-on-primary);
      border-color: var(--color-primary);
    }
    .panel {
      background: var(--color-canvas);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 24px;
    }
    .converter-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: end;
      margin-bottom: 16px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .input-label {
      font-size: 12px;
      color: var(--color-muted);
      font-weight: 500;
    }
    .input-field {
      padding: 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-family: var(--font-sans);
      transition: border-color 0.2s;
    }
    .input-field:focus {
      outline: none;
      border-color: var(--color-primary);
    }
    .unit-select {
      padding: 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: var(--font-sans);
      background: var(--color-canvas);
      cursor: pointer;
    }
    .swap-btn {
      width: 40px;
      height: 40px;
      border: 1px solid var(--color-border);
      background: var(--color-canvas);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      margin-bottom: 0;
    }
    .swap-btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .swap-btn svg {
      width: 20px;
      height: 20px;
    }
    .common-conversions {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--color-border);
    }
    .common-conversions h3 {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 12px;
      color: var(--color-body);
    }
    .conversion-list {
      display: grid;
      gap: 8px;
    }
    .conversion-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--color-canvas-soft);
      border-radius: var(--radius-sm);
      font-size: 14px;
    }
    .conversion-item span:first-child {
      color: var(--color-body);
    }
    .conversion-item span:last-child {
      font-weight: 500;
      color: var(--color-primary);
      font-family: monospace;
    }
    @media (max-width: 600px) {
      .converter-row {
        grid-template-columns: 1fr;
      }
      .swap-btn {
        width: 100%;
        margin: 8px 0;
      }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">小飞 <span>AI</span> 工具</a>
      <a href="/" class="nav-back">← 返回首页</a>
    </div>
  </nav>

  <div class="container">
    <div class="header">
      <h1>单位换算器</h1>
      <p>支持长度、重量、温度、面积、体积、时间等多种单位换算</p>
    </div>

    <div class="category-tabs" id="categoryTabs"></div>

    <div class="panel">
      <div class="converter-row">
        <div class="input-group">
          <label class="input-label">输入值</label>
          <input type="number" class="input-field" id="inputValue" placeholder="请输入数值" oninput="convert()">
          <select class="unit-select" id="fromUnit" onchange="convert()"></select>
        </div>
        
        <button class="swap-btn" onclick="swapUnits()" title="交换单位">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
          </svg>
        </button>

        <div class="input-group">
          <label class="input-label">输出值</label>
          <input type="text" class="input-field" id="outputValue" readonly>
          <select class="unit-select" id="toUnit" onchange="convert()"></select>
        </div>
      </div>

      <div class="common-conversions" id="commonConversions">
        <h3>常用换算</h3>
        <div class="conversion-list" id="conversionList"></div>
      </div>
    </div>
  </div>

  <script>
    const categories = {
      length: {
        name: '长度',
        units: {
          'mm': { name: '毫米', factor: 0.001 },
          'cm': { name: '厘米', factor: 0.01 },
          'm': { name: '米', factor: 1 },
          'km': { name: '千米', factor: 1000 },
          'in': { name: '英寸', factor: 0.0254 },
          'ft': { name: '英尺', factor: 0.3048 },
          'yd': { name: '码', factor: 0.9144 },
          'mi': { name: '英里', factor: 1609.344 }
        },
        common: [
          { from: 1, fromUnit: 'm', toUnit: 'ft' },
          { from: 1, fromUnit: 'km', toUnit: 'mi' },
          { from: 1, fromUnit: 'in', toUnit: 'cm' }
        ]
      },
      weight: {
        name: '重量',
        units: {
          'mg': { name: '毫克', factor: 0.000001 },
          'g': { name: '克', factor: 0.001 },
          'kg': { name: '千克', factor: 1 },
          't': { name: '吨', factor: 1000 },
          'oz': { name: '盎司', factor: 0.0283495 },
          'lb': { name: '磅', factor: 0.453592 }
        },
        common: [
          { from: 1, fromUnit: 'kg', toUnit: 'lb' },
          { from: 1, fromUnit: 'g', toUnit: 'oz' },
          { from: 1000, fromUnit: 'kg', toUnit: 't' }
        ]
      },
      temperature: {
        name: '温度',
        units: {
          'c': { name: '摄氏度', factor: 1 },
          'f': { name: '华氏度', factor: 1 },
          'k': { name: '开尔文', factor: 1 }
        },
        common: [
          { from: 0, fromUnit: 'c', toUnit: 'f' },
          { from: 100, fromUnit: 'c', toUnit: 'f' },
          { from: 37, fromUnit: 'c', toUnit: 'f' }
        ]
      },
      area: {
        name: '面积',
        units: {
          'mm2': { name: '平方毫米', factor: 0.000001 },
          'cm2': { name: '平方厘米', factor: 0.0001 },
          'm2': { name: '平方米', factor: 1 },
          'km2': { name: '平方千米', factor: 1000000 },
          'ha': { name: '公顷', factor: 10000 },
          'ac': { name: '英亩', factor: 4046.86 }
        },
        common: [
          { from: 1, fromUnit: 'm2', toUnit: 'cm2' },
          { from: 1, fromUnit: 'km2', toUnit: 'ha' },
          { from: 1, fromUnit: 'ac', toUnit: 'm2' }
        ]
      },
      volume: {
        name: '体积',
        units: {
          'ml': { name: '毫升', factor: 0.001 },
          'l': { name: '升', factor: 1 },
          'm3': { name: '立方米', factor: 1000 },
          'gal': { name: '加仑', factor: 3.78541 },
          'pt': { name: '品脱', factor: 0.473176 }
        },
        common: [
          { from: 1, fromUnit: 'l', toUnit: 'ml' },
          { from: 1, fromUnit: 'gal', toUnit: 'l' },
          { from: 1000, fromUnit: 'l', toUnit: 'm3' }
        ]
      },
      time: {
        name: '时间',
        units: {
          'ms': { name: '毫秒', factor: 0.001 },
          's': { name: '秒', factor: 1 },
          'min': { name: '分钟', factor: 60 },
          'h': { name: '小时', factor: 3600 },
          'd': { name: '天', factor: 86400 },
          'w': { name: '周', factor: 604800 }
        },
        common: [
          { from: 1, fromUnit: 'h', toUnit: 'min' },
          { from: 1, fromUnit: 'd', toUnit: 'h' },
          { from: 1, fromUnit: 'w', toUnit: 'd' }
        ]
      }
    };

    let currentCategory = 'length';

    function initCategories() {
      const tabs = document.getElementById('categoryTabs');
      tabs.innerHTML = Object.entries(categories).map(([key, cat]) => 
        `<div class="category-tab ${key === currentCategory ? 'active' : ''}" onclick="selectCategory('${key}')">${cat.name}</div>`
      ).join('');
    }

    function selectCategory(category) {
      currentCategory = category;
      document.querySelectorAll('.category-tab').forEach(tab => {
        tab.classList.toggle('active', tab.textContent === categories[category].name);
      });
      
      const units = categories[category].units;
      const options = Object.entries(units).map(([key, unit]) => 
        `<option value="${key}">${unit.name}</option>`
      ).join('');
      
      document.getElementById('fromUnit').innerHTML = options;
      document.getElementById('toUnit').innerHTML = options;
      
      document.getElementById('fromUnit').selectedIndex = 2;
      document.getElementById('toUnit').selectedIndex = 3;
      
      updateCommonConversions();
      convert();
    }

    function convert() {
      const inputValue = parseFloat(document.getElementById('inputValue').value) || 0;
      const fromUnit = document.getElementById('fromUnit').value;
      const toUnit = document.getElementById('toUnit').value;
      const cat = categories[currentCategory];

      let result;
      
      if (currentCategory === 'temperature') {
        result = convertTemperature(inputValue, fromUnit, toUnit);
      } else {
        const baseValue = inputValue * cat.units[fromUnit].factor;
        result = baseValue / cat.units[toUnit].factor;
      }

      const formatted = result < 0.01 || result > 999999 
        ? result.toExponential(4) 
        : result.toFixed(6).replace(/\.?0+$/, '');
      
      document.getElementById('outputValue').value = formatted;
    }

    function convertTemperature(value, from, to) {
      let celsius;
      if (from === 'c') celsius = value;
      else if (from === 'f') celsius = (value - 32) * 5/9;
      else celsius = value - 273.15;

      if (to === 'c') return celsius;
      if (to === 'f') return celsius * 9/5 + 32;
      return celsius + 273.15;
    }

    function swapUnits() {
      const fromSelect = document.getElementById('fromUnit');
      const toSelect = document.getElementById('toUnit');
      const temp = fromSelect.value;
      fromSelect.value = toSelect.value;
      toSelect.value = temp;
      
      const inputVal = document.getElementById('inputValue').value;
      const outputVal = document.getElementById('outputValue').value;
      document.getElementById('inputValue').value = outputVal;
      
      convert();
    }

    function updateCommonConversions() {
      const cat = categories[currentCategory];
      const list = document.getElementById('conversionList');
      
      list.innerHTML = cat.common.map(conv => {
        let result;
        if (currentCategory === 'temperature') {
          result = convertTemperature(conv.from, conv.fromUnit, conv.toUnit);
        } else {
          const baseValue = conv.from * cat.units[conv.fromUnit].factor;
          result = baseValue / cat.units[conv.toUnit].factor;
        }
        
        return `
          <div class="conversion-item">
            <span>${conv.from} ${cat.units[conv.fromUnit].name} = </span>
            <span>${result.toFixed(2).replace(/\.?0+$/, '')} ${cat.units[conv.toUnit].name}</span>
          </div>
        `;
      }).join('');
    }

    initCategories();
    selectCategory('length');
  </script>
</body>
</html>
