<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>滚动字幕生成器 - 小飞 AI 工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0abFA5;
      --color-on-primary: #ffffff;
      --color-primary-hover: #08d9a3;
      --color-primary-soft: rgba(10, 191, 165, 0.08);
      --color-ink: #1a1a2e;
      --color-body: #5c5c72;
      --color-muted: #9494a8;
      --color-canvas: #ffffff;
      --color-canvas-soft: #f8f9fb;
      --color-border: rgba(0, 0, 0, 0.07);
      --radius-sm: 6px;
      --radius-md: 12px;
      --font-sans: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--color-canvas-soft);
      color: var(--color-ink);
      min-height: 100vh;
    }
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-border);
      height: 56px; display: flex; align-items: center;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      width: 100%;
    }
    .nav-logo {
      font-size: 16px; font-weight: 600; color: var(--color-ink);
      text-decoration: none;
    }
    .nav-logo span { color: var(--color-primary); }
    .nav-back {
      font-size: 14px; color: var(--color-body); text-decoration: none;
    }
    .nav-back:hover { color: var(--color-primary); }
    .container {
      max-width: 1000px; margin: 0 auto; padding: 24px;
    }
    .header {
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 24px; font-weight: 600; margin-bottom: 6px;
    }
    .header p {
      font-size: 14px; color: var(--color-body);
    }
    .panel {
      background: var(--color-canvas);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 20px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--color-ink);
    }
    .input-field, .select-field {
      padding: 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: var(--font-sans);
      transition: border-color 0.2s;
    }
    .input-field:focus, .select-field:focus {
      outline: none;
      border-color: var(--color-primary);
    }
    textarea.input-field {
      resize: vertical;
      min-height: 100px;
    }
    .color-input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .color-input {
      width: 48px;
      height: 36px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      font-family: var(--font-sans);
    }
    .btn-primary {
      background: var(--color-primary);
      color: var(--color-on-primary);
    }
    .btn-primary:hover {
      background: var(--color-primary-hover);
    }
    .btn-group {
      display: flex;
      gap: 12px;
    }
    .preview-container {
      margin-top: 24px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--color-canvas-soft);
    }
    .preview-header {
      padding: 12px 16px;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-border);
      font-size: 14px;
      font-weight: 500;
    }
    .preview-area {
      padding: 40px 20px;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .marquee {
      white-space: nowrap;
      overflow: hidden;
    }
    .marquee-text {
      display: inline-block;
      animation: marquee var(--duration, 10s) linear infinite;
      font-weight: 600;
    }
    @keyframes marquee {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    .marquee-text.paused {
      animation-play-state: paused;
    }
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      justify-content: center;
    }
    .control-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--color-border);
      background: var(--color-canvas);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .control-btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .control-btn svg {
      width: 16px;
      height: 16px;
    }
    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">小飞 <span>AI</span> 工具</a>
      <a href="/" class="nav-back">← 返回首页</a>
    </div>
  </nav>

  <div class="container">
    <div class="header">
      <h1>滚动字幕生成器</h1>
      <p>自定义滚动文字效果，适用于演示与广告展示</p>
    </div>

    <div class="panel">
      <div class="form-group">
        <label class="form-label">字幕内容</label>
        <textarea class="input-field" id="text" placeholder="输入滚动字幕内容..." oninput="updatePreview()">欢迎使用滚动字幕生成器</textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">字体大小</label>
          <input type="number" class="input-field" id="fontSize" value="48" min="12" max="200" oninput="updatePreview()">
        </div>
        <div class="form-group">
          <label class="form-label">滚动速度（秒）</label>
          <input type="number" class="input-field" id="duration" value="10" min="1" max="60" oninput="updatePreview()">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">文字颜色</label>
          <div class="color-input-wrapper">
            <input type="color" class="color-input" id="textColor" value="#1a1a2e" onchange="updatePreview()">
            <input type="text" class="input-field" style="flex: 1" value="#1a1a2e" oninput="document.getElementById('textColor').value = this.value; updatePreview()">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">背景颜色</label>
          <div class="color-input-wrapper">
            <input type="color" class="color-input" id="bgColor" value="#f8f9fb" onchange="updatePreview()">
            <input type="text" class="input-field" style="flex: 1" value="#f8f9fb" oninput="document.getElementById('bgColor').value = this.value; updatePreview()">
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">滚动方向</label>
          <select class="select-field" id="direction" onchange="updatePreview()">
            <option value="left">向左滚动</option>
            <option value="right">向右滚动</option>
            <option value="alternate">来回滚动</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">字体样式</label>
          <select class="select-field" id="fontWeight" onchange="updatePreview()">
            <option value="400">常规</option>
            <option value="500">中等</option>
            <option value="600" selected>半粗</option>
            <option value="700">粗体</option>
          </select>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-primary" onclick="togglePlay()" id="playBtn">⏸ 暂停</button>
        <button class="btn btn-primary" onclick="fullScreen()">📺 全屏</button>
      </div>
    </div>

    <div class="preview-container">
      <div class="preview-header">预览效果</div>
      <div class="preview-area" id="previewArea">
        <div class="marquee" id="marquee">
          <div class="marquee-text" id="marqueeText">欢迎使用滚动字幕生成器</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let isPlaying = true;

    function updatePreview() {
      const text = document.getElementById('text').value || '请输入字幕内容';
      const fontSize = document.getElementById('fontSize').value;
      const duration = document.getElementById('duration').value;
      const textColor = document.getElementById('textColor').value;
      const bgColor = document.getElementById('bgColor').value;
      const direction = document.getElementById('direction').value;
      const fontWeight = document.getElementById('fontWeight').value;

      const marquee = document.getElementById('marquee');
      const marqueeText = document.getElementById('marqueeText');
      const previewArea = document.getElementById('previewArea');

      marqueeText.textContent = text;
      marqueeText.style.fontSize = `${fontSize}px`;
      marqueeText.style.color = textColor;
      marqueeText.style.fontWeight = fontWeight;
      marqueeText.style.setProperty('--duration', `${duration}s`);
      previewArea.style.background = bgColor;

      // 更新动画
      if (direction === 'left') {
        marqueeText.style.animation = `marquee ${duration}s linear infinite`;
      } else if (direction === 'right') {
        marqueeText.style.animation = `marquee ${duration}s linear infinite reverse`;
      } else {
        marqueeText.style.animation = `marquee ${duration}s linear infinite alternate`;
      }
    }

    function togglePlay() {
      const marqueeText = document.getElementById('marqueeText');
      const btn = document.getElementById('playBtn');
      
      if (isPlaying) {
        marqueeText.classList.add('paused');
        btn.textContent = '▶ 播放';
      } else {
        marqueeText.classList.remove('paused');
        btn.textContent = '⏸ 暂停';
      }
      
      isPlaying = !isPlaying;
    }

    function fullScreen() {
      const previewArea = document.getElementById('previewArea');
      
      if (previewArea.requestFullscreen) {
        previewArea.requestFullscreen();
      } else if (previewArea.webkitRequestFullscreen) {
        previewArea.webkitRequestFullscreen();
      } else if (previewArea.msRequestFullscreen) {
        previewArea.msRequestFullscreen();
      }
    }

    // 初始化预览
    updatePreview();
  </script>
</body>
</html>
