<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>番茄专注钟 - tool.pumf.top</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0abFA5;
      --color-on-primary: #ffffff;
      --color-primary-hover: #08d9a3;
      --color-primary-soft: rgba(10, 191, 165, 0.08);
      --color-work: #ef4444;
      --color-short: #0abFA5;
      --color-long: #3b82f6;
      --color-ink: #1a1a2e;
      --color-body: #5c5c72;
      --color-muted: #9494a8;
      --color-canvas: #ffffff;
      --color-canvas-soft: #f8f9fb;
      --color-border: rgba(0, 0, 0, 0.07);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --space-xs: 8px;
      --space-sm: 12px;
      --space-md: 16px;
      --space-lg: 24px;
      --font-sans: 'Inter', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--color-canvas-soft);
      color: var(--color-ink);
      min-height: 100vh;
    }
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-border);
      height: 56px; display: flex; align-items: center;
    }
    .nav-inner {
      max-width: 800px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      width: 100%;
    }
    .nav-logo { font-size: 16px; font-weight: 600; text-decoration: none; color: var(--color-ink); }
    .nav-logo span { color: var(--color-primary); }
    .nav-back { font-size: 14px; color: var(--color-body); text-decoration: none; }
    .nav-back:hover { color: var(--color-primary); }
    .container {
      max-width: 600px; margin: 0 auto; padding: 24px;
    }
    
    .timer-display {
      text-align: center; margin: 40px 0;
    }
    .timer-circle {
      width: 280px; height: 280px;
      margin: 0 auto;
      position: relative;
    }
    .timer-svg {
      transform: rotate(-90deg);
    }
    .timer-bg {
      fill: none; stroke: var(--color-canvas-soft-2, #e5e7eb);
      stroke-width: 8;
    }
    .timer-progress {
      fill: none; stroke: var(--color-primary);
      stroke-width: 8; stroke-linecap: round;
      transition: stroke-dashoffset 1s linear;
    }
    .timer-content {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }
    .timer-time {
      font-size: 64px; font-weight: 600;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
    }
    .timer-label {
      font-size: 14px; color: var(--color-muted);
      margin-top: 8px;
    }
    
    .mode-tabs {
      display: flex; gap: 8px; justify-content: center;
      margin-bottom: 24px;
    }
    .mode-tab {
      padding: 10px 20px; border: 1px solid var(--color-border);
      background: var(--color-canvas); border-radius: var(--radius-sm);
      font-size: 13px; cursor: pointer; color: var(--color-body);
      transition: all 0.2s;
    }
    .mode-tab:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .mode-tab.active {
      background: var(--color-primary); color: var(--color-on-primary);
      border-color: var(--color-primary);
    }
    .mode-tab.active.work { background: var(--color-work); border-color: var(--color-work); }
    .mode-tab.active.short { background: var(--color-short); border-color: var(--color-short); }
    .mode-tab.active.long { background: var(--color-long); border-color: var(--color-long); }
    
    .controls {
      display: flex; gap: 12px; justify-content: center;
      margin-bottom: 32px;
    }
    .btn {
      padding: 14px 32px;
      border: 1px solid var(--color-border);
      background: var(--color-canvas); border-radius: var(--radius-sm);
      font-size: 15px; font-weight: 500;
      cursor: pointer; color: var(--color-body);
      transition: all 0.2s;
    }
    .btn:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .btn-primary {
      background: var(--color-primary); color: var(--color-on-primary);
      border-color: var(--color-primary);
    }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn-large { padding: 16px 48px; font-size: 16px; }
    
    .panel {
      background: var(--color-canvas); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); padding: 20px;
      margin-bottom: 16px;
    }
    .panel-title {
      font-size: 14px; font-weight: 600; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    
    .task-input {
      width: 100%; padding: 14px 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm); font-size: 15px;
      margin-bottom: 12px;
    }
    .task-input:focus { outline: none; border-color: var(--color-primary); }
    
    .stats-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .stat-card {
      background: var(--color-canvas-soft);
      border-radius: var(--radius-sm); padding: 16px;
      text-align: center;
    }
    .stat-value {
      font-size: 28px; font-weight: 600; color: var(--color-ink);
    }
    .stat-label {
      font-size: 12px; color: var(--color-muted); margin-top: 4px;
    }
    
    .history-list {
      max-height: 200px; overflow-y: auto;
    }
    .history-item {
      display: flex; justify-content: space-between;
      align-items: center; padding: 12px 0;
      border-bottom: 1px solid var(--color-border);
    }
    .history-item:last-child { border-bottom: none; }
    .history-task { font-size: 14px; }
    .history-time { font-size: 12px; color: var(--color-muted); }
    .history-duration {
      font-size: 13px; color: var(--color-primary); font-weight: 500;
    }
    
    .empty-state {
      text-align: center; padding: 40px;
      color: var(--color-muted); font-size: 14px;
    }
    
    .settings-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid var(--color-border);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-label { font-size: 14px; color: var(--color-body); }
    .settings-control {
      display: flex; align-items: center; gap: 12px;
    }
    .settings-input {
      width: 60px; padding: 8px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm); text-align: center;
    }
    
    /* Toggle switch */
    .toggle {
      width: 44px; height: 24px;
      background: var(--color-border);
      border-radius: 12px; position: relative; cursor: pointer;
      transition: background 0.2s;
    }
    .toggle.active { background: var(--color-primary); }
    .toggle::after {
      content: ''; width: 20px; height: 20px;
      background: white; border-radius: 50%;
      position: absolute; top: 2px; left: 2px;
      transition: transform 0.2s;
    }
    .toggle.active::after { transform: translateX(20px); }
    
    .sound-test { font-size: 12px; color: var(--color-primary); cursor: pointer; }
    .sound-test:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">tool<span>.pumf.top</span></a>
      <a href="/" class="nav-back">← 返回首页</a>
    </div>
  </nav>
  
  <div class="container">
    <div class="mode-tabs">
      <button class="mode-tab active work" onclick="setMode('work')">专注 (25分钟)</button>
      <button class="mode-tab" onclick="setMode('short')">短休息 (5分钟)</button>
      <button class="mode-tab" onclick="setMode('long')">长休息 (15分钟)</button>
    </div>
    
    <div class="timer-display">
      <div class="timer-circle">
        <svg class="timer-svg" width="280" height="280">
          <circle class="timer-bg" cx="140" cy="140" r="130"/>
          <circle class="timer-progress" id="progressCircle" cx="140" cy="140" r="130"
                  stroke-dasharray="816.8" stroke-dashoffset="0"/>
        </svg>
        <div class="timer-content">
          <div class="timer-time" id="timerDisplay">25:00</div>
          <div class="timer-label" id="timerLabel">准备开始专注</div>
        </div>
      </div>
    </div>
    
    <div class="controls">
      <button class="btn btn-primary btn-large" id="mainBtn" onclick="toggleTimer()">开始专注</button>
      <button class="btn" onclick="resetTimer()">重置</button>
    </div>
    
    <div class="panel">
      <div class="panel-title">📝 当前任务</div>
      <input type="text" class="task-input" id="taskInput" placeholder="输入你要专注完成的任务...">
    </div>
    
    <div class="panel">
      <div class="panel-title">📊 今日统计</div>
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="todayCount">0</div>
          <div class="stat-label">完成番茄</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="todayMinutes">0</div>
          <div class="stat-label">专注分钟</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="totalCount">0</div>
          <div class="stat-label">累计番茄</div>
        </div>
      </div>
    </div>
    
    <div class="panel">
      <div class="panel-title">⏱️ 专注记录</div>
      <div class="history-list" id="historyList">
        <div class="empty-state">还没有专注记录，开始你的第一个番茄吧！</div>
      </div>
    </div>
    
    <div class="panel">
      <div class="panel-title">⚙️ 设置</div>
      <div class="settings-row">
        <span class="settings-label">专注时长</span>
        <div class="settings-control">
          <input type="number" class="settings-input" id="workTime" value="25" min="1" max="60">
          <span style="font-size: 13px; color: var(--color-muted);">分钟</span>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">短休息时长</span>
        <div class="settings-control">
          <input type="number" class="settings-input" id="shortTime" value="5" min="1" max="30">
          <span style="font-size: 13px; color: var(--color-muted);">分钟</span>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">长休息时长</span>
        <div class="settings-control">
          <input type="number" class="settings-input" id="longTime" value="15" min="1" max="60">
          <span style="font-size: 13px; color: var(--color-muted);">分钟</span>
        </div>
      </div>
      <div class="settings-row">
        <span class="settings-label">提示音</span>
        <div class="settings-control">
          <span class="sound-test" onclick="testSound()">试听</span>
          <div class="toggle active" id="soundToggle" onclick="toggleSound()"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let timer = null;
    let timeLeft = 25 * 60;
    let totalTime = 25 * 60;
    let isRunning = false;
    let currentMode = 'work';
    let soundEnabled = true;
    
    const modes = {
      work: { time: 25, color: '#ef4444', label: '专注中' },
      short: { time: 5, color: '#0abFA5', label: '短休息' },
      long: { time: 15, color: '#3b82f6', label: '长休息' }
    };
    
    // Load stats
    function loadStats() {
      const today = new Date().toDateString();
      const stats = JSON.parse(localStorage.getItem('pomodoro_stats') || '{}');
      const todayStats = stats[today] || { count: 0, minutes: 0 };
      const totalStats = stats.total || { count: 0, minutes: 0 };
      
      document.getElementById('todayCount').textContent = todayStats.count;
      document.getElementById('todayMinutes').textContent = todayStats.minutes;
      document.getElementById('totalCount').textContent = totalStats.count;
      
      loadHistory();
    }
    
    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('pomodoro_history') || '[]');
      const today = new Date().toDateString();
      const todayHistory = history.filter(h => h.date === today);
      
      const list = document.getElementById('historyList');
      if (todayHistory.length === 0) {
        list.innerHTML = '<div class="empty-state">还没有专注记录，开始你的第一个番茄吧！</div>';
        return;
      }
      
      list.innerHTML = todayHistory.slice(-10).reverse().map(h => `
        <div class="history-item">
          <div>
            <div class="history-task">${h.task || '未命名任务'}</div>
            <div class="history-time">${h.time}</div>
          </div>
          <div class="history-duration">${h.duration}分钟</div>
        </div>
      `).join('');
    }
    
    function setMode(mode) {
      currentMode = mode;
      const config = modes[mode];
      
      // Update UI
      document.querySelectorAll('.mode-tab').forEach(tab => tab.classList.remove('active', 'work', 'short', 'long'));
      event.target.classList.add('active', mode);
      
      // Update timer
      totalTime = config.time * 60;
      timeLeft = totalTime;
      updateDisplay();
      updateProgress();
      
      // Update colors
      const progressCircle = document.getElementById('progressCircle');
      progressCircle.style.stroke = config.color;
      document.getElementById('timerLabel').textContent = '准备开始' + config.label;
      
      resetTimer();
    }
    
    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }
    
    function startTimer() {
      if (!isRunning) {
        isRunning = true;
        document.getElementById('mainBtn').textContent = '暂停';
        document.getElementById('timerLabel').textContent = modes[currentMode].label;
        
        timer = setInterval(() => {
          timeLeft--;
          updateDisplay();
          updateProgress();
          
          if (timeLeft <= 0) {
            completeTimer();
          }
        }, 1000);
      }
    }
    
    function pauseTimer() {
      isRunning = false;
      clearInterval(timer);
      document.getElementById('mainBtn').textContent = '继续';
      document.getElementById('timerLabel').textContent = '已暂停';
    }
    
    function resetTimer() {
      isRunning = false;
      clearInterval(timer);
      const config = modes[currentMode];
      timeLeft = config.time * 60;
      totalTime = config.time * 60;
      updateDisplay();
      updateProgress();
      document.getElementById('mainBtn').textContent = currentMode === 'work' ? '开始专注' : '开始休息';
      document.getElementById('timerLabel').textContent = '准备开始' + config.label;
    }
    
    function completeTimer() {
      pauseTimer();
      playSound();
      
      if (currentMode === 'work') {
        saveSession();
        showNotification('专注完成！休息一下吧');
        document.getElementById('timerLabel').textContent = '专注完成！';
      } else {
        showNotification('休息结束，继续加油！');
        document.getElementById('timerLabel').textContent = '休息结束';
      }
    }
    
    function saveSession() {
      const task = document.getElementById('taskInput').value || '未命名任务';
      const duration = Math.round(totalTime / 60);
      const now = new Date();
      
      // Save to history
      const history = JSON.parse(localStorage.getItem('pomodoro_history') || '[]');
      history.push({
        task: task,
        duration: duration,
        date: now.toDateString(),
        time: now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
      });
      localStorage.setItem('pomodoro_history', JSON.stringify(history));
      
      // Update stats
      const today = now.toDateString();
      const stats = JSON.parse(localStorage.getItem('pomodoro_stats') || '{}');
      
      if (!stats[today]) stats[today] = { count: 0, minutes: 0 };
      stats[today].count++;
      stats[today].minutes += duration;
      
      if (!stats.total) stats.total = { count: 0, minutes: 0 };
      stats.total.count++;
      stats.total.minutes += duration;
      
      localStorage.setItem('pomodoro_stats', JSON.stringify(stats));
      loadStats();
    }
    
    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      document.getElementById('timerDisplay').textContent = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      document.title = `${minutes}:${String(seconds).padStart(2, '0')} - 番茄专注钟`;
    }
    
    function updateProgress() {
      const circle = document.getElementById('progressCircle');
      const circumference = 2 * Math.PI * 130;
      const offset = circumference - (timeLeft / totalTime) * circumference;
      circle.style.strokeDashoffset = offset;
    }
    
    function playSound() {
      if (!soundEnabled) return;
      
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      
      oscillator.frequency.value = 800;
      gainNode.gain.value = 0.3;
      
      oscillator.start();
      setTimeout(() => oscillator.stop(), 200);
    }
    
    function testSound() {
      playSound();
    }
    
    function toggleSound() {
      soundEnabled = !soundEnabled;
      document.getElementById('soundToggle').classList.toggle('active');
      localStorage.setItem('pomodoro_sound', soundEnabled);
    }
    
    function showNotification(msg) {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('番茄专注钟', { body: msg });
      } else {
        alert(msg);
      }
    }
    
    // Settings
    document.getElementById('workTime').addEventListener('change', (e) => {
      modes.work.time = parseInt(e.target.value);
      if (currentMode === 'work' && !isRunning) resetTimer();
    });
    document.getElementById('shortTime').addEventListener('change', (e) => {
      modes.short.time = parseInt(e.target.value);
    });
    document.getElementById('longTime').addEventListener('change', (e) => {
      modes.long.time = parseInt(e.target.value);
    });
    
    // Request notification permission
    if ('Notification' in window && Notification.permission === 'default') {
      Notification.requestPermission();
    }
    
    // Init
    soundEnabled = localStorage.getItem('pomodoro_sound') !== 'false';
    document.getElementById('soundToggle').classList.toggle('active', soundEnabled);
    loadStats();
    updateDisplay();
  </script>
</body>
</html>
