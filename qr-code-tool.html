<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>二维码生成/识别 - 小飞 AI 工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    :root {
      --color-primary: #0abFA5;
      --color-on-primary: #ffffff;
      --color-primary-hover: #08d9a3;
      --color-primary-soft: rgba(10, 191, 165, 0.08);
      --color-error: #ef4444;
      --color-success: #10b981;
      --color-ink: #1a1a2e;
      --color-body: #5c5c72;
      --color-muted: #9494a8;
      --color-canvas: #ffffff;
      --color-canvas-soft: #f8f9fb;
      --color-border: rgba(0, 0, 0, 0.07);
      --color-border-hover: rgba(10, 191, 165, 0.3);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --space-xs: 8px;
      --space-sm: 12px;
      --space-md: 16px;
      --space-lg: 24px;
      --font-sans: 'Inter', sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--color-canvas-soft);
      color: var(--color-ink);
      min-height: 100vh;
    }
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-border);
      height: 56px; display: flex; align-items: center;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      width: 100%;
    }
    .nav-logo {
      font-size: 16px; font-weight: 600; color: var(--color-ink);
      text-decoration: none;
    }
    .nav-logo span { color: var(--color-primary); }
    .nav-back {
      font-size: 14px; color: var(--color-body); text-decoration: none;
      display: flex; align-items: center; gap: 6px;
    }
    .nav-back:hover { color: var(--color-primary); }
    .container {
      max-width: 1200px; margin: 0 auto; padding: 24px;
    }
    .header {
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 24px; font-weight: 600; letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 14px; color: var(--color-body);
    }
    .tabs {
      display: flex; gap: 8px; margin-bottom: 24px;
      border-bottom: 1px solid var(--color-border);
      padding-bottom: 12px;
    }
    .tab {
      padding: 10px 20px; border: none; background: none;
      font-size: 14px; cursor: pointer; border-radius: var(--radius-sm);
      color: var(--color-body); transition: all 0.2s;
    }
    .tab:hover { color: var(--color-primary); }
    .tab.active {
      background: var(--color-primary-soft); color: var(--color-primary);
      font-weight: 500;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .panel {
      background: var(--color-canvas); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); padding: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block; font-size: 13px; font-weight: 500;
      color: var(--color-body); margin-bottom: 8px;
    }
    input[type="text"], input[type="number"], textarea, select {
      width: 100%; padding: 12px 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 14px; font-family: var(--font-sans);
      background: var(--color-canvas); color: var(--color-ink);
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus {
      outline: none; border-color: var(--color-primary);
    }
    textarea { min-height: 120px; resize: vertical; }
    .btn {
      padding: 12px 24px; border: 1px solid var(--color-border);
      background: var(--color-canvas); border-radius: var(--radius-sm);
      font-size: 14px; cursor: pointer; transition: all 0.2s;
      color: var(--color-body);
    }
    .btn:hover {
      border-color: var(--color-primary); color: var(--color-primary);
    }
    .btn-primary {
      background: var(--color-primary); color: var(--color-on-primary);
      border-color: var(--color-primary);
    }
    .btn-primary:hover {
      background: var(--color-primary-hover);
      color: var(--color-on-primary);
    }
    .btn-danger {
      background: var(--color-error); color: #fff;
      border-color: var(--color-error);
    }
    .result-area {
      margin-top: 24px; padding: 24px;
      background: var(--color-canvas-soft);
      border-radius: var(--radius-md);
      text-align: center;
      min-height: 280px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
    }
    .qr-display {
      padding: 20px; background: #fff;
      border-radius: var(--radius-md);
      margin-bottom: 16px;
    }
    .qr-display canvas, .qr-display img {
      display: block;
    }
    .drop-zone {
      border: 2px dashed var(--color-border);
      border-radius: var(--radius-md);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--color-primary);
      background: var(--color-primary-soft);
    }
    .drop-zone-icon {
      font-size: 48px; margin-bottom: 12px;
    }
    .drop-zone-text {
      font-size: 14px; color: var(--color-body);
    }
    .drop-zone-hint {
      font-size: 12px; color: var(--color-muted);
      margin-top: 8px;
    }
    .decoded-result {
      width: 100%; text-align: left;
      background: var(--color-canvas);
      padding: 16px; border-radius: var(--radius-sm);
      margin-top: 16px; word-break: break-all;
      font-family: var(--font-mono); font-size: 13px;
      border: 1px solid var(--color-border);
    }
    .decoded-result a {
      color: var(--color-primary); text-decoration: none;
    }
    .options-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 20px;
    }
    .status {
      padding: 12px 16px; border-radius: var(--radius-sm);
      font-size: 13px; margin-top: 16px;
    }
    .status.error {
      background: rgba(239, 68, 68, 0.1); color: var(--color-error);
    }
    .status.success {
      background: rgba(16, 185, 129, 0.1); color: var(--color-success);
    }
    @media (max-width: 600px) {
      .options-grid { grid-template-columns: 1fr; }
    }
  
    .icon {
      width: 1em;
      height: 1em;
      vertical-align: middle;
      display: inline-block;
    }
    .icon-lg {
      width: 1.5em;
      height: 1.5em;
    }
</style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">小飞<span> AI 工具</span></a>
      <a href="/" class="nav-back">← 返回首页</a>
    </div>
  </nav>
  
  <div class="container">
    <div class="header">
      <h1>二维码生成/识别</h1>
      <p>生成二维码、扫描二维码。纯浏览器处理，不上传任何数据。</p>
    </div>
    
    <div class="tabs">
      <button class="tab active" onclick="switchTab('generate')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg> 生成二维码</button>
      <button class="tab" onclick="switchTab('scan')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> 扫描二维码</button>
    </div>
    
    <!-- Generate Tab -->
    <div id="generate" class="tab-content active">
      <div class="panel">
        <div class="form-group">
          <label class="form-label">内容</label>
          <textarea id="qrText" placeholder="输入要生成二维码的内容，可以是网址、文本、联系方式等...">https://tool.pumf.top</textarea>
        </div>
        
        <div class="options-grid">
          <div class="form-group">
            <label class="form-label">尺寸 (px)</label>
            <input type="number" id="qrSize" value="200" min="100" max="500">
          </div>
          <div class="form-group">
            <label class="form-label">颜色</label>
            <input type="text" id="qrColor" value="#0abFA5" placeholder="#000000">
          </div>
          <div class="form-group">
            <label class="form-label">背景色</label>
            <input type="text" id="qrBgColor" value="#ffffff" placeholder="#ffffff">
          </div>
          <div class="form-group">
            <label class="form-label">容错率</label>
            <select id="qrLevel">
              <option value="1">L (低)</option>
              <option value="0" selected>M (中)</option>
              <option value="3">Q (较高)</option>
              <option value="2">H (高)</option>
            </select>
          </div>
        </div>
        
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <button class="btn btn-primary" onclick="generateQR()">生成二维码</button>
          <button class="btn" onclick="downloadQR()">下载 PNG</button>
          <button class="btn" onclick="clearGenerate()">清空</button>
        </div>
        
        <div class="result-area">
          <div id="qrResult" class="qr-display" style="display:none;"></div>
          <div id="qrPlaceholder">
            <div class="drop-zone-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg></div>
            <div class="drop-zone-text">二维码将在这里显示</div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Scan Tab -->
    <div id="scan" class="tab-content">
      <div class="panel">
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
          <div class="drop-zone-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></div>
          <div class="drop-zone-text">点击或拖拽上传图片</div>
          <div class="drop-zone-hint">支持 JPG、PNG、GIF、WebP 格式</div>
        </div>
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFile(event)">
        
        <div style="display: flex; gap: 12px; margin-top: 16px;">
          <button class="btn" onclick="pasteImage()"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg> 粘贴图片</button>
          <button class="btn btn-danger" onclick="clearScan()">清空</button>
        </div>
        
        <div class="result-area" id="scanResult" style="display:none;">
          <img id="uploadedImage" style="max-width: 100%; max-height: 300px; border-radius: var(--radius-sm);">
          <div id="scanOutput"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentQR = null;
    
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tab).classList.add('active');
    }
    
    function generateQR() {
      const text = document.getElementById('qrText').value;
      if (!text.trim()) {
        alert('请输入内容');
        return;
      }
      
      const size = parseInt(document.getElementById('qrSize').value) || 200;
      const color = document.getElementById('qrColor').value || '#0abFA5';
      const bgColor = document.getElementById('qrBgColor').value || '#ffffff';
      const level = parseInt(document.getElementById('qrLevel').value) || 0;
      
      const qrDiv = document.getElementById('qrResult');
      qrDiv.innerHTML = '';
      qrDiv.style.display = 'block';
      document.getElementById('qrPlaceholder').style.display = 'none';
      
      currentQR = new QRCode(qrDiv, {
        text: text,
        width: size,
        height: size,
        colorDark: color,
        colorLight: bgColor,
        correctLevel: level
      });
      
      localStorage.setItem('qr_text', text);
    }
    
    function downloadQR() {
      const canvas = document.querySelector('#qrResult canvas');
      if (!canvas) {
        alert('请先生成二维码');
        return;
      }
      const url = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = 'qrcode.png';
      a.click();
    }
    
    function clearGenerate() {
      document.getElementById('qrText').value = '';
      document.getElementById('qrResult').innerHTML = '';
      document.getElementById('qrResult').style.display = 'none';
      document.getElementById('qrPlaceholder').style.display = 'block';
      currentQR = null;
    }
    
    function handleFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      processImage(file);
    }
    
    function processImage(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          document.getElementById('scanResult').style.display = 'flex';
          document.getElementById('uploadedImage').src = e.target.result;
          scanQR(img);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }
    
    function scanQR(img) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, canvas.width, canvas.height);
      
      const output = document.getElementById('scanOutput');
      if (code) {
        let content = code.data;
        // Auto-detect URL
        if (content.match(/^https?:\/\//)) {
          content = `<a href="${content}" target="_blank">${content}</a>`;
        }
        output.innerHTML = `
          <div class="status success"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> 识别成功</div>
          <div class="decoded-result">${content}</div>
          <button class="btn" onclick="copyResult('${code.data.replace(/'/g, "\\'")}')">复制内容</button>
        `;
      } else {
        output.innerHTML = `
          <div class="status error"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg> 未检测到二维码</div>
          <p style="color: var(--color-muted); font-size: 13px; margin-top: 8px;">
            请确保图片清晰，二维码完整可见
          </p>
        `;
      }
    }
    
    function pasteImage() {
      navigator.clipboard.read().then(items => {
        for (let item of items) {
          if (item.types.includes('image/png') || item.types.includes('image/jpeg')) {
            item.getType(item.types[0]).then(blob => {
              const file = new File([blob], 'pasted.png', { type: blob.type });
              processImage(file);
            });
            return;
          }
        }
        alert('剪贴板中没有图片');
      }).catch(() => {
        alert('无法读取剪贴板，请使用上传功能');
      });
    }
    
    function copyResult(text) {
      navigator.clipboard.writeText(text);
      alert('已复制到剪贴板');
    }
    
    function clearScan() {
      document.getElementById('scanResult').style.display = 'none';
      document.getElementById('uploadedImage').src = '';
      document.getElementById('scanOutput').innerHTML = '';
    }
    
    // Drag and drop
    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragover');
    });
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file && file.type.startsWith('image/')) {
        processImage(file);
      }
    });
    
    // Init
    const savedText = localStorage.getItem('qr_text');
    if (savedText) document.getElementById('qrText').value = savedText;
  </script>
</body>
</html>
