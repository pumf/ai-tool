<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密码生成器 - 小飞 AI 工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primary: #0abFA5;
      --color-on-primary: #ffffff;
      --color-primary-hover: #08d9a3;
      --color-primary-soft: rgba(10, 191, 165, 0.08);
      --color-error: #ef4444;
      --color-success: #10b981;
      --color-warning: #f59e0b;
      --color-ink: #1a1a2e;
      --color-body: #5c5c72;
      --color-muted: #9494a8;
      --color-canvas: #ffffff;
      --color-canvas-soft: #f8f9fb;
      --color-border: rgba(0, 0, 0, 0.07);
      --color-border-hover: rgba(10, 191, 165, 0.3);
      --radius-sm: 6px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --space-xs: 8px;
      --space-sm: 12px;
      --space-md: 16px;
      --space-lg: 24px;
      --font-sans: 'Inter', sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--color-canvas-soft);
      color: var(--color-ink);
      min-height: 100vh;
    }
    .nav {
      position: sticky; top: 0; z-index: 100;
      background: var(--color-canvas);
      border-bottom: 1px solid var(--color-border);
      height: 56px; display: flex; align-items: center;
    }
    .nav-inner {
      max-width: 1200px; margin: 0 auto; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between;
      width: 100%;
    }
    .nav-logo {
      font-size: 16px; font-weight: 600; color: var(--color-ink);
      text-decoration: none;
    }
    .nav-logo span { color: var(--color-primary); }
    .nav-back {
      font-size: 14px; color: var(--color-body); text-decoration: none;
      display: flex; align-items: center; gap: 6px;
    }
    .nav-back:hover { color: var(--color-primary); }
    .container {
      max-width: 800px; margin: 0 auto; padding: 24px;
    }
    .header {
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 24px; font-weight: 600; letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .header p {
      font-size: 14px; color: var(--color-body);
    }
    .panel {
      background: var(--color-canvas); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); padding: 24px; margin-bottom: 20px;
    }
    .password-display {
      background: var(--color-canvas-soft);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 20px;
      font-family: var(--font-mono);
      font-size: 20px;
      text-align: center;
      letter-spacing: 2px;
      word-break: break-all;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      position: relative;
    }
    .password-actions {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      width: 32px; height: 32px;
      border: 1px solid var(--color-border);
      background: var(--color-canvas);
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .icon-btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .icon-btn svg {
      width: 16px; height: 16px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--color-ink);
    }
    .form-row {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .slider-container {
      flex: 1;
    }
    .slider-value {
      min-width: 60px;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 600;
      color: var(--color-primary);
    }
    input[type="range"] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--color-border);
      outline: none;
      -webkit-appearance: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--color-primary);
      cursor: pointer;
      transition: transform 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }
    .checkbox-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: var(--color-canvas-soft);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }
    .checkbox-item:hover {
      border-color: var(--color-primary);
    }
    .checkbox-item.active {
      border-color: var(--color-primary);
      background: var(--color-primary-soft);
    }
    .checkbox-item input {
      display: none;
    }
    .checkbox-box {
      width: 18px;
      height: 18px;
      border: 2px solid var(--color-border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .checkbox-item.active .checkbox-box {
      background: var(--color-primary);
      border-color: var(--color-primary);
    }
    .checkbox-box svg {
      width: 12px;
      height: 12px;
      color: white;
      opacity: 0;
    }
    .checkbox-item.active .checkbox-box svg {
      opacity: 1;
    }
    .checkbox-text {
      font-size: 14px;
      flex: 1;
    }
    .btn {
      width: 100%;
      padding: 14px 24px;
      border: none;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: var(--color-primary);
      color: var(--color-on-primary);
    }
    .btn-primary:hover {
      background: var(--color-primary-hover);
      transform: translateY(-1px);
    }
    .strength-bar {
      height: 4px;
      background: var(--color-border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 16px;
    }
    .strength-fill {
      height: 100%;
      border-radius: 2px;
      transition: all 0.3s;
    }
    .strength-label {
      font-size: 12px;
      color: var(--color-muted);
      margin-top: 8px;
      text-align: center;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--color-ink);
      color: white;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      font-size: 14px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 1000;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">小飞 <span>AI</span> 工具</a>
      <a href="/" class="nav-back">← 返回首页</a>
    </div>
  </nav>

  <div class="container">
    <div class="header">
      <h1>密码生成器</h1>
      <p>生成安全随机的密码，支持自定义长度和字符类型</p>
    </div>

    <div class="panel">
      <div class="password-display">
        <span id="passwordText">点击生成按钮创建密码</span>
        <div class="password-actions">
          <button class="icon-btn" onclick="copyPassword()" title="复制">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </button>
          <button class="icon-btn" onclick="generatePassword()" title="刷新">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6"></path>
              <path d="M1 20v-6h6"></path>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="strength-bar">
        <div class="strength-fill" id="strengthFill"></div>
      </div>
      <div class="strength-label" id="strengthLabel">请生成密码</div>
    </div>

    <div class="panel">
      <div class="form-group">
        <div class="form-row">
          <label class="form-label" style="flex: 1">密码长度</label>
          <span class="slider-value" id="lengthValue">16</span>
        </div>
        <div class="slider-container">
          <input type="range" id="lengthSlider" min="6" max="64" value="16" oninput="updateLength()">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">包含字符</label>
        <div class="checkbox-group">
          <div class="checkbox-item active" onclick="toggleCheckbox(this, 'lowercase')">
            <input type="checkbox" id="lowercase" checked>
            <div class="checkbox-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            <span class="checkbox-text">小写字母 (a-z)</span>
          </div>
          <div class="checkbox-item active" onclick="toggleCheckbox(this, 'uppercase')">
            <input type="checkbox" id="uppercase" checked>
            <div class="checkbox-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            <span class="checkbox-text">大写字母 (A-Z)</span>
          </div>
          <div class="checkbox-item active" onclick="toggleCheckbox(this, 'numbers')">
            <input type="checkbox" id="numbers" checked>
            <div class="checkbox-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            <span class="checkbox-text">数字 (0-9)</span>
          </div>
          <div class="checkbox-item active" onclick="toggleCheckbox(this, 'symbols')">
            <input type="checkbox" id="symbols" checked>
            <div class="checkbox-box">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
            </div>
            <span class="checkbox-text">特殊符号 (!@#$...)</span>
          </div>
        </div>
      </div>

      <button class="btn btn-primary" onclick="generatePassword()">生成密码</button>
    </div>
  </div>

  <div class="toast" id="toast">已复制到剪贴板</div>

  <script>
    const lowercaseChars = 'abcdefghijklmnopqrstuvwxyz';
    const uppercaseChars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const numberChars = '0123456789';
    const symbolChars = '!@#$%^&*()_+-=[]{}|;:,.<>?';

    function updateLength() {
      const slider = document.getElementById('lengthSlider');
      document.getElementById('lengthValue').textContent = slider.value;
    }

    function toggleCheckbox(item, id) {
      const checkbox = document.getElementById(id);
      checkbox.checked = !checkbox.checked;
      item.classList.toggle('active', checkbox.checked);
    }

    function generatePassword() {
      const length = parseInt(document.getElementById('lengthSlider').value);
      const useLowercase = document.getElementById('lowercase').checked;
      const useUppercase = document.getElementById('uppercase').checked;
      const useNumbers = document.getElementById('numbers').checked;
      const useSymbols = document.getElementById('symbols').checked;

      if (!useLowercase && !useUppercase && !useNumbers && !useSymbols) {
        showToast('请至少选择一种字符类型');
        return;
      }

      let charset = '';
      if (useLowercase) charset += lowercaseChars;
      if (useUppercase) charset += uppercaseChars;
      if (useNumbers) charset += numberChars;
      if (useSymbols) charset += symbolChars;

      let password = '';
      const array = new Uint32Array(length);
      crypto.getRandomValues(array);
      
      for (let i = 0; i < length; i++) {
        password += charset[array[i] % charset.length];
      }

      document.getElementById('passwordText').textContent = password;
      updateStrength(password);
    }

    function updateStrength(password) {
      let strength = 0;
      const length = password.length;
      
      if (length >= 8) strength += 1;
      if (length >= 12) strength += 1;
      if (length >= 16) strength += 1;
      if (/[a-z]/.test(password)) strength += 1;
      if (/[A-Z]/.test(password)) strength += 1;
      if (/[0-9]/.test(password)) strength += 1;
      if (/[^a-zA-Z0-9]/.test(password)) strength += 1;

      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      
      let width, color, text;
      
      if (strength <= 2) {
        width = '25%';
        color = '#ef4444';
        text = '弱';
      } else if (strength <= 4) {
        width = '50%';
        color = '#f59e0b';
        text = '中等';
      } else if (strength <= 6) {
        width = '75%';
        color = '#10b981';
        text = '强';
      } else {
        width = '100%';
        color = '#0abFA5';
        text = '非常强';
      }

      fill.style.width = width;
      fill.style.background = color;
      label.textContent = `密码强度：${text}`;
      label.style.color = color;
    }

    function copyPassword() {
      const password = document.getElementById('passwordText').textContent;
      if (password === '点击生成按钮创建密码') {
        showToast('请先生成密码');
        return;
      }
      
      navigator.clipboard.writeText(password).then(() => {
        showToast('已复制到剪贴板');
      });
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2000);
    }

    // 页面加载时生成一个默认密码
    window.onload = () => {
      generatePassword();
    };
  </script>
</body>
</html>
